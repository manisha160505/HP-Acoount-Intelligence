services:
  # Opt-in only. The team runs against a shared Atlas cluster, so `docker
  # compose up` should not start a second, unused database - and must not
  # wait on one. To work against a local database instead, set MONGODB_URI
  # to mongodb://mongodb:27017 in .env and start with:
  #     docker compose --profile local-db up
  mongodb:
    image: mongo:8.0
    container_name: hp_mongodb
    profiles: ["local-db"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: ./hp-backend
    container_name: hp_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # MONGODB_URI intentionally NOT overridden here. It used to be pinned to the
    # local mongodb service, which silently beat whatever .env said and made it
    # impossible to point a container at the shared cluster.
    volumes:
      - ./hp-backend/data:/app/data
    # No depends_on: mongodb. That service is behind the local-db profile, and
    # depending on a profiled service makes `docker compose up` fail outright.
    restart: always

  frontend:
    build: ./hp-frontend
    container_name: hp_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
