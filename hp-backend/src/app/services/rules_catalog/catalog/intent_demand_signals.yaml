- id: int_topics_table
  parent: null
  name: Research topics list
  kind: selection
  summary: Every research topic for the account, as received.
  purpose: Every research topic for the account, as received.
  logic: Each topic keeps its score (0-100) exactly as received. Topics are grouped by research theme
    from HP's topic list and sorted by score, highest first; topics without a numeric score are listed
    separately. Each row shows the topic, its score and any HP category the list assigns, and a topic
    marked for review carries a Review tag. Sellers can search, filter by score (70+, 85+) and sort A-Z.
    Where research activity leads and is grouped by HP category, the topics appear on the category cards
    and in the 'Other researched topics' dropdown instead.
  example:
    scenario: Topics Laptops 72, laptops 90 (repeat), 3D Printing 88, Zero Trust 'n/a'.
    steps:
    - The repeat 'laptops' is removed and the first row (72) is kept.
    - 'Zero Trust is excluded: its score is not a number.'
    - 'Sorted: 3D Printing 88, Laptops 72, Zero Trust (excluded).'
    result: 3D Printing 88 (High, 3D), Laptops 72 (Moderate, PC), Zero Trust listed separately with its
      non-numeric score; the repeat 'laptops' (90) is listed as removed.
    verified: true
    expect:
    - - - 3D Printing
        - 88
        - true
        - High
        - 3D
        - 3D
      - - Laptops
        - 72
        - true
        - Moderate
        - Devices & Endpoints
        - PC
      - - Zero Trust
        - null
        - false
        - null
        - Security
        - null
    - - topic_name: laptops
        composite_score: 90
        kept_score: 72
  output: The topics list and the list of repeats removed
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_build_topics
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  confidence: high
- id: int_topic_dedup_exclusion
  parent: int_topics_table
  name: Repeated and non-numeric topics
  kind: filter
  summary: Each topic is counted once, and only numeric scores enter a calculation.
  purpose: Each topic is counted once, and only numeric scores enter a calculation.
  logic: 'A topic name repeated in the same data (ignoring capital letters) is a duplicate: the first
    row is kept, and the repeat is listed under ''Not in any summary'' with both scores. The scores are
    never averaged. A topic whose score is not a number is listed under ''Not in any summary'' and left
    out of every calculation. It is never counted as 0.'
  example:
    scenario: Topic 'Zero Trust' with score 'n/a'.
    steps:
    - '''n/a'' is not a number.'
    result: Left out of calculations because the score 'n/a' is not a number; listed under 'Not in any
      summary'.
    verified: true
    expect: Composite Score 'n/a' is not a number
  output: Included flag and reason for exclusion
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_build_topics
  confidence: high
- id: int_intensity
  parent: int_topics_table
  name: Intensity label for a research score
  kind: score
  summary: Plain-language strength of a topic score.
  purpose: Plain-language strength of a topic score.
  logic: A score of 85 or more is High; 70-84 is Moderate; below 70 is Low. This is applied only to research-topic
    scores, never to HP's own category scores. The topics list's 70+ and 85+ filters use the same cut
    points.
  table:
    columns:
    - Research score
    - Intensity
    rows:
    - - '>= 85'
      - High
    - - 70-84
      - Moderate
    - - < 70
      - Low
  constants:
  - label: Intensity bands
    ref: py:app.services.hp.intent_topic_map:INTENSITY_BANDS
    stated:
    - - 85
      - High
    - - 70
      - Moderate
    - - 0
      - Low
  example:
    scenario: Scores 85, 84, 70, 69.
    steps:
    - 85 -> High; 84 and 70 -> Moderate; 69 -> Low.
    result: High, Moderate, Moderate, Low.
    verified: true
    expect:
    - High
    - Moderate
    - Moderate
    - Low
  output: Intensity per topic
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:INTENSITY_BANDS
  - hp-backend/src/app/services/hp/intent_topic_map.py:intensity
  - hp-frontend/src/app/dashboard/page.tsx:filteredTopics
  confidence: high
- id: int_dictionary_mapping
  parent: int_topics_table
  name: 'HP''s topic list: theme and HP category'
  kind: selection
  uses:
  - intent_dictionary
  summary: Labels each topic with a research theme and, only where the link is direct, an HP category.
  purpose: Labels each topic with a research theme and, only where the link is direct, an HP category.
  logic: 'Every term from HP''s topic list that appears as a whole word in the topic name is collected.
    When one matched term sits inside a longer one, only the longer term counts (''3d printing'' counts,
    not ''printing''). The terms'' themes decide the topic''s theme, and their HP categories decide its HP category.
    There are ten themes: Collaboration & Workplace, AI & Compute, Cloud & Infrastructure, Devices & Endpoints,
    Financial Services & Fintech, Security, E-commerce & Logistics, Print, 3D, and Other / Low Relevance.
    Only terms for devices (pc, laptop, desktop, notebook -> PC; workstation -> Workstation), collaboration
    (meeting room, video conferencing, headset, Zoom, Teams, Webex... -> Poly/Collaboration), print (printer,
    print, managed print, document management, scanning -> Print) and 3D (3d printing, additive manufacturing,
    3d printer -> 3D) carry an HP category. AI, Cloud & Infrastructure, Financial Services & Fintech,
    Security and E-commerce & Logistics never do. A topic with no matching term is Other / Low Relevance.
    The score is never changed.'
  constants:
  - label: Version of HP's topic list
    ref: py:app.services.hp.intent_topic_map:DICTIONARY_VERSION
    stated: intent-map-v2
  example:
    scenario: Topics '3D Printing', 'Managed Print Services', 'Meeting Room Solutions', 'Quantum Computing'.
    steps:
    - '''3d printing'' beats ''printing'' -> 3D / 3D.'
    - '''managed print'' -> Print / Print.'
    - '''meeting room'' -> Collaboration / Poly.'
    - No matching term -> Other / Low Relevance.
    result: '3D Printing: 3D theme, 3D category. Managed Print Services: Print theme, Print category.
      Meeting Room Solutions: Collaboration & Workplace theme, Poly/Collaboration category. Quantum Computing:
      Other / Low Relevance, no category.'
    verified: true
    expect:
    - - 3D Printing
      - 3D
      - 3D
    - - Managed Print Services
      - Print
      - Print
    - - Meeting Room Solutions
      - Collaboration & Workplace
      - Poly/Collaboration
    - - Quantum Computing
      - Other / Low Relevance
      - null
  output: Theme, HP category, matched terms and mapping status per topic
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:TERMS
  - hp-backend/src/app/services/hp/intent_topic_map.py:map_topic
  - hp-backend/src/app/services/hp/intent_topic_map.py:_drop_contained
  confidence: high
- id: int_mapping_conflicts
  parent: int_dictionary_mapping
  name: Topic list conflict and review rules
  kind: selection
  uses:
  - intent_dictionary
  summary: Gives an HP category only when the topic's link to it is clear.
  purpose: Gives an HP category only when the topic's link to it is clear.
  logic: If a topic fits two themes, the higher one in this order wins (3D > Print > Devices > Collaboration
    > AI > Security > Cloud > Finance > Commerce), and only the winner's terms can give an HP category.
    If a topic names two HP categories (for example laptops and workstations), the theme is kept, no HP
    category is given and the topic is flagged for review. If an HP-category term sits next to 'software',
    'advertising', 'marketing' or 'media', the topic is moved to Other and flagged. If there is no matching
    term but a near-miss word is present (for example 'ai', 'device', 'hardware', 'meeting', 'infrastructure',
    'risk', 'finance', 'delivery', '3d'), the topic goes to Other and is flagged for review.
  example:
    scenario: '''security: cloud security'', ''Laptops and Workstations'', ''Print Advertising''.'
    steps:
    - Security outranks Cloud -> Security.
    - PC and Workstation both named -> Devices, no category, flagged.
    - '''print'' next to ''advertising'' -> Other, flagged.'
    result: '''security: cloud security'': Security, no category, mapped. ''Laptops and Workstations'':
      Devices & Endpoints, no category, flagged. ''Print Advertising'': Other / Low Relevance, no category,
      flagged.'
    verified: true
    expect:
    - - 'security: cloud security'
      - Security
      - null
      - mapped
    - - Laptops and Workstations
      - Devices & Endpoints
      - null
      - flagged
    - - Print Advertising
      - Other / Low Relevance
      - null
      - flagged
  output: Mapping status and reason for the flag
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:THEME_PRECEDENCE
  - hp-backend/src/app/services/hp/intent_topic_map.py:NON_HARDWARE_QUALIFIERS
  - hp-backend/src/app/services/hp/intent_topic_map.py:NEAR_MISS_TERMS
  - hp-backend/src/app/services/hp/intent_topic_map.py:map_topic
  confidence: high
- id: int_hiring_linked_tag
  parent: int_topics_table
