# Rules page catalog for `intent_demand_signals`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: intent_demand_signals
purpose: Shows what the account is researching online, mapped to HP's five business categories (PC, Workstation,
  Poly/Collaboration, Print and 3D), and what its job postings say it is hiring for, with the matching
  HP products.
final_output: A 'So what for HP' box; an 'Intent across HP business units' chart and cards (one score
  per HP category, the topics behind it, a one-line read and a dropdown for the remaining topics); per-category
  cards with supporting research signals and confirming technologies; the full table of research topics;
  and a Hiring Signals section with job-posting and hybrid-role tiles, job-family bars, technology tags
  and one HP theme card per hiring theme.
how_it_combines: 'One intent source leads each account: the company''s online research activity where
  research data exists for the account''s website, otherwise HP''s own interest scores for its five product
  categories.

  - Accounts led by research activity: AI places each research topic in one of HP''s five categories,
  a category''s score is the average of its topics, and the remaining topics go to a long-tail dropdown.

  - Accounts led by HP''s own scores: the five category scores are shown as received.

  Each category then gets supporting signals, technology confirmation and an evidence tier, which sets
  how strongly the wording may speak.

  The Hiring Signals section below is independent: it counts job postings in the account''s country over
  the 12 months before the job data was collected and maps them to HP themes using the standard occupation
  code of each job.'
rules:
- id: int_lead_source
  parent: null
  name: Which intent source leads the tab
  kind: source
  summary: Decides whether the account's intent is told from its online research activity or from HP's
    own category interest scores.
  purpose: Decides whether the account's intent is told from its online research activity or from HP's
    own category interest scores.
  inputs:
  - The company's online research topics and their scores
  - The website and date the research data belongs to
  - HP's own interest scores for its five product categories
  logic: If the account has at least one usable research topic (it belongs to this company's website and
    has a numeric score), the research activity leads. The HP business-unit summary is then built from
    it, and HP's own category scores are left out of the 'So what for HP' box. If the account has no usable
    research topic, HP's own category scores lead. The two sources are never blended into one number.
  example:
    scenario: Astra has 4 research topics and also a row in HP's own category scores.
    steps:
    - Usable research topics exist -> research activity leads.
    result: The lead source is the research activity; the line of HP's own category scores is not printed
      in 'So what for HP'.
    verified: true
    expect: Bombora
  output: Which source leads the summary
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_summarise
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_bu_summary
  doc_source: Sahaj 27 Sep, quoted at hp-backend/src/app/services/extractors/intent_demand_signals.py:939-942
  confidence: high
- id: int_domain_match
  parent: int_lead_source
  name: Research data must belong to this account's organisation
  kind: selection
  summary: Prevents another company's research being shown.
  purpose: Prevents another company's research being shown.
  logic: 'The website the research data was collected for is tidied up (web prefix, ''www.'' and any path
    removed) and compared with the account''s website. It matches when the two are equal, when one is
    a subdomain of the other (health.nsw.gov.au and nsw.gov.au), or when the data''s website is on the
    confirmed list of websites the client accepted for the account (iag.com.au for IAG NZ, client 5 Oct;
    six more, e.g. nga.mil for NIS Korea, client 8 Oct).
    Anything else is a mismatch: the topics are not attached and the tab names both websites. No website
    on either side: unverified, and the topics are still shown. The observation date is the data''s date
    stamp (YYYYMMDD) when exactly one is present.'
  conditions:
  - Look-alike registered websites (posco-inc.com and posco.com) never match by rule
  - Research for a different company stays a mismatch unless the client confirmed it for this account
  example:
    scenario: 'Three accounts: NSW Health (health.nsw.gov.au) with data for nsw.gov.au; IAG NZ (iag.co.nz)
      with data for www.iag.com.au; Astra (astra.co.id) with data for acme-holdings.com.'
    steps:
    - 'NSW Health: nsw.gov.au is the parent of health.nsw.gov.au -> matched.'
    - 'IAG NZ: iag.com.au is on the confirmed list -> matched.'
    - 'Astra: acme-holdings.com is another organisation, never confirmed -> mismatch, topics dropped.'
    result: matched, matched, mismatch.
    verified: true
    expect:
    - - matched
      - subdomain
    - - matched
      - confirmed_alias
    - - mismatch
      - null
  output: Whether the data matches the account, and the observation date
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_match_provider_account
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:CONFIRMED_INTENT_DOMAINS
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  doc_source: Client, 5 Oct (issue list v3) - NSW Health and IAG NZ Bombora data
  confidence: high
- id: int_unavailable_states
  parent: int_lead_source
  name: What is shown when intent data is missing
  kind: display
  summary: Missing data is stated, never drawn as zero.
  purpose: Missing data is stated, never drawn as zero.
  logic: 'No research topics: the tab says that no intent topics are on file for this account. Research
    data for a different website: a ''No matched signal'' message. If there is no research data AND HP''s
    own category scores have no row for the account, the summary shows only that message. Empty sections
    are hidden rather than showing ''no data''.'
  example:
    scenario: Account with no research topics and no row in HP's own category scores.
    steps:
    - There are no research topics, so no intent data.
    - HP's own category scores have no match for the account.
    result: Both summaries show the unavailable message; no scores are shown.
  output: Availability flag and message
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  - hp-frontend/src/app/dashboard/page.tsx:sourceAMessage
  confidence: high
- id: int_topics_table
  parent: null
  name: Research topics table
  kind: selection
  summary: Every research topic for the account, as received.
  purpose: Every research topic for the account, as received.
  logic: Each topic keeps its score (0-100) exactly as received. Topics are sorted by score, highest first;
    topics without a numeric score go last. Each row also shows an intensity label, the research theme
    from HP's topic list, any HP category that list assigns, and whether the topic is staffing-related.
  example:
    scenario: Topics Laptops 72, laptops 90 (repeat), 3D Printing 88, Zero Trust 'n/a'.
    steps:
    - The repeat 'laptops' is removed and the first row (72) is kept.
    - 'Zero Trust is excluded: its score is not a number.'
    - 'Sorted: 3D Printing 88, Laptops 72, Zero Trust (excluded).'
    result: 3D Printing 88 (High, 3D), Laptops 72 (Moderate, PC), Zero Trust shown without a score; the
      repeat 'laptops' (90) is listed as removed.
    verified: true
    expect:
    - - - 3D Printing
        - 88
        - true
        - High
        - 3D
        - 3D
      - - Laptops
        - 72
        - true
        - Moderate
        - Devices & Endpoints
        - PC
      - - Zero Trust
        - null
        - false
        - null
        - Security
        - null
    - - topic_name: laptops
        composite_score: 90
        kept_score: 72
  output: The topics table and the list of repeats removed
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_build_topics
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  confidence: high
- id: int_topic_dedup_exclusion
  parent: int_topics_table
  name: Repeated and non-numeric topics
  kind: filter
  summary: Keeps the table honest without inventing values.
  purpose: Keeps the table honest without inventing values.
  logic: 'A topic name repeated in the same data (ignoring capital letters) is a duplicate: the first
    row is kept and the repeat is listed under ''duplicates removed'' with both scores. The scores are
    never averaged. A topic whose score is not a number stays in the table but is left out of every calculation,
    with the reason shown. It is not scored 0.'
  example:
    scenario: Topic 'Zero Trust' with score 'n/a'.
    steps:
    - '''n/a'' is not a number.'
    result: 'Left out of calculations, with the reason: the score ''n/a'' is not a number.'
    verified: true
    expect: Composite Score 'n/a' is not a number
  output: Included flag and reason for exclusion
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_build_topics
  confidence: high
- id: int_intensity
  parent: int_topics_table
  name: Intensity label for a research score
  kind: score
  summary: Plain-language strength of a topic score.
  purpose: Plain-language strength of a topic score.
  logic: A score of 85 or more is High; 70-84 is Moderate; below 70 is Low. This is applied only to research-topic
    scores, never to HP's own category scores. The topic table's 70+ and 85+ filter buttons use the same
    cut points.
  table:
    columns:
    - Research score
    - Intensity
    rows:
    - - '>= 85'
      - High
    - - 70-84
      - Moderate
    - - < 70
      - Low
  constants:
  - label: Intensity bands
    ref: py:app.services.hp.intent_topic_map:INTENSITY_BANDS
    stated:
    - - 85
      - High
    - - 70
      - Moderate
    - - 0
      - Low
  example:
    scenario: Scores 85, 84, 70, 69.
    steps:
    - 85 -> High; 84 and 70 -> Moderate; 69 -> Low.
    result: High, Moderate, Moderate, Low.
    verified: true
    expect:
    - High
    - Moderate
    - Moderate
    - Low
  output: Intensity per topic
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:INTENSITY_BANDS
  - hp-backend/src/app/services/hp/intent_topic_map.py:intensity
  - hp-frontend/src/app/dashboard/page.tsx:filteredTopics
  confidence: high
- id: int_dictionary_mapping
  parent: int_topics_table
  name: 'HP''s topic list: theme and HP category'
  kind: selection
  uses:
  - intent_dictionary
  summary: Labels each topic with a research theme and, only where the link is direct, an HP category.
  purpose: Labels each topic with a research theme and, only where the link is direct, an HP category.
  logic: 'Every term from HP''s topic list that appears as a whole word in the topic name is collected.
    A term contained in a longer matched term is dropped (''printing'' is dropped when ''3d printing''
    matched). The terms'' themes decide the topic''s theme, and their HP categories decide its HP category.
    There are ten themes: Collaboration & Workplace, AI & Compute, Cloud & Infrastructure, Devices & Endpoints,
    Financial Services & Fintech, Security, E-commerce & Logistics, Print, 3D, and Other / Low Relevance.
    Only terms for devices (pc, laptop, desktop, notebook -> PC; workstation -> Workstation), collaboration
    (meeting room, video conferencing, headset, Zoom, Teams, Webex... -> Poly/Collaboration), print (printer,
    print, managed print, document management, scanning -> Print) and 3D (3d printing, additive manufacturing,
    3d printer -> 3D) carry an HP category. AI, Cloud & Infrastructure, Financial Services & Fintech,
    Security and E-commerce & Logistics never do. A topic with no matching term is Other / Low Relevance.
    The score is never changed.'
  constants:
  - label: Version of HP's topic list
    ref: py:app.services.hp.intent_topic_map:DICTIONARY_VERSION
    stated: intent-map-v2
  example:
    scenario: Topics '3D Printing', 'Managed Print Services', 'Meeting Room Solutions', 'Quantum Computing'.
    steps:
    - '''3d printing'' beats ''printing'' -> 3D / 3D.'
    - '''managed print'' -> Print / Print.'
    - '''meeting room'' -> Collaboration / Poly.'
    - No matching term -> Other / Low Relevance.
    result: '3D Printing: 3D theme, 3D category. Managed Print Services: Print theme, Print category.
      Meeting Room Solutions: Collaboration & Workplace theme, Poly/Collaboration category. Quantum Computing:
      Other / Low Relevance, no category.'
    verified: true
    expect:
    - - 3D Printing
      - 3D
      - 3D
    - - Managed Print Services
      - Print
      - Print
    - - Meeting Room Solutions
      - Collaboration & Workplace
      - Poly/Collaboration
    - - Quantum Computing
      - Other / Low Relevance
      - null
  output: Theme, HP category, matched terms and mapping status per topic
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:TERMS
  - hp-backend/src/app/services/hp/intent_topic_map.py:map_topic
  - hp-backend/src/app/services/hp/intent_topic_map.py:_drop_contained
  confidence: high
- id: int_mapping_conflicts
  parent: int_dictionary_mapping
  name: Topic list conflict and review rules
  kind: selection
  uses:
  - intent_dictionary
  summary: Keeps doubtful topics out of HP categories.
  purpose: Keeps doubtful topics out of HP categories.
  logic: If a topic fits two themes, the higher one in this order wins (3D > Print > Devices > Collaboration
    > AI > Security > Cloud > Finance > Commerce), and only the winner's terms can give an HP category.
    If a topic names two HP categories (for example laptops and workstations), the theme is kept, no HP
    category is given and the topic is flagged for review. If an HP-category term sits next to 'software',
    'advertising', 'marketing' or 'media', the topic is moved to Other and flagged. If there is no matching
    term but a near-miss word is present (for example 'ai', 'device', 'hardware', 'meeting', 'infrastructure',
    'risk', 'finance', 'delivery', '3d'), the topic goes to Other and is flagged for review.
  example:
    scenario: '''security: cloud security'', ''Laptops and Workstations'', ''Print Advertising''.'
    steps:
    - Security outranks Cloud -> Security.
    - PC and Workstation both named -> Devices, no category, flagged.
    - '''print'' next to ''advertising'' -> Other, flagged.'
    result: '''security: cloud security'': Security, no category, mapped. ''Laptops and Workstations'':
      Devices & Endpoints, no category, flagged. ''Print Advertising'': Other / Low Relevance, no category,
      flagged.'
    verified: true
    expect:
    - - 'security: cloud security'
      - Security
      - null
      - mapped
    - - Laptops and Workstations
      - Devices & Endpoints
      - null
      - flagged
    - - Print Advertising
      - Other / Low Relevance
      - null
      - flagged
  output: Mapping status and reason for the flag
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:THEME_PRECEDENCE
  - hp-backend/src/app/services/hp/intent_topic_map.py:NON_HARDWARE_QUALIFIERS
  - hp-backend/src/app/services/hp/intent_topic_map.py:NEAR_MISS_TERMS
  - hp-backend/src/app/services/hp/intent_topic_map.py:map_topic
  confidence: high
- id: int_hiring_linked_tag
  parent: int_topics_table
  name: Staffing-related topic tag
  kind: selection
  summary: Marks research topics about staffing.
  purpose: Marks research topics about staffing.
  logic: 'A topic is staffing-related if it contains staffing, staff, recruitment, recruiting, hiring,
    onboarding, talent, layoff(s) or workforce as a whole word. HR software topics (for example ''hr tech:
    successfactors'') are not. The tag is kept, but the section that displayed it is no longer shown,
    at the client''s request.'
  example:
    scenario: '''Talent Acquisition'' and ''hr tech: successfactors''.'
    steps:
    - '''talent'' is present in the first only.'
    result: Yes for the first, no for the second.
    verified: true
    expect:
    - true
    - false
  output: Staffing-related flag
  sources:
  - hp-backend/src/app/services/hp/intent_topic_map.py:HIRING_TERMS
  - hp-backend/src/app/services/hp/intent_topic_map.py:is_hiring_linked
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_summarise
  confidence: high
- id: int_theme_stats
  parent: null
  name: 'Theme summary: highest and average'
  kind: score
  summary: Per research theme, how strong the research is.
  purpose: Per research theme, how strong the research is.
  logic: 'For each research theme, over the topics included in it: the topic count, the sum of scores,
    the highest score and the average (rounded to 1 decimal), plus the intensity of the highest score.
    The Other / Low Relevance theme also counts flagged topics.'
  formula: average = sum of topic scores / number of topics, rounded to 1 decimal
  example:
    scenario: 'Topics Laptops 80, 2-in-1 PCs 65, Workstations 89 (all Devices & Endpoints), Cloud: Kubernetes
      92.'
    steps:
    - 'Devices: count 3, highest 89, average (80+65+89)/3 = 78.0.'
    - 'Cloud: count 1, highest 92, average 92.0.'
    result: 'Cloud & Infrastructure: 1 topic, highest 92, average 92.0. Devices & Endpoints: 3 topics,
      highest 89, average 78.0.'
    verified: true
    expect:
    - - Cloud & Infrastructure
      - 1
      - 92
      - 92.0
    - - Devices & Endpoints
      - 3
      - 89
      - 78.0
  output: Summary per research theme
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_stats
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_summarise
  confidence: high
- id: int_category_file
  parent: null
  name: HP's own category interest scores
  kind: source
  summary: Reads the five HP category scores for the account as delivered.
  purpose: Reads the five HP category scores for the account as delivered.
  inputs:
  - HP's interest scores for its five product categories, with trend, buying stage and research details
  logic: 'The data holds, for each of HP''s five categories (for example ''PCs''), a score out of 100
    and supporting details: intent trend, buying stage, research volume, topics researched, keywords matched,
    related technologies, first and latest intent dates and the geographic source. The account''s row
    is found by website. If several runs exist, the latest run date wins. Category names are standardised
    (PCs -> PC, Workstations -> Workstation, Poly -> Poly/Collaboration, Printers -> Print, 3D Printers
    -> 3D). Empty markers (dashes, n/a, none, blank) are treated as empty, and cells holding several items
    are split into separate items. Scores are used exactly as received.'
  example:
    scenario: Astra has runs on 2026-08-01 and 2026-09-01.
    steps:
    - The latest run, 2026-09-01, is used.
    - PC 32 Consideration; Workstation 38 No Signal.
    result: The account matches. PC 32 (Consideration) has a signal; Workstation 38 (No Signal) does not.
    verified: true
    expect:
    - matched
    - '2026-09-01'
    - 2
    - PC:
      - 32
      - Consideration
      - true
      Workstation:
      - 38
      - No Signal
      - false
  output: Category scores and each category's main entry
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  - hp-backend/src/app/services/hp/intent_topic_map.py:CATEGORY_ALIASES
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4.docx section A (Intent input contract)
  confidence: high
- id: int_has_signal
  parent: int_category_file
  name: Does a category carry a signal?
  kind: selection
  summary: HP's own verdict on whether a score means something.
  purpose: HP's own verdict on whether a score means something.
  logic: A category has a signal when its score is present and not zero AND its buying stage is not blank
    and not 'No Signal'. A category that fails this still keeps its score on screen.
  example:
    scenario: Workstation 38 with stage 'No Signal'.
    steps:
    - The stage is 'No Signal'.
    result: No signal (the score of 38 is still shown).
    verified: true
    expect: false
  output: Signal yes or no
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  confidence: high
- id: int_trend_and_flags
  parent: int_category_file
  name: Trend label and keyword-noise flags
  kind: display
  summary: How the trend and noisy keywords are treated.
  purpose: How the trend and noisy keywords are treated.
  logic: The trend is shown as the label supplied with HP's category scores; it is not calculated by the
    app. The summary states that a trend is unavailable because only one data delivery exists. Flagging
    of noisy keywords is switched off, so no category is ever flagged or barred because of its keywords.
  constants:
  - label: Keywords treated as noise (none are set)
    ref: py:app.services.hp.intent_topic_map:NOISY_CATEGORY_TERMS
    stated: {}
  example:
    scenario: Any category.
    steps:
    - The list of noisy keywords is empty.
    result: No category is flagged.
    verified: true
    expect: []
  output: Trend label and keyword flags
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  - hp-backend/src/app/services/hp/intent_topic_map.py:NOISY_CATEGORY_TERMS
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  confidence: high
- id: int_top_check
  parent: int_category_file
  name: Stated top category check
  kind: guardrail
  summary: Checks the stated top category against the scores in the same row.
  purpose: Checks the stated top category against the scores in the same row.
  logic: The stated top HP category and top score are compared with the highest category score in the
    row. They count as consistent only if both match.
  example:
    scenario: The row states top 'Workstations' but gives no top score; the highest score is Workstation
      38.
    steps:
    - The category matches but the score is missing -> not consistent.
    result: Not consistent.
    verified: true
    expect: false
  output: Top-category consistency check
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  confidence: high
- id: int_supporting_signals
  parent: null
  name: Supporting research signals per HP category
  kind: selection
  summary: Shows which research backs each category and whether the account's technology confirms it.
  purpose: Shows which research backs each category and whether the account's technology confirms it.
  logic: For each category, each included research topic joins the FIRST signal family (in the order listed)
    whose topic terms it contains. For PC, Poly, Print and 3D, a topic containing 'software', 'advertising',
    'marketing' or 'media' joins nothing. A family is 'confirmed' when it has topics AND at least one
    of the account's technologies matches its technology terms. Families are listed confirmed first, then
    research without matching technology, then technology without research; within each group the family
    with the highest topic score comes first. These signals never change a category's score.
  table:
    columns:
    - Category
    - Signal family
    - Research topic terms
    - Technology terms
    rows:
    - - Workstation
      - GPT / LLMs
      - gpt, chatgpt, openai, llm(s), large language model, generative ai
      - openai, chatgpt, azure openai, gpt
    - - Workstation
      - AI chips / GPU
      - ai chips, gpu(s), graphics processing unit, ai compute
      - nvidia, cuda
    - - Workstation
      - Vector databases
      - vector database(s)
      - pinecone, weaviate, milvus, qdrant, chroma, pgvector
    - - Workstation
      - Data analytics
      - data analytics, analytics, data science
      - tableau, power bi, looker, qlik, cognos, spark, databricks, snowflake, sas
    - - Workstation
      - CAD / 3D design
      - cad, 3d rendering, 3d modeling, engineering simulation
      - autocad, autodesk, catia, solidworks, blender, siemens nx, creo, rhino
    - - Workstation
      - AI / Machine learning
      - ai, artificial intelligence, machine learning, ml
      - pytorch, keras, tensorflow, scikit-learn, mllib, sagemaker, azure machine learning, vertex ai,
        hugging face, databricks
    - - PC
      - PCs & endpoints
      - pc(s), laptop(s), desktop(s), notebook(s), endpoint(s), device management, windows 11
      - intune, jamf, workspace one, airwatch, windows 10, windows 11, microsoft windows os
    - - Poly/Collaboration
      - Video & unified communications
      - video collaboration/conferencing, unified communications, meeting room(s), huddle room, microsoft
        teams, zoom, webex, hybrid work
      - microsoft teams, zoom, webex, google meet, ringcentral, 8x8
    - - Print
      - Print & document workflow
      - printer(s), print, printing, managed print, document management
      - papercut, printix, uniflow, kofax, docuware
    - - 3D
      - Additive manufacturing
      - 3d printing, additive manufacturing, additive, prototyping
      - materialise, stratasys, formlabs, ultimaker, markforged
    - - 3D
      - CAD / 3D design
      - cad, 3d modeling, 3d design, 3d rendering
      - autocad, autodesk, catia, solidworks, blender, siemens nx, creo, fusion 360
  example:
    scenario: Workstation; topics CAD Software 81, GPU 77, Data Analytics 90; technologies AutoCAD, SolidWorks,
      NVIDIA, Intune, Google Analytics, Zoom.
    steps:
    - CAD Software -> CAD / 3D design, confirmed by AutoCAD and SolidWorks.
    - GPU -> AI chips / GPU, confirmed by NVIDIA.
    - Data Analytics -> Data analytics; no matching technology (Google Analytics does not count).
    - 'Order: confirmed CAD 81, confirmed GPU 77, then unconfirmed Data analytics 90.'
    result: CAD / 3D design (81, confirmed by AutoCAD and SolidWorks); AI chips / GPU (77, confirmed by
      NVIDIA); Data analytics (90, not confirmed).
    verified: true
    expect:
    - - CAD / 3D design
      - 81
      - true
      - - AutoCAD
        - SolidWorks
    - - AI chips / GPU
      - 77
      - true
      - - NVIDIA
    - - Data analytics
      - 90
