- id: int_top_check
  parent: int_category_file
  name: Stated top category check
  kind: guardrail
  summary: Checks the stated top category against the scores in the same row.
  purpose: Checks the stated top category against the scores in the same row.
  logic: The stated top HP category and top score are compared with the highest category score in the
