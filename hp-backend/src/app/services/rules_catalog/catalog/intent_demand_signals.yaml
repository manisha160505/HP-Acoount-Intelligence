  confidence: high
- id: int_theme_stats
  parent: null
  name: 'Theme summary: highest and average'
  kind: score
  summary: Per research theme, how strong the research is.
  purpose: Per research theme, how strong the research is.
  logic: 'For each research theme, over the topics included in it: the topic count, the sum of scores,
    the highest score and the average (rounded to 1 decimal), plus the intensity of the highest score.
    The Other / Low Relevance theme also counts flagged topics.'
  formula: average = sum of topic scores / number of topics, rounded to 1 decimal
  example:
    scenario: 'Topics Laptops 80, 2-in-1 PCs 65, Workstations 89 (all Devices & Endpoints), Cloud: Kubernetes
      92.'
    steps:
    - 'Devices: count 3, highest 89, average (80+65+89)/3 = 78.0.'
    - 'Cloud: count 1, highest 92, average 92.0.'
    result: 'Cloud & Infrastructure: 1 topic, highest 92, average 92.0. Devices & Endpoints: 3 topics,
      highest 89, average 78.0.'
    verified: true
    expect:
    - - Cloud & Infrastructure
      - 1
      - 92
      - 92.0
    - - Devices & Endpoints
      - 3
      - 89
      - 78.0
  output: Summary per research theme
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_stats
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_summarise
  confidence: high
- id: int_category_file
  parent: null
  name: HP's own category interest scores
  kind: source
  summary: Reads the five HP category scores for the account as delivered.
  purpose: Reads the five HP category scores for the account as delivered.
  inputs:
  - HP's interest scores for its five product categories, with trend, buying stage and research details
  logic: 'The data holds, for each of HP''s five categories (for example ''PCs''), a score out of 100
    and supporting details: intent trend, buying stage, research volume, topics researched, keywords matched,
    related technologies, first and latest intent dates and the geographic source. The account''s row
    is found by website. If several runs exist, the latest run date wins. Category names are standardised
    (PCs -> PC, Workstations -> Workstation, Poly -> Poly/Collaboration, Printers -> Print, 3D Printers
    -> 3D). Cells holding several items are split into separate items. Scores are used exactly as received.'
  example:
    scenario: Astra has runs on 2026-08-01 and 2026-09-01.
    steps:
    - The latest run, 2026-09-01, is used.
    - PC 32 at the Consideration stage; Workstation 38.
    result: The account matches. PC 32 (Consideration) carries a buying signal; Workstation 38 is shown
      as a score.
    verified: true
    expect:
    - matched
    - '2026-09-01'
    - 2
    - PC:
      - 32
      - Consideration
      - true
      Workstation:
      - 38
      - No Signal
      - false
  output: Category scores and each category's main entry
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  - hp-backend/src/app/services/hp/intent_topic_map.py:CATEGORY_ALIASES
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4.docx section A (Intent input contract)
  confidence: high
- id: int_has_signal
  parent: int_category_file
  name: Does a category carry a signal?
  kind: selection
  summary: Reads whether HP's own data marks a category score as a buying signal.
  purpose: Reads whether HP's own data marks a category score as a buying signal.
  logic: A category carries a signal when its score is above zero AND HP's data gives it a buying stage
    (for example Awareness or Consideration). Every category shows its score.
  example:
    scenario: Workstation 38, whose stage in HP's data is not a buying stage.
    steps:
    - A signal needs a buying stage such as Awareness or Consideration.
    result: Not a buying signal; the score of 38 is shown.
    verified: true
    expect: false
  output: Signal yes or no
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_parse_category_file
  confidence: high
