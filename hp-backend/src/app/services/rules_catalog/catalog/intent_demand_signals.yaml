# Rules page catalog for `intent_demand_signals`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: intent_demand_signals
purpose: Shows what the account is researching online, mapped to HP's five business categories (PC, Workstation,
  Poly/Collaboration, Print and 3D), and what its job postings say it is hiring for, with the matching
  HP products.
final_output: A 'So what for HP' box; an 'Intent across HP business units' chart and cards (one score
  per HP category, the topics behind it, a one-line read and a dropdown for the remaining topics); per-category
  cards with supporting research signals and confirming technologies; the list of research topics;
  and a Hiring Signals section with job-posting and hybrid-role tiles, job-family bars, technology tags
  and one HP theme card per hiring theme.
how_it_combines: 'One intent source leads each account: the company''s online research activity where
  research data exists for the account''s website, otherwise HP''s own interest scores for its five product
  categories.

  - Accounts led by research activity: AI places each research topic in one of HP''s five categories,
  a category''s score is the average of its topics, and the remaining topics go to a long-tail dropdown.

  - Accounts led by HP''s own scores: the five category scores are shown as received.

  Each category then gets supporting signals, technology confirmation and an evidence tier, which sets
  how strongly the wording may speak.

  The Hiring Signals section below is independent: it counts job postings in the account''s country over
  the 12 months before the job data was collected and maps them to HP themes using the standard occupation
  code of each job.'
rules:
- id: int_lead_source
  parent: null
  name: Which intent source leads the tab
  kind: source
  summary: Decides whether the account's intent is told from its online research activity or from HP's
    own category interest scores.
  purpose: Decides whether the account's intent is told from its online research activity or from HP's
    own category interest scores.
  inputs:
  - The company's online research topics and their scores
  - The website and date the research data belongs to
  - HP's own interest scores for its five product categories
  logic: If the account has at least one usable research topic (it belongs to this company's website and
    has a numeric score), the research activity leads, and the HP business-unit summary and the 'So what
    for HP' box are built from it. Otherwise HP's own category scores lead. The two sources are never blended
    into one number.
  example:
    scenario: Astra has 4 research topics and also a row in HP's own category scores.
    steps:
    - Usable research topics exist -> research activity leads.
    result: The lead source is the research activity; 'So what for HP' is built from the research, not
      from HP's own category scores.
    verified: true
    expect: Bombora
  output: Which source leads the summary
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_summarise
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_bu_summary
  doc_source: Sahaj 27 Sep, quoted at hp-backend/src/app/services/extractors/intent_demand_signals.py:939-942
  confidence: high
- id: int_domain_match
  parent: int_lead_source
  name: Research data is matched to the account's organisation
  kind: selection
  summary: Only research for the account's own organisation is used.
  purpose: Only research for the account's own organisation is used.
  logic: 'The website the research data was collected for is compared with the account''s website, ignoring
    the web prefix, ''www.'' and any path. It matches when the two are equal, when one is a subdomain of
    the other (health.nsw.gov.au and nsw.gov.au), or when the data''s website is on the account''s confirmed
    list (for example iag.com.au for IAG NZ and nga.mil for NIS Korea). A matched website is shown on the
    tab as verified. Research for any other website is not used for the account. The research date is
    the data''s date stamp, when the data carries a single one.'
  conditions:
  - Look-alike registered websites (posco-inc.com and posco.com) are treated as different organisations
  - Research for a different company is used only when its website is on the account's confirmed list
  example:
    scenario: 'Three accounts: NSW Health (health.nsw.gov.au) with data for nsw.gov.au; IAG NZ (iag.co.nz)
      with data for www.iag.com.au; Astra (astra.co.id) with data for acme-holdings.com.'
    steps:
    - 'NSW Health: nsw.gov.au is the parent of health.nsw.gov.au -> matched.'
    - 'IAG NZ: iag.com.au is on the confirmed list -> matched.'
    - 'Astra: acme-holdings.com is another organisation, not on the confirmed list -> mismatch, research
      not used.'
    result: matched, matched, mismatch.
    verified: true
    expect:
    - - matched
      - subdomain
    - - matched
      - confirmed_alias
    - - mismatch
      - null
  output: Whether the data matches the account, and the observation date
  sources:
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_match_provider_account
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:CONFIRMED_INTENT_DOMAINS
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:extract_intent_demand_signals
  doc_source: Client, 5 Oct (issue list v3) - NSW Health and IAG NZ Bombora data
  confidence: high
- id: int_unavailable_states
  parent: int_lead_source
  internal: true
  name: Sections follow the intent data on file
  kind: display
  summary: Each intent section appears when its data is on file; no score is drawn as zero.
  purpose: Each intent section appears when its data is on file; no score is drawn as zero.
  logic: When the account has no matched research topics, the research sections are left out and HP's
    own category scores lead where the account has them. When the account has neither source, the intent
    summary is left out of the tab. A score is never filled in as zero.
  example:
    scenario: Account with no research topics and no row in HP's own category scores.
    steps:
    - There are no research topics.
    - HP's own category scores have no row for the account.
    result: The intent summary is left out of the tab; no scores are shown.
  output: Which intent sections appear
  sources:
