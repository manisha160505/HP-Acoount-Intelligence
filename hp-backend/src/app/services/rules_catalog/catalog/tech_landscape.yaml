  kind: display
  summary: Orders the recommendation cards.
  purpose: Orders the recommendation cards.
  inputs:
  - Hardware candidates
  - Service cards
  logic: 'Hardware cards: Confirmed band first, then more approved facts first. Service cards follow in
    category order. There is no cap on the number of cards beyond the one-primary-and-separate-evidence
    selection (the older cap of 5 is not used).'
  example:
    scenario: Hardware cards A (Likely, 6 facts), B (Confirmed, 3 facts), C (Confirmed, 8 facts) and one
      service card.
    steps:
    - 'Confirmed first: C (8), B (3).'
    - Then A.
    - Then the service card.
    result: C, B, A, service card.
  output: The order of the recommendation cards.
  sources:
  - hp-backend/src/app/services/hp/recommendations.py:generate_hp_recommendations
  confidence: high
- id: tl_regeneration_cache
  parent: null
  name: When the recommendations are rebuilt
  kind: selection
  internal: true
  summary: Avoids asking AI again unless an input changed.
  purpose: Avoids asking AI again unless an input changed.
  inputs:
  - Version of the recommendation guidance
  - Product knowledge version and rulebook version
  - Matched rules
  - Account evidence texts
  - Headquarters location
  logic: A fingerprint of these inputs is stored. If the stored cards are available and the fingerprint
    is unchanged, they are reused. A change to any input rebuilds the cards.
  constants:
  - label: Recommendation guidance version
    ref: py:app.services.hp.recommendations:RECOMMENDATION_PROMPT_VERSION
    stated: 20
  - label: Confidence scoring settings version
    value: 5dcf1a1ce147
  example:
    scenario: The rulebook is reloaded.
    steps:
    - The rulebook version changes, so the fingerprint changes.
    result: Cards are rebuilt on the next run.
  output: The stored fingerprint.
  sources:
  - hp-backend/src/app/services/hp/recommendations.py:_fingerprint
  confidence: high
undetermined:
- strategic_read, what_it_means and per-vendor play_text/hp_product are written by GPT-4o; only the constraints
  in tl_map_narrative are fixed - the wording and which allowed HP line the model picks (before any rulebook
  override) have no formula.
- Which rulebook rules exist, and their signal_tokens/observable_terms, are loaded into MongoDB (hp_rulebook)
  by scripts/load_rulebook.py, where both term lists are derived by GPT-4o at load time; the live rule
  set is not in the repo, so which rules fire for a given account cannot be stated without the database.
- The lifecycle file contents (hp_lifecycle) and case-study corpus (hp_case_studies) live in MongoDB;
  examples here use synthetic rows.
- Part A rationale, why_this_product and discovery_question are model-written; there is no fixed formula,
  only the post-checks in tl_rec_llm_prose.
