- id: tl_rec_llm_prose
  parent: tl_hp_recommendations
  name: Rationale written by AI, then checked
  kind: guardrail
  summary: Explains a hardware card without letting AI choose products, facts or scores.
  purpose: Explains a hardware card without letting AI choose products, facts or scores.
  inputs:
  - The rule's condition
  - Up to 4 account evidence rows
  - Approved facts with qualifiers and conditions
  - Evidence tier and permitted language
  logic: 'The AI returns, for each card, a 2-3 sentence rationale, a 1-2 sentence ''why this product''
    that uses only approved facts, and one discovery question. Checks: numbers or links in the rationale
    or question that are not in the account''s evidence -> both are blanked. A ''why this product'' with
    any number that is not in that card''s approved facts -> blanked. Naming a Next Gen AI PC outside
    40-60 TOPS, or a product generation that the facts never state -> blanked. Any field that over-claims
    for its tier -> blanked (below Opportunity: no ''is relevant'' or ''strong fit''; Context Only: no
    ''recommend''; below Opportunity: no wording that says the account needs, requires, plans to, is evaluating
    or is replacing something). A blanked field is shown as missing, and the card stays.'
  example:
    scenario: 'Conversation Starter card prose: ''Astra needs to replace its endpoint antivirus. HP Wolf
      Security requires a supported Windows PC.'''
    steps:
    - Sentence 1 has the account as its subject and says 'needs' -> fault.
    - Sentence 2 starts with HP, so 'requires' is a product condition -> allowed.
    result: One fault; the field is blanked.
    computed_value: 1
    verified: true
    expect: 1
  output: The rationale, 'why this product' and discovery question (or blank), and a report of the checks.
  sources:
