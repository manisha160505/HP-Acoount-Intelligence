  logic: The card's technology category is mapped to one HP business category, and only that category's
    score is used. A score of 50 or more gives 10; 25 to 49 gives 5; below 25, missing, or not a number
    gives 0. If the research record does not match the account's domain, every card is treated as 'missing'
    (0). Categories with no HP business counterpart always score 0.
