- id: tl_rec_rule_matching
  parent: tl_hp_recommendations
  name: Which rulebook rules the evidence earns
  kind: selection
  uses:
  - hp_rulebook
  summary: Selects candidate rules strictly from the account's own evidence.
  purpose: Selects candidate rules strictly from the account's own evidence.
  inputs:
  - Evidence rows
  - Rulebook rules (signal terms and observable terms prepared in advance)
  - Account country
  logic: 'A rule fires when any of its terms appears (as a whole word) in an evidence entry that is not
    a known look-alike phrase (for example ''vehicle fleet'', ''tokenization'', ''social collaboration'').
    Terms made only of ubiquitous vendors and generic words (for example ''sap erp'', ''microsoft teams'')
    are ''indicative'' and cannot earn a rule. A rule that only routes to another offering must also match
    one of its observable terms. A rule with no qualifying term is refused. HP Wolf Security offerings
    limited to HP PCs are refused when no HP client hardware is in the evidence. HP IQ rules are refused
    outside the United States. A testable condition that the account contradicts (only country today)
    refuses the rule. Conditions that cannot be tested are kept and shown as ''unverified''. Within a
    family at most 3 standalone rules are kept (modifiers are uncapped). Order: more distinct qualifying
    terms, then more terms, then more evidence entries, then routing order, then rulebook order.'
  constants:
  - label: Max rules per family
    ref: py:app.services.hp.rulebook:MAX_RULES_PER_FAMILY
    stated: 3
  example:
    scenario: 'Indonesia account; evidence: ''Kaspersky Endpoint Security'', ''Symantec Endpoint Protection'',
      ''IT Help Desk Analyst - high ticket volume'', ''SAP ERP''. Rules: security rule A (kaspersky, symantec
      endpoint protection), security rule B (kaspersky), support rule (help desk, ticket volume; seat-count
      condition), print rule (sap erp), HP IQ rule (kaspersky).'
    steps:
    - The HP IQ rule is blocked (not United States).
    - The print rule matched only 'sap erp', which is indicative - refused.
    - Security rule A has 2 qualifying terms, the support rule has 2, and security rule B has 1.
    - The support rule keeps its seat-count condition as unverified.
    result: 'Candidates in order: security rule A, support rule, security rule B; the print rule is reported
      as refused.'
    computed_value:
    - - WOLF 09
      - CARE 03
      - WOLF 10
    - - PRINT 21
    verified: true
    expect:
    - - WOLF 09
      - CARE 03
      - WOLF 10
    - - PRINT 21
  output: Ranked candidate rules, and refused rules with reasons.
  sources:
