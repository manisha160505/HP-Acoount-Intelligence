- id: tl_rec_lifecycle
  parent: tl_hp_recommendations
  name: Lifecycle check
  kind: guardrail
  uses:
  - hp_lifecycle
  summary: Never recommends an HP product past its end-of-life date; flags one approaching it.
  purpose: Never recommends an HP product past its end-of-life date; flags one approaching it.
  inputs:
  - Offering name of the rule
  - HP lifecycle records (product, generation markers, identity words, end dates)
  - Today's date
  logic: The offering matches a lifecycle row only if they share a generation marker (for example G1i)
    and at least 2 distinctive words. Not listed -> recommendable. Listed and the LATEST end date has
    passed -> not recommendable (reported as a blocked rule). Listed and the EARLIEST end date has passed,
    or the latest is within 180 days -> recommendable with the flag 'approaching lifecycle end'. Otherwise
    it is listed with end dates in the future. If the lifecycle list cannot be read, the product is recommended.
  constants:
  - label: Approaching window (days)
    ref: py:app.services.hp.lifecycle:APPROACHING_WITHIN_DAYS
    stated: 180
  - label: Minimum shared words
    ref: py:app.services.hp.lifecycle:MIN_SHARED_WORDS
    stated: 2
  example:
    scenario: Today 2026-10-05. The lifecycle list has HP EliteBook 8 G1i (ends 2026-03-01 to 2027-01-31)
      and HP ProBook 4 G1i (ends 2025-01-01 to 2026-06-30).
    steps:
    - '''HP EliteBook 8 G1i Series'': the earliest date has passed, the latest has not -> approaching.'
    - '''HP ProBook 4 G1i'': the latest date has passed -> past end, not recommended.'
    - '''HP EliteBook 8 G2 Series'': no G2 row -> not listed, recommended.'
    result: Approaching / past end / not listed.
    computed_value:
    - approaching
    - past_end
    - not_listed
    verified: true
    expect:
    - approaching
    - past_end
    - not_listed
  output: A lifecycle status on each recommendation; products past their end date appear as blocked rules.
  sources:
  - hp-backend/src/app/services/hp/lifecycle.py:status_for
  - hp-backend/src/app/services/hp/lifecycle.py:_match
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4 section J
  confidence: high
- id: tl_rec_fact_guardrails
  parent: tl_hp_recommendations
  name: Which HP facts a card may state
  kind: guardrail
  summary: Filters each rule's approved sentences for the account's market and wording rules.
  purpose: Filters each rule's approved sentences for the account's market and wording rules.
  inputs:
  - The rule's allowed facts and conditions
  - Account country
  logic: 'Facts come only from the matched rule. A fact is withheld when: it is a superlative (world''s,
    most, best, first, only, fastest, leading...) and the country is on the superlative-block list; the
    rule names a competitor and the country is on the competitor-block list; it is a comparison (a %,
    higher, better, faster, less) in a competitor rule without benchmark context (Cinebench, Procyon,
    MobileMark, tested, benchmark...); or it mentions 5G, HP Go, Wi-Fi 7, Sure View, discrete graphics
    or ''up to N displays'' without its required qualifier. Kept facts carry the rule''s conditions as
    footnotes. If every fact is withheld, the rule is blocked.'
  example:
    scenario: 'United States; facts of a competitor rule: ''up to 85% higher CPU performance'' (no benchmark),
      ''up to 61% better office productivity on the cited Procyon test'', ''Sure View privacy screen'',
      ''optional Sure View on select models''.'
    steps:
    - 'Fact 1: a comparison with no benchmark -> withheld.'
    - 'Fact 2: names ''Procyon'' -> kept.'
    - 'Fact 3: Sure View with no ''optional / where supported / select'' -> withheld.'
    - 'Fact 4: has ''optional'' -> kept.'
    result: 2 facts kept.
    computed_value:
    - - up to 61% better office productivity on the cited Procyon test
      - optional Sure View on select models
    - - G5 benchmark context
      - G6/G7 missing qualifier
    verified: true
    expect:
    - - up to 61% better office productivity on the cited Procyon test
      - optional Sure View on select models
    - - G5 benchmark context
      - G6/G7 missing qualifier
  output: Approved facts (max 8 per card) and a summary of what was withheld.
  sources:
