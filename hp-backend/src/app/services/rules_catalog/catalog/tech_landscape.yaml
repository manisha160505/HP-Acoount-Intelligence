# Rules page catalog for `tech_landscape`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: tech_landscape
purpose: Shows which technologies the account runs, how they relate to HP (compete, complement, open opportunity
  or context), and which HP products and services the account's own evidence supports.
final_output: A Technographic Map of up to seven HP categories, each with vendor cards (detected names,
  a risk chip, an HP line with a one-line play, and a detection status), a 'What it means for HP' paragraph
  and optional case-study proof; context lines about integration routes; the whole technology list grouped
  by family; the full technology matrix, the detection records and the website technology list; and HP
  Product Recommendation cards placed under the category they concern.
how_it_combines: 'The detected technology (the installed technology, or website technology only when there
  is none) is sorted into seven fixed HP categories and labelled by its relationship to HP. Each vendor
  card gets a confidence score: Driver 1, technology evidence ({{scoring:tech_confidence.weights.technology_evidence|pct}}),
  plus Driver 2, HP-category intent ({{scoring:tech_confidence.weights.intent_support|pct}}). A card whose
  Driver 1 is 0 is not created. The percentage itself is no longer displayed. AI writes the narrative
  within fixed limits, and HP''s approved sales rulebook overrides its HP line where a rule names the
  technology. HP Product Recommendations are chosen by fixed rules from the rulebook. AI writes only the
  rationale, which is then checked.'
rules:
- id: tl_technology_sources
  parent: null
  name: Which technologies count as detected
  kind: source
  summary: Decides the list of technologies the whole Technographic Map works from, and where each one
    came from.
  purpose: Decides the list of technologies the whole Technographic Map works from, and where each one
    came from.
  inputs:
  - 'Installed technology: the full technology list (first record only)'
  - 'HP category research data: the related technologies for each HP category (only when its record matches
    the account''s domain)'
  - Technology detected on the company's website (first record only)
  - 'Website technology breakdown: every column except ID, status and SEO columns'
  logic: 'Technologies are collected in this order and de-duplicated without regard to case. The first
    list to name a technology keeps it. 1) Every comma-separated entry of the installed technology list
    (the installed estate). 2) Every related technology listed in the HP category research data, for every
    category, when that data''s record matches the account''s domain. 3) Only if step 1 found nothing:
    the website technology lists - the technology detected on the company''s website and every cell of
    the website technology breakdown (the text before a '':'' is a vendor grouping and is dropped). Each
    technology keeps the list that named it, and the map records whether it rests on the installed estate
    or on website technology only.'
  conditions:
  - Whether the website lists are read is decided on the installed technology list alone. Related technologies
    from the HP category research data never stop the website fallback.
  - 'Website breakdown columns skipped: business id, status, indexed status, established, parked, umbrella,
    document info, SEO meta, SEO headers, SEO title, language, mobile.'
  - Values 'nan', 'none', 'null' and blanks are ignored.
  example:
    scenario: An account whose installed technology list is 'Microsoft Windows 10, Microsoft Intune, Kaspersky',
      whose HP category research data names Microsoft Intune and ServiceNow as related technologies, and
      whose website technology lists Akamai and Google Analytics.
    steps:
    - The installed technology list gives 3 technologies, so the estate is not empty.
    - The category research data adds ServiceNow (Microsoft Intune is already in the list, so it is not
      added twice).
    - Because the estate has 3 entries, the website lists are not read at all.
    result: '4 technologies: Microsoft Windows 10, Microsoft Intune and Kaspersky (installed technology)
      and ServiceNow (category research data); basis ''installed estate''; Akamai and Google Analytics
      are not used.'
    computed_value:
    - - Microsoft Windows 10
      - Microsoft Intune
      - Kaspersky
      - ServiceNow
    - microsoft windows 10: technographics
      microsoft intune: technographics
      kaspersky: technographics
      servicenow: hp_category_intent
    - estate_technologies: 3
      website_technologies: 0
      website_sources_used: false
      basis: installed estate
    verified: true
    expect:
    - - Microsoft Windows 10
      - Microsoft Intune
      - Kaspersky
      - ServiceNow
    - microsoft windows 10: technographics
      microsoft intune: technographics
      kaspersky: technographics
      servicenow: hp_category_intent
    - estate_technologies: 3
      website_technologies: 0
      website_sources_used: false
      basis: installed estate
  output: The list of detected technologies, where each one came from, and a basis label (installed estate,
    website technology only, or no technology detected).
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:detected_technologies
  - hp-backend/src/app/services/extractors/tech_landscape.py:_breakdown_technologies
  - hp-backend/src/app/services/extractors/tech_landscape.py:_hp_category_file
  doc_source: HP_Tech_Landscape_Confidence_Scoring_Logic_FINAL section 2 (Driver 1 sources)
  confidence: high
- id: tl_website_fallback
  parent: tl_technology_sources
  name: Website technology is used only when there is no installed estate
  kind: source
  summary: Stops a category card from resting on a CDN or analytics script when real installed-estate
    data exists.
  purpose: Stops a category card from resting on a CDN or analytics script when real installed-estate
    data exists.
  inputs:
  - Technology detected on the company's website
  - Website technology breakdown
  logic: The website lists are read only when the installed technology list produced zero technologies.
    When they are used, every technology still carries where it came from, so a card built on website
    evidence shows that.
  example:
    scenario: 'No installed technology record; the website list says ''Akamai, Google Analytics''; the
      website breakdown''s Hosting cell says ''Other: Akamai Hosted, AWS''.'
    steps:
    - The estate count is 0, so the website lists are read.
    - The website list adds Akamai and Google Analytics.
    - 'The breakdown cell ''Other: Akamai Hosted, AWS'' loses its ''Other:'' grouping label and adds Akamai
      Hosted and AWS.'
    result: 4 website technologies; basis 'website technology only - no installed technology record for
      this account'.
    computed_value:
      estate_technologies: 0
      website_technologies: 4
      website_sources_used: true
      basis: website technology only - no Technographics row for this account
    verified: true
    expect:
      estate_technologies: 0
      website_technologies: 4
      website_sources_used: true
      basis: website technology only - no Technographics row for this account
  output: A technology basis note shown on the map and on the technology matrix.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:detected_technologies
  doc_source: Client instruction quoted in code (Dhruvi, 27 Sep), hp-backend/src/app/services/extractors/tech_landscape.py
    lines 650-678
  confidence: high
- id: tl_category_cards
  parent: null
  name: Seven fixed HP technology categories
  kind: display
  summary: Builds the Technographic Map's category blocks by looking for named vendors in the detected
    technology list.
  purpose: Builds the Technographic Map's category blocks by looking for named vendors in the detected
    technology list.
  inputs:
  - Detected technology list (see the rule on which technologies count as detected)
  logic: The map always uses the same seven categories, in this order. For each one, the system looks
    for keywords inside each detected technology name. A keyword must appear as a whole word (no letter
    or digit on either side), so 'g suite' does not match 'Marketing Suite'. Each vendor row found records
    the exact detected names it matched. A category with no matching vendor is left out, except PC/Laptop
    Brands and Print Fleet, which are always shown because they carry an HP whitespace row when HP is
    absent.
  conditions:
  - '''azure ad'' does not count as Intune; bare ''vmware'' does not count as Workspace ONE.'
  - AI/ML frameworks are a separate row from NVIDIA and are described as not evidencing GPU hardware.
  table:
    columns:
    - Order
    - Category
    - Vendor row
    - Keywords (whole-word match)
    - Category badge
    rows:
    - - 1
      - Client OS
      - Microsoft
      - windows, microsoft windows
      - Contextual - no direct HP line
    - - 1
      - Client OS
      - Apple
      - macos, mac os, osx, os x, ios, ipados, apple ios
      - Contextual - no direct HP line
    - - 1
      - Client OS
      - Linux / Enterprise OS
      - linux, centos, ubuntu, red hat, redhat, debian, suse, fedora, unix, solaris, aix
      - Contextual - no direct HP line
    - - 2
      - PC/Laptop Brands
      - Dell (SAN) / Huawei / Lenovo / MSI
      - dell / huawei / lenovo / msi (client devices only, see the rule on network and server equipment)
      - Displacement opportunity
    - - 2
      - PC/Laptop Brands
      - HP Inc. (whitespace)
      - 'added when none of: hp inc, hewlett packard, elitebook, probook'
      - Displacement opportunity
    - - 3
      - UEM/MDM
      - Jamf / Microsoft Intune / VMware Workspace ONE / AirWatch
      - jamf / intune / workspace one, airwatch
      - Complementary attach
    - - 4
      - Workstations & High-Performance Compute
      - NVIDIA CUDA / GPUs
      - nvidia, cuda
      - Displacement opportunity
    - - 4
      - Workstations & High-Performance Compute
      - AI / ML frameworks
      - pytorch, keras, tensorflow, spark mllib
      - Displacement opportunity
    - - 4
      - Workstations & High-Performance Compute
      - AutoCAD / Autodesk
      - autocad, autodesk, catia, solidworks, blender
      - Displacement opportunity
    - - 5
      - IT Security & Endpoint Protection
      - Aruba ClearPass / Cloudflare / Symantec / Kaspersky
      - aruba clearpass, aruba networks / cloudflare / kaspersky, symantec
      - Complementary attach
    - - 6
      - Collaboration & Hybrid Workplace
      - Google Workspace / Atlassian Cloud
      - google workspace, g suite, google sheets / atlassian cloud, jira software, confluence
      - Complementary attach
    - - 7
      - Print Fleet & Document Infrastructure
      - HP Inc. Print (whitespace)
      - 'added when none of: hp print, managed print, laserjet'
      - HP whitespace - open opportunity
  example:
    scenario: Is 'Adobe Digital Marketing Suite' evidence of Google Workspace (keyword 'g suite')?
    steps:
    - The keyword 'g suite' appears inside 'marketin(g suite)'.
    - The character before 'g' is the letter 'n', so the whole-word test fails.
    result: No match - the Collaboration card is not created from this entry.
    computed_value: false
    verified: true
    expect: false
  output: Up to seven categories, each with a name, a badge and vendor rows.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:extract_tech_landscape
  - hp-backend/src/app/services/extractors/tech_landscape.py:_kw_in
  confidence: high
- id: tl_client_os_keywords
  parent: tl_category_cards
  name: Client OS keywords come from the same table as the Urgency score
  kind: selection
  summary: Keeps the Client OS card and the Urgency score's OS count in agreement.
  purpose: Keeps the Client OS card and the Urgency score's OS count in agreement.
  inputs:
  - Detected technology list
  logic: The Microsoft, Apple and Linux keyword lists are taken from the Urgency score's operating-system
    table. Linux also gets unix, solaris and aix. ChromeOS and Android are not put on this card.
  constants:
  - label: Windows keywords
    ref: py:app.services.extractors.tech_landscape:CLIENT_OS_WINDOWS
    stated:
    - windows
    - microsoft windows
  - label: Apple keywords
    ref: py:app.services.extractors.tech_landscape:CLIENT_OS_APPLE
    stated:
    - macos
    - mac os
    - osx
    - os x
    - ios
    - ipados
    - apple ios
  - label: Linux/Unix keywords
    ref: py:app.services.extractors.tech_landscape:CLIENT_OS_LINUX
    stated:
    - linux
    - centos
    - ubuntu
    - red hat
    - redhat
    - debian
    - suse
    - fedora
    - unix
    - solaris
    - aix
  example:
    scenario: The technology data says 'Mac OS X 10.15'.
    steps:
    - Each Apple keyword is tested as a whole word against 'mac os x 10.15'.
    - '''mac os'' and ''os x'' match; ''macos'' does not (no space).'
    result: An Apple vendor row is created, citing 'Mac OS X 10.15'.
    computed_value:
    - mac os
    - os x
    verified: true
    expect:
    - mac os
    - os x
  output: Client OS vendor rows.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py
  - hp-backend/src/app/services/dashboard/urgency.py:OS_FAMILIES
  confidence: high
- id: tl_non_client_device_filter
  parent: tl_category_cards
  name: Network and server equipment is not a PC brand
  kind: filter
  summary: Stops a firewall or storage array from creating a PC/Laptop Brands competitor.
  purpose: Stops a firewall or storage array from creating a PC/Laptop Brands competitor.
  inputs:
  - detected technology list
  logic: 'For the PC/Laptop Brands vendors only, a detected entry containing any of these words (found
    anywhere in the name) is ignored: firewall, router, switch, server, storage, san, nas, gateway, access
    point, load balancer.'
  constants:
  - label: Non-client terms
    value:
    - firewall
    - router
    - switch
    - server
    - storage
    - san
    - nas
    - gateway
    - access point
    - load balancer
  example:
    scenario: The stack contains 'Huawei Firewall' and 'Lenovo ThinkPad'.
    steps:
    - '''huawei firewall'' contains ''firewall'', so it is not a client device.'
    - '''lenovo thinkpad'' contains none of the terms and matches ''lenovo''.'
    result: PC/Laptop Brands shows Lenovo only; no Huawei row.
  output: PC/Laptop Brands vendor rows.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py
  confidence: high
- id: tl_whitespace_rows
  parent: tl_category_cards
  name: HP whitespace rows for PCs and Print
  kind: selection
  summary: Shows HP's own absence as an open opportunity rather than leaving the category empty.
  purpose: Shows HP's own absence as an open opportunity rather than leaving the category empty.
  inputs:
  - detected technology list
  - account name
  logic: 'PC/Laptop Brands: if no detected entry matches ''hp inc'', ''hewlett packard'', ''elitebook''
    or ''probook'', an ''HP Inc.'' row marked whitespace is added (''No HP client hardware detected in
    current <account> fleet''). Print Fleet: if none matches ''hp print'', ''managed print'' or ''laserjet'',
    an ''HP Inc. Print'' whitespace row is added. Whitespace rows are not counted in ''detected signals''.'
  example:
    scenario: A stack with Lenovo laptops and no HP hardware or print.
    steps:
    - PC/Laptop Brands gets a Lenovo row and an HP Inc. whitespace row; detected signals = 1.
    - Print Fleet gets only the HP Inc. Print whitespace row; detected signals = 0.
    result: Two open-opportunity rows, each labelled Medium risk / Open opportunity.
  output: Vendor rows marked as HP whitespace.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:extract_tech_landscape
  confidence: high
- id: tl_relationship_and_risk
  parent: null
  name: HP relationship and displacement-risk labels
  kind: display
  summary: Turns each category's badge into the relationship and risk chips the seller sees.
  purpose: Turns each category's badge into the relationship and risk chips the seller sees.
  inputs:
  - Category status badge
  - Whether the vendor row is HP whitespace
  logic: Each badge maps to a short label, a long explanation and a risk chip (see the table). If every
    vendor row in a category is HP whitespace, the category is re-badged 'HP whitespace - open opportunity'
    (a category cannot be 'Compete' when no rival is confirmed). A whitespace row always reads Medium
    risk / Open opportunity, whatever the category badge. Placeholder values that say the inference is
    still to be decided are removed. The narrative and HP play are left empty for the narrative step to
    fill.
  table:
    columns:
    - Category badge
    - Short label
    - Long explanation
    - Risk chip
    rows:
    - - displacement opportunity
      - Compete
      - Compete - another vendor is confirmed in an HP-relevant category
      - High risk
    - - complementary attach
      - Complement
      - Complement - HP can work alongside the confirmed technology
      - Low risk
    - - hp whitespace - open opportunity
      - Open opportunity
      - Possible open opportunity - category need supported, no vendor confirmed
      - Medium risk
    - - contextual - no direct hp line
      - Contextual
      - Contextual - no direct HP line in this category
      - null
  example:
    scenario: PC/Laptop Brands (badge 'Displacement opportunity') whose only row is the HP Inc. whitespace
      row.
    steps:
    - No confirmed rival in the category.
    - Badge is changed to 'HP whitespace - open opportunity'.
    result: Category label 'Open opportunity'; the HP Inc. row shows 'Medium risk'.
    computed_value:
    - HP whitespace - open opportunity
    - Open opportunity
    - Medium risk
    verified: true
    expect:
    - HP whitespace - open opportunity
    - Open opportunity
    - Medium risk
  output: The relationship and its label on each category; the risk level and relationship label on each
    vendor.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:RELATIONSHIP_BY_BADGE
  - hp-backend/src/app/services/extractors/tech_landscape.py:_normalise_hp_fields
  confidence: high
- id: tl_detection_status
  parent: tl_relationship_and_risk
  name: Detection status and provenance on each vendor
  kind: selection
  summary: Says whether the vendor was actually named in the technology data, and in which columns.
  purpose: Says whether the vendor was actually named in the technology data, and in which columns.
  inputs:
  - The vendor's detected names
  - The installed technology record's category columns
  logic: 'Whitespace row: ''Unknown'', with provenance ''installed technology -> no vendor found for this
    category''. Vendor with matched entries: ''Confirmed'', with provenance listing up to 3 of the installed
    technology''s category columns (alphabetical) whose text contains a matched entry; if none, ''the
    full technology list''. Vendor with no recorded match: ''Likely'', with a note that the source entry
    was not recorded.'
  example:
    scenario: Symantec / Kaspersky row matched 'Kaspersky'; the installed technology's 'It Security' category
      contains Kaspersky.
    steps:
    - Matched entries exist, so the status is Confirmed.
    - The 'It Security' category contains 'kaspersky'.
    result: Confirmed; provenance 'installed technology -> It Security'.
    computed_value:
    - Confirmed
    - technographics -> It Security
    verified: true
    expect:
    - Confirmed
    - technographics -> It Security
  output: The detection status (the label actually shown in the card footer), where it came from, and
    the basis of the evidence.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:_derive_provenance
  - hp-backend/src/app/services/extractors/tech_landscape.py:_normalise_hp_fields
  confidence: high
- id: tl_map_narrative
  parent: null
  name: Strategic read, 'What it means for HP' and per-vendor HP play (AI-written, rule-checked)
  kind: model
  summary: Writes the sentences a seller reads on the map, inside fixed limits.
  purpose: Writes the sentences a seller reads on the map, inside fixed limits.
  inputs:
  - Account name
  - 'For each category: name, relationship label, vendor names and descriptions, whitespace flags'
  - The allowed HP product list
  logic: 'One AI request writes: a 3-4 sentence account-level ''strategic read''; for each category a
    ''what it means'' paragraph of 70-100 words that names a detected vendor and the motion (displacement,
    attach, upgrade, coexistence or whitespace); and for each vendor an HP line and a one-sentence play.
    This is AI judgement - there is no formula. Fixed checks then constrain it: (1) the HP line must match
    the approved product list, otherwise the vendor gets no play; (2) any text containing a banned word
    (guarantees, ensures, fastest, cheapest, best-in-class, the best, always, never fails, 100%, eliminates,
    proven to) or a number not present in the account''s technology list or name is rejected; (3) a ''what
    it means'' outside 70-100 words gets one single-category rewrite, which is used only if it passes
    the same checks and is closer to the band; otherwise the original stands.'
  conditions:
  - The AI sees only category names, relationship labels and vendors - not research activity, hiring,
    news or filings.
  - This runs before the confidence score, because Driver 1 needs the HP line it produces.
  constants:
  - label: Minimum words
    ref: py:app.services.hp.map_narrative:MEANING_MIN_WORDS
    stated: 70
  - label: Maximum words
    ref: py:app.services.hp.map_narrative:MEANING_MAX_WORDS
    stated: 100
  - label: Narrative guidance version
    ref: py:app.services.hp.map_narrative:MAP_NARRATIVE_PROMPT_VERSION
    stated: 3
  example:
    scenario: Checking three candidate play sentences for an account whose data contains 'Microsoft Windows
      10'.
    steps:
    - '''HP Wolf Security guarantees protection'' contains the banned word ''guarantees'' - rejected.'
    - '''Wolf Security reduces incidents by 30%'' carries the number 30, which is not in the account data
      - rejected.'
    - '''Wolf Security adds below-the-OS protection alongside Kaspersky'' has no banned word or number
      - accepted.'
    result: Rejected, rejected, accepted.
    computed_value:
    - false
    - false
    - true
    verified: true
    expect:
    - false
    - false
    - true
  output: The strategic read; a 'what it means' paragraph (and its word count) for each category; an HP
    product and play text for each vendor; and a report on the checks.
  sources:
  - hp-backend/src/app/services/hp/map_narrative.py:generate_map_narrative
  - hp-backend/src/app/services/hp/map_narrative.py:_is_acceptable
  - hp-backend/src/app/services/hp/map_narrative.py:_retry_meaning
  - hp-backend/src/app/services/extractors/grounding.py:normalize_hp_product
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4 section G (Technographic Map 70-100 words)
  confidence: high
- id: tl_rulebook_offering_override
  parent: tl_map_narrative
  name: The rulebook overrides the AI's HP line where a rule names the detected technology
  kind: guardrail
  uses:
  - hp_rulebook
  summary: Makes the HP line on a vendor card the rulebook's answer whenever the rulebook has one.
  purpose: Makes the HP line on a vendor card the rulebook's answer whenever the rulebook has one.
  inputs:
  - The vendor's detected names
  - HP's approved sales rulebook (service rules)
  - The HP line chosen by AI
  logic: For each vendor that is not a whitespace row, the detected names are matched against the rulebook's
    service rules (hardware rules are excluded, as are rules that only modify, route or are catalogue-only).
    If a rule matches, its family decides the HP line (security -> HP Wolf Security, collaboration ->
    Poly Collaboration, print and scan -> HP Enterprise Print / MPS, workforce experience -> HP Workforce
    Experience Platform, Care Pack support -> HP Care Pack Services, lifecycle -> HP Lifecycle & Sustainability
    Services, deployment -> HP Deployment & Configuration Services, HP IQ -> HP IQ for Enterprise, ink
    -> Original HP Ink), replacing the AI's pick. Up to 2 approved sentences and 1 prohibition from the
    rule are attached. The play is labelled as coming from the rulebook in that case, and as positioning
    otherwise.
  example:
    scenario: A Kaspersky vendor card where AI chose 'Poly Collaboration', and the rulebook has a security
      rule that recognises 'kaspersky'.
    steps:
    - That security rule is a service rule that matches 'Kaspersky Endpoint Security'.
    - The security family maps to HP Wolf Security.
    - The AI's line differs, so the line is changed.
    result: The HP line becomes 'HP Wolf Security' (from the security rule).
    computed_value:
    - WOLF 09
    - HP Wolf Security
    - true
    verified: true
    expect:
    - WOLF 09
    - HP Wolf Security
    - true
  output: The rulebook offering, the HP product, and where the product came from, on each vendor.
  sources:
  - hp-backend/src/app/services/extractors/tech_landscape.py:_rulebook_offering
  - hp-backend/src/app/services/extractors/tech_landscape.py:_score_card_confidence
  - hp-backend/src/app/services/hp/rulebook.py:RULEBOOK_FAMILY_TO_HP_LINE
  confidence: high
- id: tl_confidence_score
  parent: null
  name: Tech Landscape confidence per vendor card
  kind: score
  summary: Measures how well the evidence supports what the whole vendor card says; it also decides whether
    the card exists at all.
  purpose: Measures how well the evidence supports what the whole vendor card says; it also decides whether
    the card exists at all.
  inputs:
  - Driver 1 - HP-relevant technology evidence (0, 5 or 10)
  - Driver 2 - HP-category intent support (0, 5 or 10)
  logic: Confidence % = (Driver 1 x 0.70 + Driver 2 x 0.30) x 10, rounded to a whole number. Only nine
    results are possible, and the three with Driver 1 = 0 never reach the screen (see the rule on cards
    with Driver 1 = 0).
  formula: Confidence = (70% × Technology evidence + 30% × Intent support) × 10, rounded to a whole number
  table:
    columns:
    - Driver 1
    - Driver 2
    - Confidence %
    - Card shown?
    rows:
    - - 10
      - 10
      - 100
      - 'yes'
    - - 10
      - 5
      - 85
      - 'yes'
    - - 10
      - 0
      - 70
      - 'yes'
    - - 5
      - 10
      - 65
      - 'yes'
    - - 5
      - 5
      - 50
      - 'yes'
    - - 5
      - 0
      - 35
      - 'yes'
    - - 0
      - 10
      - 30
      - no (suppressed)
    - - 0
      - 5
      - 15
      - no (suppressed)
    - - 0
      - 0
      - 0
      - no (suppressed)
  constants:
  - label: Driver 1 weight
    ref: scoring:tech_confidence.weights.technology_evidence
    stated: 0.7
  - label: Driver 2 weight
    ref: scoring:tech_confidence.weights.intent_support
    stated: 0.3
  - label: Driver scale
    ref: scoring:tech_confidence.driver_scale
    stated: 10
  example:
    scenario: Driver 1 = 10 (the rulebook names the technology), Driver 2 = 5 (category intent 34).
    steps:
    - 10 x 0.70 = 7.0
    - 5 x 0.30 = 1.5
    - (7.0 + 1.5) x 10 = 85
    result: 85%
    computed_value: 85
    verified: true
    expect: 85
