- id: tl_rec_evidence_tier
  parent: tl_hp_recommendations
  name: Evidence tier and permitted wording
  kind: guardrail
  summary: Limits how strongly a card's wording may claim a need, by counting independent kinds of information.
  purpose: Limits how strongly a card's wording may claim a need, by counting independent kinds of information.
  inputs:
  - The kinds of information in the evidence rows that fired the rule
  - HP-category research score for the card's category
  logic: Each kind of information maps to one independent signal (see the table), and duplicates collapse.
    Company profile and contacts never corroborate. If the card's own HP category research score is exactly
    0 / 'No Signal', installed technology stops counting. 2 or more corroborating signals -> Opportunity
    ('is relevant'); 1 -> Conversation Starter ('may be relevant'; no confirmed need); 0 -> Context Only
    (not recommended; context only). A missing research score does not trigger this demotion.
  table:
    columns:
    - Kind of information
    - Counts as
    rows:
    - - Company profile, company hierarchy and extended company details
      - Company profile (does not corroborate)
    - - Installed technology, technology detections, website technology and the technology map
      - Technology
    - - HP category research scores, overall research topic scores and topic lists
      - Intent (research activity)
    - - Job postings
      - Hiring
    - - Google News and news events
      - News
    - - Company filings
      - Filings
    - - Contact records
      - Contacts (do not corroborate)
  constants:
  - label: Signals needed for Opportunity
    ref: py:app.services.hp.evidence_tier:PIPELINES_FOR_OPPORTUNITY
    stated: 2
  example:
    scenario: A Poly card fired by installed technology and research topic rows, with the Poly research
      score = 0.
    steps:
    - 'Signals: Technology and Intent.'
    - The Poly research score is 0, so technology is demoted to context.
    - 1 corroborating signal is left.
    result: Conversation Starter.
    computed_value: Conversation Starter
    verified: true
    expect: Conversation Starter
  output: The evidence tier on each recommendation.
  sources:
  - hp-backend/src/app/services/hp/evidence_tier.py:tier_for
  - hp-backend/src/app/services/hp/evidence_tier.py:DATASET_PIPELINES
