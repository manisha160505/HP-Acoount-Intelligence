  confidence: high
- id: tl_rec_confidence_band
  parent: tl_hp_recommendations
  name: Confidence band on hardware cards (Confirmed / Likely / Discovery)
  kind: guardrail
  summary: Labels how far the estate confirms the device category behind a hardware card.
  purpose: Labels how far the estate confirms the device category behind a hardware card.
  inputs:
  - Status badge of the technology category matched to the rule's device type
  - Whether the account has any trigger headline
  - Which kinds of information fired the rule
  logic: 'The status is taken from the first category whose name contains a word for the device type (notebook:
    client, endpoint, platform, device; tower/sff: platform, storage, compute; mini: platform, device;
    aio: collaboration, device), else the first category. Band: whitespace / open opportunity -> Discovery;
    contextual -> Discovery; no trigger headline -> Likely; displacement, complementary or existing HP
    -> Confirmed; otherwise Likely. If none of the kinds of information that fired the rule is about the
    technology estate (installed technology, technology detections, website technology or the technology
    map), the band is removed and the reason recorded. Service cards never get a band.'
  table:
    columns:
    - Category status
    - Has trigger
    - Band
    rows:
    - - HP whitespace - open opportunity
      - true
      - Discovery
    - - Contextual - no direct HP line
      - true
      - Discovery
    - - Displacement opportunity
      - false
      - Likely
    - - Displacement opportunity
      - true
      - Confirmed
    - - Complementary attach
      - true
      - Confirmed
  example:
    scenario: A notebook rule on an account whose map shows all seven categories (Client OS first).
    steps:
    - '''Client OS'' contains ''client'', so its status ''Contextual - no direct HP line'' is used, not
      PC/Laptop Brands''.'
    - Contextual -> Discovery.
    result: Discovery (a tower rule on the same account reads Workstations -> Displacement -> Confirmed
      when there is a trigger).
    computed_value:
    - Discovery
    - Confirmed
    verified: true
    expect:
    - Discovery
    - Confirmed
  output: A confidence band on each hardware recommendation, and the basis for it.
