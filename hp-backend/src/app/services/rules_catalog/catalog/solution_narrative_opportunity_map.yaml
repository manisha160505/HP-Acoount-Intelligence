- id: om_evidence_tier
  parent: null
  name: Evidence tier used by the relevance ladder
  kind: selection
  summary: Counts the independent kinds of information behind a play.
  purpose: Counts the independent kinds of information behind a play.
  inputs:
  - Where the verified evidence came from
  logic: Each kind of information counts as one independent signal. The two news feeds count as one 'News'
    signal, and the research activity data counts as one 'Intent' signal. Company profile and contacts
    do not corroborate. 2 or more corroborating signals -> Opportunity; 1 -> Conversation Starter; 0 ->
    Context Only. (The Opportunity Map passes no category research score, so the rule that demotes technology
    evidence when category research is zero is not applied here.)
  table:
    columns:
    - Tier
    - Permitted language
    rows:
    - - Opportunity
      - May state that the combined evidence indicates or supports an HP-addressable opportunity, and
        recommend a specific seller focus. An offering whose conditions are supported "is relevant to
        this opportunity".
    - - Conversation Starter
      - An offering here "may be relevant to this opportunity" - never "is relevant". Do not state a confirmed
        need, project or buying motion.
    - - Context Only
      - Present as seller context only. Do not create an HP opportunity or product recommendation. A detected
        technology is a possible integration route, nothing more.
  example:
    scenario: Play citing one Google News headline, one news-events headline and an installed technology
      item.
    steps:
    - The two news feeds collapse to News.
    - Plus installed technology = 2.
    result: Opportunity.
    computed_value: Opportunity
    verified: true
    expect: Opportunity
  output: Used only for checking the wording; not stored on the play.
  sources:
  - hp-backend/src/app/services/hp/evidence_tier.py:tier_for
  - hp-backend/src/app/services/hp/evidence_tier.py:pipelines
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4 sections B-D
  confidence: high
- id: om_regeneration_cache
