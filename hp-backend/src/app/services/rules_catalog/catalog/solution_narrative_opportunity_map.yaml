  kind: selection
  internal: true
  summary: Reuses stored plays unless an input changed.
  purpose: Reuses stored plays unless an input changed.
  inputs:
  - Version of the play-writing guidance
  - Evidence texts
  - Contact identifiers
  - Case-study library version
  - Studies cited by higher-priority sections
  - Rulebook version
  - Account instructions and guardrails
  logic: A fingerprint of these inputs is stored with the plays. If the stored plays are available and
