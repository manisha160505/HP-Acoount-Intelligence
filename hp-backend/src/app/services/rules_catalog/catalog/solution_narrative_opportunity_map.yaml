  parent: om_case_study_proof
  name: Allocation across surfaces
  kind: selection
  summary: Spreads customers across the dashboard without lowering quality.
  purpose: Spreads customers across the dashboard without lowering quality.
  inputs:
  - Ranked candidate studies
  - Studies cited by higher-priority sections (taken)
  - Studies already used on this page
  logic: 'Sections choose in a fixed order: Objection Playbook, Opportunity Map, Messaging, Content, Executive
    Dashboard, Live Signals, Intent, Technographic Map. A section gives way only to those above it. Studies
    already used on this page are excluded outright. The top candidate sets a quality bar = (same industry?,
    told in full?). The first candidate that meets the bar and is not cited elsewhere is chosen. If every
    candidate that meets the bar is cited elsewhere, the top one is repeated.'
  example:
    scenario: Top candidate B (other industry, told in full) is cited by the Objection Playbook; A (same
      industry, told in full) is next.
    steps:
    - The bar is B's level (0, 1).
    - A's level (1, 1) is not below the bar and A is not cited elsewhere.
    result: A is chosen; quality levels (1, 1) vs (0, 1).
    computed_value:
    - - 1
      - 1
    - - 0
      - 1
    verified: true
    expect:
    - - 1
      - 1
    - - 0
      - 1
  output: One proof point, or none.
  sources:
