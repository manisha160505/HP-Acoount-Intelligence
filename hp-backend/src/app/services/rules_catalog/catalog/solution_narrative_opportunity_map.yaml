- id: om_sp_matching
  parent: om_service_plays
  name: A rule must be earned by qualifying terms
  kind: selection
  summary: Stops rules firing on terms every enterprise has.
  purpose: Stops rules firing on terms every enterprise has.
  inputs:
  - The terms the rule matched
  logic: A matched term is only 'indicative' (and cannot earn the rule) when every word in it is a ubiquitous
    vendor (microsoft, google, sap, salesforce, teams...) or a generic qualifier (erp, crm, cloud, suite,
    platform...), with at least one ubiquitous vendor. For a rule that only routes to another offering
    and has observable terms, a term must also be one of those observable terms. A rule with no qualifying
    term is refused. The remaining gates (HP Wolf Security offerings that apply only to HP hardware, the
    HP IQ market, testable conditions and 3 rules per family) work as in the shared matching logic.
  example:
    scenario: Routing-only rule with observable term 'claims processing' matched 'financial services',
      'claims processing' and 'sap erp'.
    steps:
    - '''sap erp'' is a ubiquitous vendor plus a generic word - indicative.'
    - '''financial services'' is not an observable term of a routing-only rule - indicative.'
    - '''claims processing'' qualifies.'
    result: 'Qualifying: [''claims processing''].'
    computed_value:
    - - claims processing
    - - financial services
      - sap erp
    verified: true
    expect:
    - - claims processing
    - - financial services
      - sap erp
  output: Qualifying terms and indicative terms.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:split_terms
  - hp-backend/src/app/services/hp/rulebook.py:indicative_term
  - hp-backend/src/app/services/hp/rulebook.py:candidates
  confidence: high
- id: om_sp_conditions
  parent: om_service_plays
  name: 'Rule conditions: refused, satisfied or ''unverified'''
  kind: guardrail
  summary: Drops a rule the account contradicts, and labels what cannot be checked.
  purpose: Drops a rule the account contradicts, and labels what cannot be checked.
  inputs:
  - The rule's conditions
  - Evidence text
  - Account country
  logic: Only country, management-environment and operating-system conditions can be tested. A country
    condition that names a country the account is not in refuses the rule. An environment or operating-system
    condition is satisfied if the evidence names the same thing (intune, entra, autopilot, sccm, vpro,
    azure, active directory...; windows, macos, linux, android, ios, chromeos). A miss is 'unverified',
    not a refusal. Every other kind of condition is 'unverified'. Unverified conditions phrased as instructions
    to the writer ('Recommend...', 'Mention...') are not shown to the seller.
  example:
    scenario: 'Indonesia account; rule conditions: US-and-English availability, ''Requires Windows 11'',
      ''500+ seats''; evidence has ''Microsoft Windows 11''.'
    steps:
    - The country condition names the United States; the account is in Indonesia -> not met.
    - Windows found -> satisfied.
    - Seat count cannot be tested -> unverified.
    result: Rule refused (country).
    computed_value:
    - false
    - 1
    - - 500+ seats
    verified: true
    expect:
    - false
    - 1
    - - 500+ seats
  output: Unverified conditions on the play; refusals appear in the notes.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:check_conditions
  - hp-backend/src/app/services/hp/rulebook.py:facts_for
  doc_source: HP 220 Account Rulebook C 07
  confidence: high
