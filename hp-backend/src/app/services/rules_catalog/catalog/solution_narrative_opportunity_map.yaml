- id: om_sp_confidential_facts
  parent: om_service_plays
  name: Figures from a confidential source need their condition
  kind: source
  summary: Holds back quantified claims from the confidential Original HP Ink information unless the rule
    supplies the qualifying condition.
  purpose: Holds back quantified claims from the confidential Original HP Ink information unless the rule
    supplies the qualifying condition.
  inputs:
  - The rule's allowed facts
  - The rule's conditions
  - Whether the source is confidential
  logic: For a rule from a confidential source, a fact that contains a percentage, a pages-per-minute
    or page-count figure, or any number of 2 or more digits is withheld unless the rule has at least one
    condition. Facts without figures pass.
  example:
    scenario: '''Saves up to 50% on ink'' with no condition; same with condition ''with Instant Ink plan'';
      ''Original HP Ink is reliable''.'
    steps:
    - Figure, no condition -> withheld.
    - Figure with condition -> allowed.
    - No figure -> allowed.
    result: Withheld, allowed, allowed.
    computed_value:
    - false
    - true
    - true
    verified: true
    expect:
    - false
    - true
    - true
  output: The facts allowed, and the facts withheld for confidentiality.
