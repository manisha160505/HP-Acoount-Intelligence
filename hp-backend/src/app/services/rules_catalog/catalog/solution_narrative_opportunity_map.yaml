- id: om_sp_conditions
  parent: om_service_plays
  name: 'Rule conditions: met, not met or to confirm'
  kind: guardrail
  summary: Sets aside a rule the account contradicts, and lists what the seller should confirm.
  purpose: Sets aside a rule the account contradicts, and lists what the seller should confirm.
  inputs:
  - The rule's conditions
  - Evidence text
  - Account country
  logic: Country, management-environment and operating-system conditions are tested against the account.
    A country condition that names a country the account is not in means the rule does not apply. An
    environment or operating-system condition is met when the evidence names the same thing (intune,
    entra, autopilot, sccm, vpro, azure, active directory...; windows, macos, linux, android, ios, chromeos).
    Any other condition, or one the evidence does not name, is listed as a point to confirm. Conditions
    written as instructions ('Recommend...', 'Mention...') are not listed as points to confirm.
  example:
    scenario: 'Indonesia account; rule conditions: US-and-English availability, ''Requires Windows 11'',
      ''500+ seats''; evidence has ''Microsoft Windows 11''.'
    steps:
    - The country condition names the United States; the account is in Indonesia -> not met.
    - Windows found -> satisfied.
    - Seat count is a point to confirm.
    result: Rule does not apply (country).
    computed_value:
    - false
    - 1
    - - 500+ seats
    verified: true
    expect:
    - false
    - 1
    - - 500+ seats
  output: The points to confirm on each play.
  sources:
