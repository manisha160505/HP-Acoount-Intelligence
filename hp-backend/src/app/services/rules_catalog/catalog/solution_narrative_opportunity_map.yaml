- id: om_sp_matching
  parent: om_service_plays
  name: A rule is earned by qualifying terms
  kind: selection
  summary: Keeps rules from firing on terms every enterprise has.
  purpose: Keeps rules from firing on terms every enterprise has.
  inputs:
  - The terms the rule matched
  logic: A matched term is only 'indicative' (and cannot earn the rule) when every word in it is a ubiquitous
    vendor (microsoft, google, sap, salesforce, teams...) or a generic qualifier (erp, crm, cloud, suite,
    platform...), with at least one ubiquitous vendor. For a rule that only routes to another offering
    and has observable terms, a term must also be one of those observable terms. A rule needs at least
    one qualifying term. The other checks (HP Wolf Security offerings that apply only to HP hardware,
    the HP IQ market, testable conditions and 3 rules per family) work as in the shared matching logic.
  example:
    scenario: Routing-only rule with observable term 'claims processing' matched 'financial services',
      'claims processing' and 'sap erp'.
    steps:
    - '''sap erp'' is a ubiquitous vendor plus a generic word - indicative.'
    - '''financial services'' is not an observable term of a routing-only rule - indicative.'
    - '''claims processing'' qualifies.'
    result: 'Qualifying: [''claims processing''].'
    computed_value:
    - - claims processing
    - - financial services
      - sap erp
    verified: true
    expect:
    - - claims processing
    - - financial services
      - sap erp
  output: Qualifying terms and indicative terms.
