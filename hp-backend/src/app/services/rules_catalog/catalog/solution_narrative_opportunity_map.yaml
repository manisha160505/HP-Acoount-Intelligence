- id: om_relevance_ladder
  parent: om_prose_guardrails
  name: Relevance ladder on play prose
  kind: guardrail
  summary: An offering 'is relevant' only on two independent signals; 'may be relevant' on one; not recommended
    on context alone.
  purpose: An offering 'is relevant' only on two independent signals; 'may be relevant' on one; not recommended
    on context alone.
  inputs:
  - Where each of the play's verified quotes came from
  - HP capability and inference wording
  logic: The play's evidence tier is worked out with the shared tier rule (see the evidence tier rule
    below). Below Opportunity, phrases such as 'is relevant', 'strong fit' and 'clearly addresses' are
    faults. At Context Only, phrases such as 'recommend', 'should deploy' and 'pitch' are faults. Below
    Opportunity, wording that says the account needs, requires, plans to or is evaluating something is
    also a fault.
  example:
    scenario: '''HP Wolf Security is relevant to this opportunity.'' on a play citing only the installed
      technology, then on one citing the installed technology and research activity.'
    steps:
    - 'Installed technology only: 1 independent signal -> Conversation Starter -> fault.'
    - 'Installed technology + research activity: 2 independent signals -> Opportunity -> allowed.'
    result: '''may be relevant'' with 1 fault, then ''is relevant'' with 0 faults.'
    computed_value:
    - - may be relevant
      - 1
    - - is relevant
      - 0
    verified: true
    expect:
    - - may be relevant
      - 1
    - - is relevant
      - 0
  output: A rewrite request, or a record that the play was published as it is. The tier itself is not
    stored on the play.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_play_relevance_fault
  - hp-backend/src/app/services/hp/guardrails.py:tier_language_faults
