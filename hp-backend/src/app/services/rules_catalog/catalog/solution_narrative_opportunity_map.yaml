# Rules page catalog for `solution_narrative_opportunity_map`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: solution_narrative_opportunity_map
purpose: Turns the account's own evidence into up to five HP hardware opportunity plays and a set of HP
  service plays, each tied to the evidence that supports it.
final_output: Up to 5 HP opportunity plays and discovery areas in total. Each play shows a priority tag
  (Critical or High), the AI's reading of the evidence, the HP capability, HP products, the checks it meets
  and, where they apply, a link to the HP product page and an HP case study. Each discovery area shows
  its priority, what the data shows and what to confirm. Recommended HP services show the opportunity
  type, the service, the points to confirm and the integration routes the account runs. The feature also
  keeps an account context card and a copy of the Live Signals list.
how_it_combines: 'Two kinds of play are built side by side.

  - Hardware plays: the account''s evidence decides which of the six hardware play families are eligible.
  AI drafts the plays. A play is kept when at least one of its quotes is found in the account''s information.
  The wording rules are then applied, priority is set, duplicates are merged and the top plays are kept
  in order. Plays without an evidenced HP fit become discovery areas.

  - Service plays: chosen by fixed rules, without AI, from HP''s approved sales rulebook, based on what
  the account''s evidence earns.

  Trigger signals are the published Live Signals feed.'
rules:
- id: om_context_card
  parent: null
  name: Opportunity Account Context card
  kind: display
  summary: Collects the account facts the plays reason from.
  purpose: Collects the account facts the plays reason from.
  inputs:
  - 'Company profile: business description'
  - 'Installed technology: full technology list'
  - 'Research activity: topic and composite score'
  logic: The business description is copied as it is. The full technology list is split into single items.
    Research topics are listed highest first, with their composite score as a whole number (decimals
    dropped, not rounded). The top 10 are listed, with the total number of topics. The card is filled
    when at least one of the three is present.
  example:
    scenario: 'Research topics: Cloud Security 71.8, 3D Printing 64.2, Laptops 80.0.'
    steps:
    - 'Scores cut to whole numbers: 71, 64, 80.'
    - Sorted highest first.
    result: Laptops 80, Cloud Security 71, 3D Printing 64.
  output: The business description, a sample of the full technology list, the total number of technology
    items, the top 10 research topics and the total number of research topics.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:extract_solution_narrative_opportunity_map
  confidence: high
- id: om_trigger_signals
  parent: null
  name: Opportunity Trigger Signals from the Live Signals feed
  kind: source
  summary: Keeps a copy of the news and event triggers published by Live Signals.
  purpose: Keeps a copy of the news and event triggers published by Live Signals.
  inputs:
  - The published Live Signals feature (recent news and event triggers about the company)
  logic: The signals in the final Live Signals list are copied unchanged. Each signal keeps the score
    and the position the Live Signals feature gave it.
  example:
    scenario: Live Signals published 14 signals.
    steps:
    - Live Signals has published its list.
    - All 14 are copied.
    result: 14 trigger signals copied.
  output: The list of trigger signals and their total count.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_triggers_payload
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:publish_trigger_signals
  doc_source: HP_Live_Signal_Scoring_Logic (scoring belongs to the Live Signals feature)
  confidence: high
- id: om_evidence_corpus
  parent: null
  name: The evidence a play may cite
  kind: selection
  summary: Sets the account statements a play can quote, and labels each as context or a timing trigger.
  purpose: Sets the account statements a play can quote, and labels each as context or a timing trigger.
  inputs:
  - 'Company profile: business description, employee range, yearly revenue range'
  - 'Installed technology: each item in the full technology list'
  - 'Research activity: the top 10 topics by composite score'
  - 'Category research activity: topics researched in each HP category'
  - 'Recent news: the 10 most recent distinct headlines'
  - 'For an account without installed technology or research activity: recent news items that pass the
    Live Signals checks, up to 30, each with its evidence sentence'
  logic: Context items are the business description, employee range, revenue range and every installed
    technology item. Trigger items are the 10 most recent distinct news headlines (newest first, undated
    last). For an account without installed technology or research activity, the triggers come from
    Live Signals instead. These are the news items that pass the Live Signals checks (dated, within the
    last 12 months, not future-dated, duplicates merged), up to 30, each with its headline and evidence
    sentence. Research topics and category research themes are triggers or context depending on the
    research timing gate (see the next rule). Contacts are used to name owners.
  constants:
  - label: Research topics used
    value: 10
  - label: News headlines used
    value: 10
  - label: Live Signals news items used for an account without technology or research activity
    value: 30
  example:
    scenario: 15 news rows (2 duplicates), 25 research topics, 180 technology items.
    steps:
    - 13 distinct headlines, newest 10 kept as triggers.
    - Top 10 topics by composite score kept.
    - All 180 technology items kept as context.
    result: Evidence of 180 technology items + company profile context + 10 topics + category themes +
      10 headlines.
  output: The evidence list that every quote is checked against.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:generate_opportunity_map_plays_with_gpt4o
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4 Opportunity Map row
  confidence: high
- id: om_intent_timing_gate
  parent: om_evidence_corpus
  name: Research timing gate - which HP categories may supply a timing trigger
  kind: guardrail
  summary: Lets a research topic signal timing only where HP's category-level research scores stand behind
    that category.
  purpose: Lets a research topic signal timing only where HP's category-level research scores stand behind
    that category.
  inputs:
  - HP category research scores (status, score per category, buying stage, quality flags)
  - Whether the topic research data was collected for this account's own company
  logic: If the topic research data was collected for a different company, no category may supply timing.
    If the account has no category-level scores, the gate is not applied and research topics keep their
    trigger role. Otherwise a category may supply timing when its scores give it a buying stage and none
    of its score rests on a noisy keyword (a quality flag).
  example:
    scenario: 'Category scores: 3D 34/100 Awareness; PC 12/100 no stage; Poly 40/100 Consideration but
      flagged for the noisy keyword ''teams''.'
    steps:
    - 3D has a stage and no flag - allowed.
    - PC has no stage - not allowed.
    - Poly is flagged - not allowed.
    result: Only 3D may supply timing.
    computed_value:
    - 3D
    verified: true
    expect:
    - 3D
  output: 'The gate result: whether it was applied, the reason, the categories allowed and the categories
    not allowed.'
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_intent_timing_gate
  - hp-backend/src/app/services/extractors/intent_demand_signals.py:_carries_buying_signal
  confidence: high
- id: om_topic_kind
  parent: om_intent_timing_gate
  name: 'Each research topic and category theme: trigger or context'
  kind: selection
  uses:
  - intent_dictionary
  summary: Applies the gate to each item in the evidence.
  purpose: Applies the gate to each item in the evidence.
  inputs:
  - Topic name
  - Gate result
  logic: 'Research topic: if the gate is not applied, it is a trigger. If the research data belongs to
    another company, it is context. If the topic fits no HP category, it is context. If its HP category
    is allowed, it is a trigger. Otherwise it is context, with the reason noted. Category research theme:
    a trigger if its own category is allowed (or the gate is not applied), otherwise context. Context
    items can still be quoted, but they never make a play look timely.'
  example:
    scenario: Topics '3D Printing' and 'Cloud Security' with only 3D allowed.
    steps:
    - '''3D Printing'' belongs to the 3D category, which is allowed - trigger.'
    - '''Cloud Security'' fits no HP category - context (''maps to no HP category'').'
    result: 3D Printing = trigger; Cloud Security = context.
    computed_value: ({'3D'}, set())
    verified: true
    expect:
    - - 3D
    - []
  output: Each item is marked as a trigger or context, with the reason when it is context. Context topics
    are labelled 'research interest only' when plays are written.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:generate_opportunity_map_plays_with_gpt4o
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_topic_governing_categories
  confidence: high
- id: om_superseded_versions
  parent: om_evidence_corpus
  name: Plays cite the current version of a technology
  kind: selection
  summary: Keeps a play from leading on, say, Windows 7 when the account's technology list also includes
    Windows 10.
  purpose: Keeps a play from leading on, say, Windows 7 when the account's technology list also includes
    Windows 10.
  inputs:
  - Installed technology items
  logic: A name that ends in a version is split into a product family and a version (vendor prefixes such
    as 'Microsoft ' are ignored). A version is a release number below 100 or a year from 1990 to 2100.
    Anything else (such as the model number 6500) is not a version, and release numbers are never compared
    with years. Where the technology data names several versions of one family, every older one counts
    as superseded. A quote that names a superseded version is not used as evidence, and play wording that
    names one is sent back for a rewrite. The comparison uses only the versions in the account's own technology
    list.
  example:
    scenario: The technology list includes Microsoft Windows 7, Windows 10, Microsoft Office 365, Microsoft
      Office 2016, Cisco Catalyst 6500, Cisco Catalyst 6503, SQL Server 2016 and SQL Server 2019.
    steps:
    - 'Windows: 7 is lower than 10, so Windows 7 is superseded.'
    - Office 365 (a release number) and Office 2016 (a year) are never compared.
    - 6500 and 6503 are model numbers, not versions.
    - SQL Server 2016 is older than 2019, so it is superseded.
    result: 'Superseded: Microsoft Windows 7, SQL Server 2016.'
    computed_value:
    - Microsoft Windows 7
    - SQL Server 2016
    verified: true
    expect:
    - Microsoft Windows 7
    - SQL Server 2016
  output: A record of the quotes set aside and any rewrite requests.
  sources:
  - hp-backend/src/app/services/extractors/tech_versions.py:superseded
  - hp-backend/src/app/services/extractors/tech_versions.py:spellings
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py
  doc_source: Client, 27 Sep, quoted in hp-backend/src/app/services/extractors/tech_versions.py docstring
  confidence: high
- id: om_play_eligibility
  parent: null
  name: Which of the six hardware play families the evidence can support
  kind: selection
  summary: Decides which play families the AI may propose and which evidence each may cite.
  purpose: Decides which play families the AI may propose and which evidence each may cite.
  inputs:
  - The evidence list
  - The research timing gate
  logic: A family is eligible if at least one evidence item contains one of its signal words (as a whole
    word) and none of its exclusion words. Up to 6 such items are listed as citable evidence. A family
    has a timing trigger if any of its items is a trigger. But if the gate is applied and the family's
    HP research category is not allowed, only news (not research activity) can supply its timing. The AI
    proposes only families with matching evidence.
  table:
    columns:
    - Play family
    - HP offering
    - Signal words
    - Excluded when item contains
    - HP research category
    rows:
    - - Workstations
      - Z by HP Workstations
      - design, engineering, cad, simulation, modeling, modelling, 3d, rendering, research and development,
        analytics, data insights, machine learning, artificial intelligence, ai, product development,
        autocad, catia, solidworks
      - vehicle, vehicles
      - Workstation
    - - Collaboration
      - Poly Collaboration
      - collaboration, meeting, conferencing, video, remote, hybrid, flexible working, communication,
        communications, workplace, teams
      - '-'
      - Poly/Collaboration
    - - PCs
      - HP Elite / Pro PCs
      - workforce, employee, workplace, flexible working, device, laptop, desktop, endpoint, productivity,
        windows, refresh
      - vehicle, vehicles, server
      - PC
    - - Print
      - HP Enterprise Print / MPS
      - print, printing, document, documents, paper, scanning, records, archive, mfp, workflow, workflows
      - '-'
      - Print
    - - Device as a service
      - HP Anyware / DaaS
      - intune, workspace one, airwatch, jamf, manageengine, sccm, ivanti, tanium, azure ad, okta, device
        management, endpoint management, device lifecycle, mobile device, mdm, uem, it asset management,
        endpoint
      - vehicle, vehicles, fleet maintenance, tokenization, tokenisation, ai chips
      - PC
    - - 3D printing
      - HP Multi Jet Fusion (3D)
      - 3d printing, 3d printer, 3d printers, additive manufacturing, multi jet fusion, prototyping, prototype,
        tooling, jigs, fixtures, end-use parts, rapid prototyping
      - '-'
      - 3D
  example:
    scenario: Evidence item 'CATIA V5 engineering design'.
    steps:
    - '''engineering'' and ''design'' are workstation words.'
    - No other family's words appear ('3d' is not a 3D-printing word; 3D needs '3d printing', 'additive
      manufacturing', etc.).
    result: Only the workstation family becomes eligible from this item.
    computed_value:
    - workstation
    verified: true
    expect:
    - workstation
  output: The list of citable evidence for each family, given to the AI that writes the plays.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:PLAY_SIGNAL_TOKENS
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:PLAY_EXCLUDE_TOKENS
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:PLAY_PRIMARY_CATEGORY
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py
  confidence: high
- id: om_play_exclusions
  parent: om_play_eligibility
  name: Look-alike phrases that cannot support a play
  kind: filter
  summary: Keeps vehicle fleets, financial tokenisation and AI chips from being read as an IT estate.
  purpose: Keeps vehicle fleets, financial tokenisation and AI chips from being read as an IT estate.
  inputs:
  - Evidence item text
  logic: 'An item that matches a family''s signal word is still ignored for that family if it contains
    one of that family''s exclusion words (device as a service: vehicle(s), fleet maintenance, tokenization/tokenisation,
    ai chips; PCs: vehicle(s), server; workstations: vehicle(s)).'
  example:
    scenario: Item 'Vehicle device management platform'.
    steps:
    - '''device management'' is a device-as-a-service word.'
    - '''vehicle'' is a device-as-a-service exclusion.'
    result: Not evidence for DaaS (or any family).
    verified: true
    expect: []
  output: A smaller list of citable evidence.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:PLAY_EXCLUDE_TOKENS
  confidence: high
- id: om_play_generation
  parent: null
  name: Play drafting by AI, then checked
  kind: model
  summary: Writes up to 5 opportunity plays from the eligible families only.
  purpose: Writes up to 5 opportunity plays from the eligible families only.
  inputs:
  - Account overview (name, industry, revenue, employees, description)
  - First 40 installed technology items
  - Top 10 research topics (context topics marked)
  - 10 news headlines with dates and links
  - Citable evidence for each family
  - Likely topic owners for each family
  - Account-specific instructions and guardrails
  logic: 'AI is asked for one play per eligible family. Each play has: a play name; 1 to 4 evidence items
    (a word-for-word quote plus a one-line reading); an HP capability (1-2 sentences, no account facts);
    a hedged inference (2-3 sentences); HP products; a proof point and link taken only from the news list;
    a timing note when the family has no timing trigger; and an owner angle when owners are listed. The
    AI follows fixed wording rules: quote word for word, cite at least one signal, avoid buying-moment
    words, follow the relevance ladder and write 80-160 words. Fixed checks then apply each rule below
    to what the AI wrote.'
  conditions:
  - Up to 2 rewrites are requested. Each names the exact point to fix in each play and keeps the fields
    that were already right.
  - After its rewrites a play is published, with a note on any wording, length or timing-note point still
    open. A play is published only when its evidence is verified.
  constants:
  - label: Max plays
    ref: py:app.services.extractors.solution_narrative_opportunity_map:MAX_PLAYS
    stated: 5
  - label: Play-writing guidance version
    ref: py:app.services.extractors.solution_narrative_opportunity_map:OPPORTUNITY_PROMPT_VERSION
    stated: 35
  - label: Rewrites per play
    ref: py:app.services.extractors.solution_narrative_opportunity_map:MAX_PROSE_REWRITES
    stated: 2
  example:
    scenario: 'Eligible families: workstations, 3D printing and PCs.'
    steps:
    - AI is asked for exactly these three.
    - Each answer goes through quote verification and the wording checks.
    result: 0 to 3 plays, depending on which pass the checks.
  output: Draft plays, ready for checking.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:generate_opportunity_map_plays_with_gpt4o
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4 Opportunity Map row
  confidence: high
- id: om_quote_verification
  parent: om_play_generation
  name: Every quote comes from the account's data
  kind: guardrail
  summary: Keeps only evidence quoted from the account's own information.
  purpose: Keeps only evidence quoted from the account's own information.
  inputs:
  - The quote written by AI
  - The evidence list
  logic: 'A quote is split at commas, and labels such as ''(Composite Score: N)'' are ignored. A part
    is verified if it sits inside an evidence item, or if an evidence item of 6 or more characters appears
    in it as whole words. The longest matching item wins, and a trigger item is preferred. Only verified
    quotes are kept, and quotes that name a superseded version are left out. A play is kept only when it
    has at least one verified quote.'
  example:
    scenario: Quote 'AutoCAD, CATIA, SAP S/4HANA migration' where only AutoCAD and CATIA are in the stack.
    steps:
    - '''AutoCAD'' and ''CATIA'' match installed technology items.'
    - '''SAP S/4HANA migration'' matches nothing and is left out of the stored quote.'
    result: Stored quote 'AutoCAD, CATIA', labelled as coming from the installed technology list.
  output: 'The evidence for each play: the quote, the statement, where it came from, whether it is context
    or a trigger, and the research score where relevant.'
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_process
  confidence: high
- id: om_three_checks
  parent: om_play_generation
  name: The three checks behind each play
  kind: guardrail
  summary: Records whether a play has verified evidence, a timing trigger and an evidenced HP fit.
  purpose: Records whether a play has verified evidence, a timing trigger and an evidenced HP fit.
  inputs:
  - The play's verified evidence
  logic: 'Verified evidence: at least one verified quote (true for every published play). Timing
    trigger: at least one verified quote is a trigger item. HP fit: at least one verified quote (leaving
    out quotes that contain the family''s exclusion words) contains one of the family''s signal words.
    Checks met = the number of true checks (0 to 3).'
  example:
    scenario: Workstation play quoting 'AutoCAD' (context) and the '3D Printing' topic (trigger, allowed).
    steps:
    - Verified evidence - yes.
    - Timing trigger - yes.
    - '''autocad'' is a workstation signal word - HP fit yes.'
    result: Checks met = 3.
  output: The checks and the number met. Each play card shows the checks it meets, and the number met
    helps order the plays.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_process
  confidence: high
- id: om_priority
  parent: null
  name: Play priority tag (Critical / High / Medium / Low)
  kind: selection
  summary: The single tag shown on each play.
  purpose: The single tag shown on each play.
  inputs:
  - Has initiative = the play has any verified quote
  - Has supporting signal = a verified quote is a timing trigger
  - Has any signal = a verified quote, a trigger, or the family has signal words
  logic: Initiative and supporting signal -> Critical; initiative only -> High; no initiative but some
    signal -> Medium; otherwise Low.
  conditions:
  - 'Every published play has a verified quote, so published plays are Critical (with a timing trigger)
    or High (without one).'
  table:
    columns:
    - Initiative
    - Supporting signal
    - Any signal
    - Priority
    rows:
    - - true
      - true
      - true
      - Critical
    - - true
      - false
      - true
      - High
    - - false
      - true
      - true
      - Medium
    - - false
      - false
      - true
      - Medium
    - - false
      - false
      - false
      - Low
  example:
    scenario: Play with verified quotes but no trigger.
    steps:
    - Initiative yes.
    - Supporting signal no.
    result: High.
    computed_value: High
    verified: true
    expect: High
  output: The priority tag on each play.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_priority_for
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_process
  doc_source: Client priority table (Sep 2026), transcribed in hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py
    lines 123-139
  confidence: high
- id: om_ordering
  parent: null
  name: Play ordering and cap
  kind: filter
  summary: Orders plays and keeps at most five.
  purpose: Orders plays and keeps at most five.
  inputs:
  - Priority
  - Checks met
  - Trigger recency
  logic: Plays are sorted by priority (Critical, High, Medium, Low), then by more checks met, then by
    higher trigger recency score. The first 5 are kept. Discovery areas are taken from these 5, so plays
    and discovery areas together number at most 5.
  example:
    scenario: 'A: High, 2 checks, recency 0; B: Critical, 3 checks, recency 6; C: Critical, 3 checks,
      recency 10.'
    steps:
    - Critical before High.
    - B and C tie on checks; C's recency 10 beats 6.
    result: C, B, A.
  output: The order of the plays.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py
  confidence: high
- id: om_trigger_recency
  parent: om_ordering
  name: Trigger recency score (tie-break only)
  kind: score
  summary: Breaks ties in favour of the play whose newest cited dated item is most recent.
  purpose: Breaks ties in favour of the play whose newest cited dated item is most recent.
  inputs:
  - Newest date among the play's verified quotes
  - Today's date
  logic: 'Age in days of the newest cited date: 0-30 -> 10; 31-90 -> 8; 91-180 -> 6; 181-270 -> 4; 271-365
    -> 2; older, future-dated or undated -> 0.'
  table:
    columns:
    - Age up to (days)
    - Score
    rows:
    - - 30
      - 10.0
    - - 90
      - 8.0
    - - 180
      - 6.0
    - - 270
      - 4.0
    - - 365
      - 2.0
    - - over 365 / no date
      - 0.0
  constants:
  - label: Recency bands
    ref: py:app.services.extractors.solution_narrative_opportunity_map:RECENCY_BANDS
    stated:
    - - 30
      - 10.0
    - - 90
      - 8.0
    - - 180
      - 6.0
    - - 270
      - 4.0
    - - 365
      - 2.0
  example:
    scenario: Newest cited headline is 45 days old.
    steps:
    - 45 > 30 and <= 90.
    result: '8.0'
    computed_value: 8.0
    verified: true
    expect: 8.0
  output: Each play's trigger recency score.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_recency_score
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:RECENCY_BANDS
  confidence: high
- id: om_prose_guardrails
  parent: null
  name: Wording rules enforced on each play
  kind: guardrail
  summary: Keeps play prose within what the evidence supports.
  purpose: Keeps play prose within what the evidence supports.
  inputs:
  - Title, HP capability, inference, timing note, owner angle and evidence statements
  logic: 'The checks run in this order: overclaiming words; no timing note on a play without a trigger
    (a standard note is then added); no owner angle when owners are listed; length outside 80-160 words;
    a superseded version named in the wording; and over-claiming against the relevance ladder. Each one
    sends the play back for a rewrite while rewrites remain (2 for most). After that the play is published
    with a wording note. Any number not found in the account''s information sends the play back for a
    rewrite, and the play is published only when every number is found. Links not found in the account''s
    information are removed. Only HP products on the approved list are kept.'
  example:
    scenario: See the rules below.
    result: '-'
  output: Checked play text, a wording note where one applies, the reason for each change, and a report
    on what was checked against the account's information.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_process
  confidence: high
- id: om_overclaim
  parent: om_prose_guardrails
  name: Overclaiming words
  kind: guardrail
  summary: Keeps out buying-moment language the evidence cannot establish.
  purpose: Keeps out buying-moment language the evidence cannot establish.
  inputs:
  - Inference and evidence statements
  - Company name
  logic: 'Checked sentence by sentence. These phrases always count as overclaiming: ''now is the perfect time'',
    ''perfect time'', ''perfect fit'', ''the right time to'', ''is ready to'', ''are ready to'', ''guarantees'',
    ''ensures'', ''fully compatible'', ''must have'', ''ideal time''. These count only when the sentence
    is about the account (it contains their, they, the company and similar words, or a word of the company
    name longer than 3 letters): require(s/d), needs, need to, will need.'
  example:
    scenario: '''Now is the perfect time for HP. Their engineering teams require more compute. Design
      workloads require high-performance computing.'' for Astra International.'
    steps:
    - 'Sentence 1: ''now is the perfect time'' and ''perfect time''.'
    - Sentence 2 is about the account ('their') and says 'require'.
    - Sentence 3 describes a type of workload - allowed.
    result: 'Flagged: now is the perfect time, perfect time, require.'
    computed_value:
    - now is the perfect time
    - perfect time
    - require
    verified: true
    expect:
    - now is the perfect time
    - perfect time
    - require
  output: A rewrite request, or a wording note on the published play after 2 rewrites.
  sources:
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:_has_overclaim
  - hp-backend/src/app/services/extractors/solution_narrative_opportunity_map.py:OVERCLAIM_ALWAYS
