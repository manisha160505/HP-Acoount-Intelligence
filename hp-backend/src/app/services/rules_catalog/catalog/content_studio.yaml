- id: cs_validator
  parent: null
  name: Checks on each draft
  kind: guardrail
  summary: Decides whether a draft can be published, must be rewritten, or is withheld.
  purpose: Decides whether a draft can be published, must be rewritten, or is withheld.
  inputs:
  - The AI's draft
  - The rules for the chosen format
  - The persona
  - The evidence labels
  - The evidence pool
  - Known contact names
  - The account's industry
  logic: 'SERIOUS FAULTS (the draft cannot be published): no draft content; a required part is missing;
    the number of body sections is outside the format''s range; the subject is over 80 characters; the
    subject does not start with ''Re: ''; (for a role persona, not a named person) any known contact''s
    full name appears in the copy; ''<our> <competitor>'' for any of dell, lenovo, huawei, acer, canon,
    zoom, apple, asus, samsung; any unsourced number; or none of the supplied evidence labels is cited.
    If any serious fault exists, the gate suite is not run. Otherwise the gate suite runs on the cleaned
    draft: every gate finding that says ''reject'' becomes a serious fault, and every finding that asks
    for a rewrite becomes a style warning. SOFT WARNINGS also come from Content Studio''s own filler-phrase
    list and from any ''!''. Unsourced web addresses are removed silently.'
  example:
    scenario: A CFO email (unfilled) with the subject 'Quick question about your PCs' and a body claiming
      '47% faster rollouts'.
    steps:
    - 'The subject does not start with ''Re: '' -> serious fault'
    - 47% is not in the data -> serious fault
    - The gates are not run because serious faults exist
    result: The draft is rejected with two faults; these go back to the AI as notes for the rewrite.
    verified: true
    expect:
    - null
    - - 'subject_line must start with "Re: " and then name the specific initiative or challenge; got "Quick
        question about your PCs"'
      - unsourced number(s) 47% - remove them or use only figures written in the evidence
    - []
  output: A cleaned draft (or none), the serious faults and the style warnings.
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_validate_asset
  confidence: high
