- id: cs_one_pager_contract
  parent: cs_formats_topics
  name: One-Pager contract (structured)
  kind: guardrail
  summary: Shape of the one-page brief.
  purpose: Shape of the one-page brief.
  logic: 'Required: headline (under 70 characters is requested but not checked), subtitle, ''why now'',
    pillars and closing ask; an HP play is optional. Pillars: the AI is asked for exactly 2 or 3, each
    with a heading, a challenge, an HP response and its own cited evidence. A pillar missing a heading
    or challenge is dropped; invented labels inside a pillar are removed and reported to G2 (which rejects).
    The finished document is: ''why now'' as the opening, one section per pillar (challenge and HP response),
    a ''The HP Play'' section if there is an HP play, then a ''Proof Points'' section added by the app.
    Allowed section count 2-5. Word budget 350-500 (G12, soft). G13 checks for 2-3 pillars, each citing
    evidence (soft).'
  constants:
  - label: Word budget
    ref: py:app.services.hp.content_gates:WORD_BUDGETS.one_pager
    stated:
    - 350
    - 500
  - label: Section count range
    ref: py:app.services.extractors.content_studio:CONTENT_TYPE_CONTRACTS.one_pager.sections
    stated:
    - 2
    - 5
  example:
    scenario: The AI returns two pillars; the first has no challenge, the second cites label A9, which
      was never supplied.
    steps:
    - Pillar 1 is dropped (no challenge)
    - Pillar 2 is kept with A9 removed; A9 is reported as dropped
    result: One pillar kept; the dropped label A9 is reported.
    verified: true
    expect:
    - - heading: Security baseline
        challenge: Mixed estate
        hp_response: HP Wolf Security
        evidence_used:
        - A1
    - - - pillars[1].evidence_used
        - A9
