- id: cs_gate_suite
  parent: null
  name: Gate suite G1-G13 (run on every draft)
  kind: guardrail
  summary: The automatic checks HP specified.
  purpose: The automatic checks HP specified.
  logic: 'Gates run in order, G1 to G13, on the cleaned draft. Each returns findings with an action. In
    Content Studio, ''reject'' means a serious fault (the draft cannot be published) and ''rewrite'' means
    a style warning (the draft is rewritten, but can still be published with the warning). Rejecting gates:
    G2, G4, G7, G8, G11 (and G1 only if no evidence pool is supplied). Rewrite gates: G1, G3, G5, G6,
    G9, G10, G12, G13.'
  table:
    columns:
    - Gate
    - Checks
    - Action
    rows:
    - - G1
      - a number that is not in the account's data
      - rewrite (reject if no evidence pool)
    - - G2
      - a cited evidence label that was never supplied
      - reject
    - - G3
      - no evidence cited, or the opening shares no word with the cited evidence
      - rewrite
    - - G4
      - a denied HP line is named
      - reject
    - - G5
      - more than one HP line
      - rewrite
    - - G6
      - closing ask outside the committee angle
      - rewrite
    - - G7
      - an unfilled role is addressed or greeted by name
      - reject
    - - G8
      - a competitor is called 'our' or is disparaged
      - reject
    - - G9
      - banned phrase, '!', 'however'-style pivot, or urgency built on the Windows 10 deadline that has
        passed
      - rewrite
    - - G10
      - industry used as the reason for a need
      - rewrite
    - - G11
      - a required part is present but empty
      - reject
    - - G12
      - word budget
      - rewrite
    - - G13
      - one-pager pillar count or pillar evidence
      - rewrite
