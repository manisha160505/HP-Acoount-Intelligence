- id: cs_tier_language
  parent: cs_hp_fact_guardrails
  name: Evidence-level wording
  kind: guardrail
  summary: Wording may not claim more than the evidence level allows.
  purpose: Wording may not claim more than the evidence level allows.
  logic: Below the Opportunity level, 'is relevant / is a strong fit / clearly addresses' is a fault.
    At the Context Only level, 'recommend / propose / should deploy' is a fault. Below the Opportunity
    level, a sentence that is not about HP and says the account needs, requires, plans to, is evaluating
    or has budget is a fault. Also G15 (a Next Gen AI PC must be 40-60 TOPS) and G16 (no product generation
    that the approved facts never state).
