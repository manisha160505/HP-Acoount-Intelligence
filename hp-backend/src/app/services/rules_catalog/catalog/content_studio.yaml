- id: cs_audit_ledger
  parent: null
  name: Gate audit records and review exports
  kind: guardrail
  internal: true
  summary: Makes every gate finding reviewable.
  purpose: Makes every gate finding reviewable.
  logic: 'Every attempt''s findings are stored with an outcome: ''published'' (the attempt the seller
    saw), ''rewritten'' (an earlier attempt that a later one replaced) or ''withheld'' (no attempt stood,
    or the fallback was used). An export writes 7 review files (one per gate type, plus a catch-all),
    always including empty ones. The release check passes only if every file is empty. A failure to record
    never blocks writing.'
  table:
    columns:
    - Review file
    - Details recorded
    rows:
    - - Unsourced numbers
      - account, persona, format, offending number, sentence
    - - Line eligibility
      - account, persona, denied line named, where found
    - - Closing ask
      - account, persona, committee angle, ask text, type of violation
    - - Name leaks
      - account, persona, leaked name, sentence
    - - Banned phrases
      - account, persona, phrase, sentence
    - - Evidence labels
      - account, persona, invalid label
    - - Other
      - account, persona, format, gate, detail
  example:
    scenario: An export where only the 'Other' file has 2 rows.
    steps:
    - Any count above 0 fails the release check
    result: Not clean (No).
    verified: true
    expect: false
