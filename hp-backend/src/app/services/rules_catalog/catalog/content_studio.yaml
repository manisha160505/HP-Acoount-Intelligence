# Rules page catalog for `content_studio`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: content_studio
purpose: Writes outreach for an HP seller (an email, a LinkedIn message or a one-pager) aimed at a chosen
  buying persona, using only the account's own evidence, then checks every draft against fixed rules before
  the seller sees it.
final_output: A ready-to-copy email, LinkedIn message or one-pager for one of HP's eight buying personas,
  with the evidence labels it used, an attached HP case study where one fits, any remaining style warnings,
  and a history of the last 20 assets.
how_it_combines: 'The seller picks a persona, a format and an HP topic. The app builds numbered evidence
  lines from the account''s own data and the persona''s allowed HP lines, and the AI writes the draft.
  Every draft is then checked by a set of gates, G1-G13: some gates reject the draft, the others only
  warn. After up to two rewrites, the cleanest draft without serious faults is published with its warnings;
  if none qualifies, a plain template is used. A case study is attached afterwards.'
rules:
- id: cs_evidence_sources
  parent: null
  name: What the writer may use as evidence
  kind: source
  summary: Fixes the only material a generated asset may state as fact about the account.
  purpose: Fixes the only material a generated asset may state as fact about the account.
  inputs:
  - The company profile
  - Job openings
  - The contact list
  - The account's buyer-persona list
  - 'Published dashboard sections: technology landscape, buying-intent themes, opportunity signals (or
    news signals), opportunity plays and key financial figures'
  - The seller's topic, additional context and chosen angle
  - The account team's own instructions and guardrails
  logic: Every request builds one list of numbered evidence lines. Account lines are labelled A1, A2...
    and persona lines P1, P2... The AI is told to use only these for any claim about the account and to
    name the labels it used. The seller's topic and additional context are shown to the AI but marked
    'NOT evidence'. The account team's custom instructions and guardrails (set per account) steer tone
    and can only narrow what is written.
  output: 'A labelled list of evidence lines: account lines A1..An and persona lines P1..Pn.'
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_build_generation_context
  - hp-backend/src/app/services/extractors/content_studio.py:_build_system_prompt
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, Section 3.3;
    Recommendation Tuning row 8 (cited in code)
  confidence: high
- id: cs_account_evidence_lines
  parent: cs_evidence_sources
  name: Account evidence lines, in fixed order
  kind: selection
  summary: Defines which account facts reach the writer and how many of each.
  purpose: Defines which account facts reach the writer and how many of each.
  logic: 'Lines are added in this order and skipped entirely when their source is empty (no placeholder):
    1) Business description (company profile); 2) Industry (the LinkedIn, NAICS and SIC industry labels
    joined with '' / ''); 3) Open hiring (HP-relevant hiring clusters, see the hiring clusters rule);
    4) Technology estate: the total count and the first 5 technology families; 5) Research intent: the
    first 3 themes, always followed by the sentence ''This is research, not confirmed buying intent.'';
    6) Published signals: the first 3 headlines from the opportunity signals (otherwise from the news
    signals); 7) Qualified opportunities: the first 3 Opportunity Map plays that have a priority; 8) Filings
    on record: the first 2 filing titles from the key financial figures. Each line becomes a numbered
    evidence line ''[A<n>] <name>: <text>''.'
  constants:
  - label: Technology families shown
    ref: py:app.services.extractors.content_studio:EVIDENCE_TECH_FAMILIES
    stated: 5
  - label: Intent themes shown
    ref: py:app.services.extractors.content_studio:EVIDENCE_INTENT_THEMES
    stated: 3
  - label: Signals shown
    ref: py:app.services.extractors.content_studio:EVIDENCE_SIGNALS
    stated: 3
  - label: Opportunity plays shown
    ref: py:app.services.extractors.content_studio:EVIDENCE_PLAYS
    stated: 3
  - label: Filings shown
    ref: py:app.services.extractors.content_studio:EVIDENCE_FILINGS
    stated: 2
  example:
    scenario: An account whose company profile has a description and an industry.
    steps:
    - Business description -> [A1]
    - Industry -> [A2]
    - The lines are numbered in order
    result: '[A1] Business description: Maker of motorcycles / [A2] Industry: Automotive'
    verified: true
    expect:
    - |-
      [A1] Business description: Maker of motorcycles
      [A2] Industry: Automotive
    - A1: 'Business description: Maker of motorcycles'
      A2: 'Industry: Automotive'
  output: Ordered list of evidence lines (name and text).
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_account_evidence
  - hp-backend/src/app/services/extractors/content_studio.py:_published_evidence
  - hp-backend/src/app/services/extractors/content_studio.py:_label_block
  confidence: high
- id: cs_hiring_clusters
  parent: cs_evidence_sources
  name: Open-hiring clusters used as evidence
  kind: selection
  summary: Turns job postings into HP-relevant role clusters for the 'Open hiring' evidence line.
  purpose: Turns job postings into HP-relevant role clusters for the 'Open hiring' evidence line.
  logic: 'For each posting: the title is the standardised title if there is one, otherwise the posting''s
    own title. Skip it if seniority is empty or one of junior, intern, internship, entry, entry level
    or trainee. The department comes from the posting''s job categories. Skip internships, and skip postings
    whose every category is non-IT (military and protective services, human resources, legal, sales, marketing,
    administration, manual work, healthcare services, education, food). Score HP relevance with the same
    job-title scoring the Stakeholder Map uses; if a posting mixes non-IT categories with no IT category,
    cap the score at 40. Drop the posting if its band is ''low'' (score below 40). Group by department
    and seniority; keep the top 3 standard titles (business-unit suffixes like '' - GSI'' are removed).
    Sort clusters by best score, then number of postings, then title; keep at most 5.'
  constants:
  - label: Most clusters
    ref: py:app.services.extractors.content_studio:ROLE_PROXY_MAX
    stated: 5
  - label: Excluded seniority levels
    ref: py:app.services.extractors.content_studio:PROXY_EXCLUDED_SENIORITY
    stated:
    - entry
    - entry_level
    - intern
    - internship
    - junior
    - trainee
  - label: Non-IT title score cap
    ref: py:app.services.extractors.stakeholder_map:NON_IT_TITLE_CAP
    stated: 40
  - label: HP relevance bands
    ref: py:app.services.extractors.stakeholder_map:HP_RELEVANCE_BAND_THRESHOLDS
  example:
    scenario: 'Five postings: two mid-senior data engineers, one IT intern, one ''Security Supervisor''
      under protective services, one IT Infrastructure Manager.'
    steps:
    - The intern is dropped (seniority)
    - The Security Supervisor is dropped (only a non-IT category)
    - 'The two data engineers form one cluster: Information Technology / Mid-senior'
    - The IT Infrastructure Manager forms Information Technology / Manager
    result: 'Two clusters: ''Information Technology - Mid-senior'' (2 postings) and ''Information Technology
      - Manager'' (1 posting), both in the high band.'
    verified: true
    expect:
    - - Information Technology — Mid-senior
      - 2
      - high
    - - Information Technology — Manager
      - 1
      - high
  output: 'The ''Open hiring'' evidence line: ''<N> open postings; HP-relevant roles - <count> <department>
    (<seniority>): <titles>; ...'''
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_derive_role_proxy_personas
  - hp-backend/src/app/services/extractors/content_studio.py:_job_department
  - hp-backend/src/app/services/extractors/content_studio.py:_canonical_title
  confidence: high
- id: cs_grounding_corpus
  parent: cs_evidence_sources
  name: Evidence pool and the unsourced-number rule
  kind: source
  summary: Every figure in the copy must already exist in the account's own data.
  purpose: Every figure in the copy must already exist in the account's own data.
  logic: The pool is every non-empty value in the company profile, contact list and job openings, plus
    the seller's topic and additional context, plus the text of every evidence line. A number is checked
    only if it has 2 or more digits. Commas and spaces are ignored ('4,500' = '4500'), and '36' matches
    '36.0'. A percentage must appear as a percentage in the data ('47%' is not satisfied by a bare 47).
    Numbers are matched whole, not as part of a longer number. A web address that is not in the data is
    removed from the copy rather than causing the draft to be rejected.
  example:
    scenario: The copy says 'Your 4,500 staff and 47% growth'; the data holds an employee range of 4500
      and 'growth 12%'.
    steps:
    - '4,500 -> 4500 is in the data: fine'
    - '47% is not a stored percentage: unsourced'
    result: 47% is flagged as unsourced.
    verified: true
    expect:
    - 47%
  output: List of unsourced numbers; unsourced web addresses removed.
  sources:
  - hp-backend/src/app/services/extractors/grounding.py:unsourced_numbers
  - hp-backend/src/app/services/extractors/grounding.py:check_text
  - hp-backend/src/app/services/extractors/grounding.py:strip_unsourced_urls
  - hp-backend/src/app/services/extractors/content_studio.py:_build_generation_context
  confidence: high
- id: cs_seller_input_limits
  parent: cs_evidence_sources
  name: Seller input limits
  kind: filter
  summary: Bounds what the seller can type into a request.
  purpose: Bounds what the seller can type into a request.
  logic: A topic is required and is cut to 200 characters. Additional context is cut to 2,000 characters.
    A chosen angle is cut to 200 characters. An unknown or retired format, an unknown persona or an empty
    topic is refused with a readable error.
  constants:
  - label: Topic maximum characters
    ref: py:app.services.extractors.content_studio:TOPIC_MAX_CHARS
    stated: 200
  - label: Additional context maximum characters
    ref: py:app.services.extractors.content_studio:CONTEXT_MAX_CHARS
    stated: 2000
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_build_generation_context
  - hp-backend/src/app/services/extractors/content_studio.py:generate_content_asset
  confidence: high
- id: cs_persona_selection
  parent: null
  name: 'Target persona menu: HP''s eight buying roles'
  kind: selection
  summary: Decides who the seller can write to.
  purpose: Decides who the seller can write to.
  inputs:
  - The account's buyer-persona list (target role, contact name, actual job title, contact status)
  - HP's fixed list of eight buying personas
  logic: The menu always shows the same eight personas on every account, in a fixed order. Each is matched
    to the account's buyer-persona list by comparing the words in the job title (a trailing '(CFO)' is
    tolerated). If the list names a contact for that role, the persona is FILLED (the contact's name and
    actual title are shown); otherwise it is UNFILLED ('no contact identified for this role'). An account
    without a list still shows all eight, unfilled. Title, department and committee angle always come
    from HP's fixed persona list, not from the account's list. Older persona types (named contacts, hiring-based
    roles and generic archetypes) are no longer offered, but assets already built on them still display.
  table:
    columns:
    - Persona title
    - Department
    - Committee angle
    rows:
    - - VP / Head of Information Technology
      - IT
      - Economic Buyer
    - - Chief Financial Officer
      - Executive / C-Suite
      - Finance - Budget Owner
    - - IT Asset Manager
      - IT
      - Technical Buyer
    - - Head of Procurement
      - Procurement
      - Gatekeeper - Procurement & Legal
    - - IT Security Manager
      - IT / Security
      - Technical Buyer
    - - Device Lifecycle & Refresh Manager
      - IT
      - Finance - Budget Owner
    - - PC Fleet & Hardware Standards Owner
      - IT
      - Technical Buyer
    - - AV & Collaboration Systems Manager
      - IT
      - Technical Buyer
  example:
    scenario: The account's buyer-persona list shows 'Chief Financial Officer (CFO)', 'Head of Procurement'
      and 'Chief Marketing Officer'.
    steps:
    - '''Chief Financial Officer (CFO)'' matches the Chief Financial Officer persona'
    - '''Head of Procurement'' matches the Head of Procurement persona'
    - '''Chief Marketing Officer'' is not one of the eight, so there is no match'
    result: Chief Financial Officer, Head of Procurement, no match
    verified: true
    expect:
    - cfo
    - head-procurement
    - null
  output: Eight personas on the menu, each marked filled or unfilled.
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_derive_client_personas
  - hp-backend/src/app/services/extractors/content_studio.py:extract_content_studio
  - hp-backend/src/app/services/hp/buyer_personas.py:match_role
  - hp-backend/src/app/services/extractors/personas.py:read_roles
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, Sections 1.4,
    2.2
  confidence: high
- id: cs_persona_evidence
  parent: cs_persona_selection
  name: What the writer is told about the persona
  kind: selection
  summary: Keeps persona pain points out of what the writer is given.
  purpose: Keeps persona pain points out of what the writer is given.
  logic: 'For the eight roles the persona information is exactly: P1 Role, P2 Department, P3 Buying-committee
    angle, P4 ''What this role owns'' and P5 ''What this role is measured on'' (key metrics). Only when
    the persona is FILLED are P6 Name and P7 Actual job title added; when UNFILLED they are left out,
    not left blank. Goals, pain points, value drivers and decision criteria are deliberately NOT given
    to the writer.'
  example:
    scenario: CFO persona.
    steps:
    - Read HP's evidence lines for the CFO persona
    result: Five lines, P1 to P5.
    verified: true
    expect:
    - - P1
      - 'Role: Chief Financial Officer'
    - - P2
      - 'Department: Executive / C-Suite'
    - - P3
      - 'Buying-committee angle: Finance - Budget Owner'
    - - P4
      - 'What this role owns at an enterprise: Signs off the capital budget and the financing model -
        lease versus buy - for any large device or print fleet purchase.'
    - - P5
      - 'What this role is measured on: 3-year TCO per seat, cash out by year, payback or NPV, total lease
        liability / right-of-use asset, cost of delay, supplier price-protection terms'
  sources:
  - hp-backend/src/app/services/hp/buyer_personas.py:generation_evidence
  - hp-backend/src/app/services/extractors/content_studio.py:_persona_evidence
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, Section 3.3
  confidence: high
- id: cs_named_vs_role
  parent: cs_persona_selection
  name: 'Person or role: the one switch'
  kind: selection
  summary: Decides whether copy may address a named person.
  purpose: Decides whether copy may address a named person.
  logic: A persona is a named person only if it is a contact from the stakeholder list (older style) or
    an HP buying role that is FILLED. Everything else is a role. This one test decides which writing rule
    is used, whether contact names are banned in the copy, whether gate G7 runs, and how the email is
    greeted.
  example:
    scenario: An unfilled and a filled HP buying role.
    steps:
    - Unfilled -> role
    - Filled -> person
    result: No (a role), Yes (a person)
    verified: true
    expect:
    - false
    - true
  sources:
  - hp-backend/src/app/services/extractors/content_studio.py:_is_named_person
  confidence: high
