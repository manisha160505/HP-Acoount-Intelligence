  purpose: Stops a well-written email pitching the wrong HP line to a persona (for example Poly to a CFO).
  logic: Each persona has an allowed list and a denied list of HP lines. The writing rules give the AI
    both lists. After the draft is written, gate G4 rejects any asset that names a denied line in its
    product list or anywhere in the text (ignoring capital letters). Lines on neither list are not rejected
    by G4. HP has not yet confirmed this matrix.
