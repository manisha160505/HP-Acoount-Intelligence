- id: cs_retry_publish
  parent: null
  name: Retry, choose and publish
  kind: selection
  summary: How many attempts are made and which draft the seller sees.
  purpose: How many attempts are made and which draft the seller sees.
  logic: Attempt 1, then up to 2 rewrites while the draft has a serious fault or any style warning. Each
    rewrite tells the AI exactly which faults or warnings to fix and to use calibrated language. The 'best'
    draft is the publishable one (no serious faults) with the fewest warnings; it is published with its
    remaining warnings attached. If no attempt was publishable, the plain fallback template is used (see
    the fallback template rule); if even that cannot be built, nothing is published, earlier assets are
