- id: cs_email_contract
  parent: cs_formats_topics
  name: Email contract
  kind: guardrail
  summary: Shape of a generated email.
  purpose: Shape of a generated email.
  logic: 'Required: subject line, opening, body sections and closing ask. The subject must start with
    ''Re: '' and be at most 80 characters (both are serious faults). 1 to 3 body paragraphs, no headings.
    Word budget 120-180 across opening, body and closing ask (checked by gate G12, a soft warning). The
    greeting and sign-off are added by the app, never written by the AI. The sign-off is ''Sincerely,''
    followed by ''The HP Inc. Team''.'
  constants:
  - label: Subject maximum characters
    ref: py:app.services.extractors.content_studio:CONTENT_TYPE_CONTRACTS.email.subject_max
    stated: 80
  - label: Word budget
    ref: py:app.services.hp.content_gates:WORD_BUDGETS.email
    stated:
    - 120
    - 180
  - label: Sign-off
    ref: py:app.services.extractors.content_studio:EMAIL_SIGNOFF
    stated: |-
      Sincerely,

      The HP Inc. Team
  sources:
