- id: cs_claim_quality
  parent: cs_hp_fact_guardrails
  name: Product-deck claim quality filter
  kind: filter
  summary: Keeps only concrete, usable lines from HP product decks.
  purpose: Keeps only concrete, usable lines from HP product decks.
  logic: 'A line is dropped if it is empty; has fewer than 4 words; starts with a fragment word (and,
    or, with, the, a, an, to, for, of, in, on, that, plus, your, by, from, at, as, is, are, be); is legal
    or housekeeping boilerplate; or is only a product name. Otherwise it must carry something concrete:
    a measurement with a unit, a named feature term, a support or availability condition, or qualifiers.
    Marketing wording is fatal only when nothing concrete is present. Duplicates are merged per product
    family, generation, form factor and restriction flags.'
  constants:
  - label: Minimum words
    ref: py:app.services.hp.claim_quality:MIN_WORDS
    stated: 4
  example:
    scenario: Four deck lines.
    steps:
    - '''Up to 14 hours of battery life on select configurations'' -> concrete'
    - '''Raw power that stops what others cannot see'' -> marketing'
    - '''HP EliteBook 8 G2i 14-inch Next Gen AI PC'' -> product name only'
    - '''and more'' -> too short'
    result: keep, drop, drop, drop
    verified: true
    expect:
    - - true
      - null
    - - false
      - positioning language with no specification
    - - false
      - product name only
    - - false
      - too short
  sources:
