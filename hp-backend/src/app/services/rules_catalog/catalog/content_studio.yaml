  purpose: Gives the seller something grounded when every generated draft failed.
  logic: 'Built by fixed rules with no AI: needs at least one account evidence label. Opening = ''At HP,
    we track publicly reported developments at <company>. This note follows one of them: <text of the
    first account evidence line>''. One body paragraph names the persona''s title as counterparts and
    frames it as a question. The closing ask requests a short briefing. An email gets the subject ''Re:
    <topic>'' (maximum 80). A one-pager gets two pillars (''What was reported'', ''What it depends on'')
    with no HP response. No HP line, no proof point. It is marked as a fallback, with a warning, and the
    screen must not present it as generated copy.'
