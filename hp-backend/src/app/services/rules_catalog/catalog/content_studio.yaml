- id: cs_ask_bound
  parent: cs_line_eligibility
  name: The ask is bounded by the committee angle (G6)
  kind: guardrail
  summary: Keeps the closing ask appropriate to the persona's role in the buying committee.
  purpose: Keeps the closing ask appropriate to the persona's role in the buying committee.
  logic: 'The closing ask is checked against the persona''s committee angle. Gatekeeper: fails if it names
    any HP line, or contains ''choose'', ''select'' or ''pick''. Finance - Budget Owner: fails on any
    currency symbol or code ($, EUR, IDR, ...) or a commercial term (price, pricing, quote, quotation,
    discount, rate card, contract terms, per seat cost, cost per seat). Technical Buyer: fails on a decision
    term (decide, decision, sign off, approve, approval, commit to, commitment, place an order, purchase
    order, choose hp, select hp, go ahead, move forward with hp) or a commercial term. Economic Buyer:
    no check. The action is ''rewrite'', which Content Studio treats as a soft warning.'
  table:
    columns:
    - Committee angle
    - May ask for
    - Never
    rows:
    - - Economic Buyer
      - a decision-oriented ask is acceptable
      - '-'
    - - Technical Buyer
      - an evaluation, a technical review, a pilot
      - a decision, a commercial term
    - - Finance - Budget Owner
      - cost, lifecycle, the shape of the business case
      - a price, a discount, an assumption that a budget exists
    - - Gatekeeper - Procurement & Legal
      - the process - how a vendor is evaluated, what documentation is needed
      - a product pitch, asking them to choose a vendor
  example:
    scenario: A CFO (Finance - Budget Owner) email closing 'Could I send you pricing for a 200-seat refresh?'.
    steps:
    - The committee angle is Finance - Budget Owner
    - '''pricing'' is a commercial term'
    result: 'G6 finding: names a commercial term (pricing).'
    verified: true
    expect:
    - gate: G6
      action: regenerate
      audit: audit_ask_bound.csv
      committee_angle: Finance - Budget Owner
      ask_text: Could I send you pricing for a 200-seat refresh?
      violation_type: names a commercial term (pricing) to a Finance - Budget Owner
