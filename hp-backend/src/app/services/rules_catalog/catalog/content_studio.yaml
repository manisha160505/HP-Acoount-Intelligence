- id: cs_proof_point
  parent: null
  name: HP case study attached after writing
  kind: score
  summary: Adds one real HP customer story for the line the draft earned, without letting the AI pick
    it.
  purpose: Adds one real HP customer story for the line the draft earned, without letting the AI pick
    it.
  logic: 'The AI never sees case studies. After a draft passes, the app maps the draft''s HP line to case-study
    lines, ranks the studies and attaches one (skipped for the fallback and when there is no HP line).
    Ranking points: +100 per shared use-case tag (tags come from the topic and the format), +10 same industry,
    +4 has an outcome, +2 published by HP itself, +1 has a challenge, +2 told as a story (not only a customer
    quote). Ties go to the study with more source documents, then by customer name. Content Studio picks
    after the Objection Playbook, Opportunity Map and Messaging, so it prefers a study that none of those
    cites (soft) and never repeats one already on its own stored assets (hard). A swap for variety may
    not lose the industry match or the story form. One-pager: added as a ''Proof Points'' section only
    if the copy stays within 500 words; always stored with the asset.'
  formula: score = 100 x shared tags + 10 x same industry + 4 x has outcome + 2 x published by HP + 1
    x has challenge + 2 x told as a story (each yes/no item counts 1 for yes and 0 for no)
  constants:
  - label: Per shared use-case tag
    ref: py:app.services.hp.case_studies:SCORE_PER_SHARED_SIGNAL
    stated: 100
  - label: Same industry
    ref: py:app.services.hp.case_studies:SCORE_SAME_INDUSTRY
    stated: 10
  - label: Has outcome
    ref: py:app.services.hp.case_studies:SCORE_HAS_OUTCOME
    stated: 4
  - label: Published by HP
    ref: py:app.services.hp.case_studies:SCORE_HP_PUBLISHED
    stated: 2
  - label: Has challenge
    ref: py:app.services.hp.case_studies:SCORE_HAS_CHALLENGE
    stated: 1
  - label: Told as a story
    ref: py:app.services.hp.case_studies:SCORE_NARRATED
    stated: 2
  example:
    scenario: Topic 'HP Elite & Pro PCs' for an industrial-machinery account; a study tagged Fleet-Refresh
      in Industrial Manufacturing with an outcome, published by HP, a challenge and told as a story.
    steps:
    - Topic -> use-case tag Fleet-Refresh
    - 100 + 10 + 4 + 2 + 1 + 2
    result: Score 119.
    verified: true
    expect:
    - 119
    - 1
    - acme
  sources:
