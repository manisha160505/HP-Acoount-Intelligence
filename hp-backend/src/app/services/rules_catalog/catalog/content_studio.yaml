- id: cs_prompt_rules
  parent: null
  name: Rules the AI is instructed to follow
  kind: model
  summary: The writing rules given to the AI; only some are checked automatically (see the gates).
  purpose: The writing rules given to the AI; only some are checked automatically (see the gates).
  logic: 'The AI is told to: (1) never call a competitor (''Dell, Lenovo, Huawei, Acer, Canon, Zoom, Apple,
    Asus or Samsung'') ''our'' product, and never disparage one; (2) ground every statement about the
    account in the evidence, inventing no numbers, web addresses, names, product codes or events; (2a)
    quote the data rather than characterise the business; (2b) never use industry as the reason for a
    technology need; (3) treat the topic as not evidence, and hedge with may, could or suggests; (4) earn
    any HP play from the persona''s remit plus the evidence, otherwise name no product and write a discovery-led
    piece, and name at most one HP line; (5) follow the persona rule for the kind of persona (filled role:
    write to the person and never imply private concerns; unfilled role: name and greet nobody and address
    the role; older hiring-based or archetype variants); (6) have the opening name one evidence item by
    its content; (7) name the labels it used; (8) use HP''s voice: no concessive ''However'' pattern,
    no hollow abstractions, no benefit lists or superiority claims, no ''I hope this finds you well'',
    no exclamation marks, and never treat Windows 10 support (which ended in October 2025) as upcoming;
    (9) leave a field out rather than fill it with empty text; (10) respect the persona''s allowed and
    denied HP lines; (11) keep the closing ask within the committee angle. The checks applied automatically
    are listed under the draft checks and the gate suite. The rest (for example 2a, the ''earned'' chain
    in 4, and voice) are judged by the AI only.'
