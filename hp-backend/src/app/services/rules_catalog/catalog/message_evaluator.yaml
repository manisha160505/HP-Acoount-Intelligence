# Rules page catalog for `message_evaluator`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: message_evaluator
purpose: Scores a seller's own draft (an email, a LinkedIn message or a one-pager) for one of eight buying
  roles, gives feedback on specific phrases, and can rewrite the draft using only the changes the seller
  picks.
final_output: A total score with its band and the formula used; seven scores with a reason for each; format
  checks (pass or fail); Keep, Improve or Change marks on the draft; a summary with strengths and weaknesses;
  a carefully limited simulated reaction (Deep mode only); and, if asked, a checked rewrite with the changes
  shown.
how_it_combines: The AI scores the seller's draft on seven qualities for the chosen role. The scores are
  checked and then combined into one total using the weighting set for the chosen objective. Caps are
  applied for serious failures (for example, an HP product line this role is never offered caps the Relevance
  score). Format checks, source rules and market restrictions run alongside. Phrase feedback must cover
  the whole message. An optional rewrite applies only the changes the seller selects and is then checked
  against the same content rules as generated content.
rules:
- id: me_personas
  parent: null
  name: Who a message is scored against
  kind: selection
  summary: 'The role menu: the client''s eight roles, each with a fixed profile.'
  purpose: 'The role menu: the client''s eight roles, each with a fixed profile.'
  inputs:
  - The account's list of named contacts
  - The fixed profiles of the eight roles
  logic: The same eight roles as in Content Studio are offered on every account. Each is marked as filled
    or unfilled, depending on whether the account has a named contact in that role. The profile of each
    role is fixed and the same on all accounts. It covers title, department, buying-committee angle, remit,
    goals, pain points, value drivers, decision criteria, tone, format, key metrics, what resonates and
    what does not, typical objections, the HP opportunity and an evidence grade. Only whether a named
    contact holds the role differs between accounts. A role that is not offered for the account is refused
    with 'does not belong to this account'. In Deep mode, the role's assumed starting attitude is added
    to the profile.
  table:
