      - Initial skepticism
      - Moderate
    - - IT asset manager
      - Technical Buyer
      - Information seeking
      - Moderate
    - - Head of procurement
      - Gatekeeper - Procurement & Legal
      - Evaluation mode
      - Moderate
    - - IT security manager
      - Technical Buyer
      - Initial skepticism
      - Strong
    - - Device lifecycle manager
      - Finance - Budget Owner
      - Information seeking
      - Strong
    - - PC fleet standards owner
      - Technical Buyer
      - Initial skepticism
