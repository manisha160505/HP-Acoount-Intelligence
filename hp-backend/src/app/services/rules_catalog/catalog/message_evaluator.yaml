- id: me_rewrite_diff
  parent: me_rewrite
  name: Rewrite change check
  kind: guardrail
  summary: The rewrite may not slip in new claims.
  purpose: The rewrite may not slip in new claims.
  logic: The numbers and web links in the original are compared with those in the rewrite. Each rewrite
    sentence that contains an added number or link is checked against its source. If it is Unsupported
    or Restricted, that is a fault. A new superlative (where the country blocks them) or a newly named
    competitor (where blocked) is also a fault. Figures that were dropped are reported but do not block
    the rewrite.
  example:
    scenario: An Indonesian account. The original says 'Your 4500 staff deserve better.' The rewrite adds
      '12 sites' and 'the best PCs from the market-leading vendor'.
    steps:
