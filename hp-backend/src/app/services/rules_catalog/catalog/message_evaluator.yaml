- id: me_phrase_feedback
  parent: null
  name: Phrase-level Keep / Improve / Change
  kind: model
  summary: Feedback tied to the exact words the seller wrote.
  purpose: Feedback tied to the exact words the seller wrote.
  logic: 'The AI must cut the whole message into chunks (Lite: exactly 5; Deep: 10 to 15) and give each
    one a verdict, a comment and a suggestion. Each chunk is then found in the draft, ignoring capital
    letters and spacing. A chunk that cannot be found, or that repeats another chunk''s words, is dropped.
    Chunks beyond the limit for the mode are dropped. Unknown verdicts become Improve. Each chunk is also
    checked as a claim. If it is Unsupported or Restricted, it is marked as a factual issue, and a ''Keep''
    is changed to ''Change''. Colours: Keep is green, Improve is yellow, Change is red. A Deep review
    with fewer than 10 chunks is noted for review but is not rejected.'
  constants:
  - label: Lite chunks
    ref: py:app.services.evaluator.evaluate:LITE_MAX_CHUNKS
    stated: 5
  - label: Deep chunks
    value:
    - 10
    - 15
  example:
    scenario: The AI returns four chunks for the Indonesian draft, all marked Keep or Improve. One quotes
      text the seller never wrote.
    steps:
    - The superlative sentence is Restricted, so its Keep becomes Change (red)
    - The 99% sentence is Unsupported, so it is marked as a factual issue and stays Improve
    - The 4500 sentence is Supported, so it stays Keep (green)
    - The chunk that was not found is dropped
    result: 3 chunks kept (Change, Improve, Keep); 1 dropped.
    verified: true
    expect:
    - - - 0
        - 31
        - Change
        - red
        - factual_grounding
      - - 32
        - 70
        - Improve
        - yellow
        - factual_grounding
      - - 71
        - 102
        - Keep
        - green
        - style
    - - reason: not found in the submitted message
        chunk: Something never written
  sources:
