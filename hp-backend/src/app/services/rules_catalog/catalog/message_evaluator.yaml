  confidence: high
- id: me_dimension_validation
  parent: me_scoring
  name: Score checks
  kind: guardrail
  summary: Each AI score is checked before it counts towards the total.
  purpose: Each AI score is checked before it counts towards the total.
  logic: A score is valid when it is a number from 0 to 100. If any score is not valid, the AI is asked
    once more and told what to correct. The second answer only adds to the first - a score that was valid
    the first time is kept, and one that is valid only the second time is taken from there. A quality that
    still has no score is filled in with 50 and labelled as filled in, when no more than 2 are unscored
    and together they carry less than half of the total. Scores that are not numbers, or are outside 0
    to 100, are never filled in. The valid scores are always shown. The total and its band appear once
    every quality has a valid score.
  constants:
  - label: Fill-in score
    ref: py:app.services.evaluator.scoring:PAD_SCORE
    stated: 50.0
  - label: Most scores that may be filled in
    ref: py:app.services.evaluator.scoring:MAX_PADDED_DIMENSIONS
    stated: 2
  - label: Share of the total that filled-in scores must stay under
    ref: py:app.services.evaluator.scoring:MAX_PADDED_WEIGHT
    stated: 0.5
  example:
    scenario: The AI returns Relevance 80, Impact '70', Brand Recall 400, Clarity 'excellent', and nothing
      else.
    steps:
    - Relevance and Impact are valid
    - Brand Recall is out of range and Clarity is not a number
    - Creativity, Emotional Connection and Next-step Strength have no score - three, which is more than
      may be filled in
    result: Nothing is filled in. The two valid scores are shown, with no total.
    verified: true
    expect:
    - relevance: 80.0
      impact: 70.0
    - []
    - - 'brand_recall: 400 outside 0-100'
      - 'clarity: not numeric (''excellent'')'
      - 'creativity: missing'
      - 'emotional_connection: missing'
      - 'next_step_strength: missing'
  sources:
  - hp-backend/src/app/services/evaluator/scoring.py:validate_dimensions
  - hp-backend/src/app/services/evaluator/scoring.py:pad_missing
  - hp-backend/src/app/services/evaluator/scoring.py:split_dimension_payload
  - hp-backend/src/app/services/evaluator/evaluate.py:evaluate_message
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, T21 (quoted
    in scoring.py)
  confidence: high
- id: me_severe_failures
  parent: me_scoring
  name: Severe-issue caps
  kind: selection
  summary: A wrong HP product line or an out-of-angle ask always pulls the score down.
  purpose: A wrong HP product line or an out-of-angle ask always pulls the score down.
  logic: 'Before the AI scores the draft, two of Content Studio''s content checks are run on it. The first
    looks for an HP product line that this role is never offered, anywhere in the text. The second looks
    at the ask, meaning the last question in the message or, if there is none, the last sentence. After
    the AI scores the draft, an issue found by the first check caps Relevance at 39. An issue found by
    the second check caps Next-step Strength at 39. Caps only push scores down: if the AI''s score is
    already lower, it is kept. The summary starts with ''<Quality> scored down: <reason>.'''
  constants:
  - label: Severe cap
    ref: py:app.services.evaluator.evaluate:SEVERE_FLOOR
    stated: 39.0
  example:
    scenario: 'A draft to the CFO: ''Hi Budi, Poly Studio bars give finance teams clearer meetings. Could
      I send you pricing?'''
    steps:
    - Poly Studio is never offered to the CFO, so Relevance is capped at 39
    - The ask 'Could I send you pricing?' raises a commercial term with a Finance - Budget Owner, so Next-step
      Strength is capped at 39
    result: Two severe issues, so both qualities are capped at 39.
    verified: true
    expect:
    - dimension: relevance
      gate: G4
      detail: Poly Studio is a line this persona is never offered (found in prose)
      quote: Hi Budi, Poly Studio bars give finance teams clearer meetings.
    - dimension: next_step_strength
      gate: G6
      detail: 'the ask is outside this persona''s committee angle (Finance - Budget Owner): names a commercial
        term (pricing) to a Finance - Budget Owner'
      quote: Could I send you pricing?
  sources:
  - hp-backend/src/app/services/evaluator/evaluate.py:_severe_failures
  - hp-backend/src/app/services/evaluator/evaluate.py:_ask_sentence
  - hp-backend/src/app/services/evaluator/evaluate.py:evaluate_message
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, Section 4.5
    (T17/T18)
  confidence: high
- id: me_scoring_context
  parent: me_scoring
  name: What Brand Recall and Impact are judged against
  kind: selection
  uses:
  - hp_rulebook
  summary: Gives the AI the HP positioning and proof that exist for the product lines the seller named.
  purpose: Gives the AI the HP positioning and proof that exist for the product lines the seller named.
  logic: The draft is checked for the HP product lines it names, using a fixed list of product line names.
    For each line found, the AI is given up to 3 rules from HP's approved messaging (the offer, up to 3
    facts that may be stated and up to 3 things that must not be said). It is also given up to 2 HP case
    studies, ranked by how well they match the draft and the account's industry. When no case study fits,
    the recommendation for a benefit claim with no proof is to cut it. The AI weighs this context in its
    scoring; it does not change any number directly.
  constants:
  - label: Messaging rules per product line
    ref: py:app.services.evaluator.evaluate:RULEBOOK_RULES_PER_LINE
    stated: 3
  - label: Proof points per product line
    ref: py:app.services.evaluator.evaluate:PROOF_POINTS_PER_LINE
    stated: 2
  example:
    scenario: The draft says 'Our HP Wolf Security and HP Elite / Pro PCs bundle'.
    steps:
    - Match the product line names in the draft
    result: HP Elite / Pro PCs and HP Wolf Security
    verified: true
    expect:
    - HP Elite / Pro PCs
    - HP Wolf Security
  sources:
  - hp-backend/src/app/services/evaluator/evaluate.py:_hp_lines_named
  - hp-backend/src/app/services/evaluator/evaluate.py:_rulebook_positioning
  - hp-backend/src/app/services/evaluator/evaluate.py:_proof_available
  - hp-backend/src/app/services/evaluator/evaluate.py:_rulebook_block
  confidence: medium
- id: me_structure_checks
  parent: null
  name: Format checks
  kind: guardrail
  summary: Checks on the shape of the message, run directly on the text and independent of the AI.
  purpose: Checks on the shape of the message, run directly on the text and independent of the AI.
  logic: 'Email: at most 180 words; a ''Subject:'' line that is at most 80 characters; a greeting at the
    very start of the text (dear, hi, hello, hey, good morning or good afternoon); a sign-off line at
    the end (best regards, kind regards, regards, sincerely, thanks, cheers and similar); and next-step
    language. LinkedIn Message: at most 110 words; at most 300 characters; a greeting; and next-step language
    (no sign-off needed). One-Pager: at most 500 words; next-step language; and at least 2 heading-like
    lines. Next-step language means phrases such as: let me know, happy to, are you free or available,
    can we, shall we, book, schedule, set up, arrange, call, meeting, demo, chat, connect, reply, respond,
    get in touch, reach out, next step, follow up, would you be open, worth a conversation, interested
    in. Any check the draft does not yet meet is given to the AI as a settled result.'
  table:
    columns:
    - Format
    - Max words
    - Max characters
    - Subject line
    - Greeting
    - Sign-off
    - At least 2 headings
    rows:
    - - Email
      - '180'
      - '-'
      - 'Yes'
      - 'Yes'
      - 'Yes'
      - '-'
    - - LinkedIn message
      - '110'
      - '300'
      - '-'
      - 'Yes'
      - '-'
      - '-'
    - - One-pager
      - '500'
      - '-'
      - '-'
      - '-'
      - '-'
      - 'Yes'
  example:
    scenario: 'An email that starts with ''Subject: Re: your Cikarang plant refresh'', then ''Dear Ms
      Tan,'', a body with ''Would you be open to a 20-minute call'', and ''Best regards, Andi''.'
    steps:
    - 29 words, within the limit of 180
    - The subject line is 31 characters
    - The greeting check reads the very start of the text, which here is the Subject line, so the greeting
      check is not met
    - A sign-off is found
    - Next-step language is found
    result: 4 of 5 checks are met. The greeting check is not met.
    verified: true
    expect:
    - 4
    - 5
    - - - length
        - true
      - - subject_line
        - true
      - - greeting
        - false
      - - sign_off
        - true
      - - next_step_request
        - true
  sources:
  - hp-backend/src/app/services/evaluator/formats.py:structure_checks
  - hp-backend/src/app/services/evaluator/formats.py:FORMATS
  - hp-backend/src/app/services/evaluator/formats.py:_DRAFT_GREETING_RE
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
    quoted in code comments; the document itself is not in the repo or the scratchpad docs, Section 4.5
    format criteria
  confidence: high
- id: me_sources
  parent: null
  name: Four sources with separate authority
  kind: source
  summary: Decides which source may confirm which kind of claim.
  purpose: Decides which source may confirm which kind of claim.
  logic: Your draft shows only where a phrase sits, never a fact. Account data (the executive summary's
    description, name and headquarters, the intent topic names, the opportunity trigger headlines and
    the full technology stack) can confirm facts about the account,
    but never what an HP product can do. Approved HP facts (the approved facts, conditions and qualifiers
    in the HP recommendations, plus HP product family, device type and category names) can confirm what
    an HP product can do, but never anything about the account. Role context gives the role, department
    and seniority, but never what the person thinks. A claim that names an HP product line is checked
    against the HP facts. Any other claim is checked against the account data. Each claim is checked against
    one source only.
  table:
    columns:
    - Source
    - May establish
    - Never establishes
    rows:
    - - Your draft
      - Where a phrase sits in the message
      - Any fact. Writing a claim does not make it true.
    - - Account data
      - Facts about this account
      - What an HP product can do
    - - Approved HP facts
      - What an HP product can do
      - Any fact about this account
    - - Role context
      - The contact's role, department, seniority and remit
      - What the person thinks, wants or has said
  sources:
  - hp-backend/src/app/services/evaluator/sources.py:AUTHORITY
  - hp-backend/src/app/services/evaluator/sources.py:build
  - hp-backend/src/app/services/evaluator/sources.py:_hp_fact_texts
  - hp-backend/src/app/services/evaluator/sources.py:_account_texts
  doc_source: Guardrail 13 'HP decks cannot create account evidence' (quoted in grounding.py)
  confidence: high
- id: me_claim_verdict
  parent: me_sources
  name: Claim verdicts
  kind: guardrail
  summary: How one sentence is judged against its source.
  purpose: How one sentence is judged against its source.
  logic: 'Steps: first, decide which source the claim is checked against. If the account''s country restricts
    superlatives and the claim has one (world''s most, best, first or only; industry-leading; the most,
    best, fastest or safest of something; most secure; unmatched; unrivalled; number one; #1; market-leading;
    best-in-class), that is a reason. If the country restricts competitor claims and a competitor is named
    (lenovo, dell, apple, acer, asus, samsung, microsoft surface, huawei, toshiba, fujitsu, msi, razer),
    that is a reason. Any number or web link that the chosen source does not contain is a reason. An HP
    claim with no approved HP facts to check it against is a reason. Verdict: Restricted if a country rule
    applies;
    otherwise Unsupported if there is any reason; otherwise Supported if something was checked or the
    claim contains a number; otherwise Not checkable.'
  example:
    scenario: 'An Indonesian account. Sentences in the draft: ''HP Wolf Security stops 99% of attacks.'',
      ''Your 4500 staff deserve better.'', "We are the world''s most secure.", ''We help teams.'''
    steps:
    - The HP claim is checked against the HP facts, which have no 99%, so it is Unsupported
    - The account claim's 4500 is in the account data, so it is Supported
    - Superlatives are restricted in Indonesia, so it is Restricted
    - Nothing can be checked, so it is Not checkable
    result: Unsupported, Supported, Restricted, Not checkable
    verified: true
    expect:
    - - unsupported
      - hp_fact_corpus
    - - supported
      - account_corpus
    - - restricted
      - account_corpus
    - - not_checkable
      - account_corpus
  sources:
  - hp-backend/src/app/services/evaluator/sources.py:verify_claim
  - hp-backend/src/app/services/evaluator/sources.py:route
  confidence: high
