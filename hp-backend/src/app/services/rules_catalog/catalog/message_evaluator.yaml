- id: me_phrase_feedback
  parent: null
  name: Phrase-level Keep / Improve / Change
  kind: model
  summary: Feedback tied to the exact words the seller wrote.
  purpose: Feedback tied to the exact words the seller wrote.
  logic: 'The AI cuts the whole message into chunks (Lite: exactly 5; Deep: 10 to 15) and gives each one
    a verdict, a comment and a suggestion. Each chunk is then matched to the draft, ignoring capital letters
    and spacing. Only chunks that match the seller''s own words, do not repeat another chunk and fit within
