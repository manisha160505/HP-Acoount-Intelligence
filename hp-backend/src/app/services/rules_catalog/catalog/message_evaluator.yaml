- id: me_chunk_fidelity
  parent: me_phrase_feedback
  name: Chunks must cover the whole message
  kind: guardrail
  summary: Every sentence must belong to exactly one chunk.
  purpose: Every sentence must belong to exactly one chunk.
  logic: After the chunks are found in the draft, they are read in order. Any text between chunks, or
    after the last one, that is not blank is a fault. Then a final check confirms that the chunks joined
    together equal the message, ignoring spacing. If there is a fault, the AI is asked once more for chunks.
    If the retry also fails, the first result is kept and the faults are recorded.
  example:
    scenario: Only the first two of three sentences were put into chunks.
    steps:
    - The last sentence is not covered by any chunk
    result: 'Fault: the chunks stop before the end of the message.'
    verified: true
    expect:
    - the chunks stop before the end of the message ('Your 4500 staff deserve better.')
  sources:
