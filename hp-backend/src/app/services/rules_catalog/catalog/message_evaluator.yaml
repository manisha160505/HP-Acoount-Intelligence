# Rules page catalog for `message_evaluator`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: message_evaluator
purpose: Scores a seller's own draft (an email, a LinkedIn message or a one-pager) for one of eight buying
  roles, gives feedback on specific phrases, and can rewrite the draft using only the changes the seller
  picks.
final_output: A total score with its band and the formula used; seven scores with a reason for each; format
  checks (met or not met); Keep, Improve or Change marks on the draft; a summary with strengths and weaknesses;
  a simulated role reaction (Deep mode only); and, if asked, a checked rewrite with the changes shown.
how_it_combines: The AI scores the seller's draft on seven qualities for the chosen role. The scores are
  checked and then combined into one total using the weighting set for the chosen objective. Caps apply
  for serious issues (for example, an HP product line this role is never offered caps the Relevance score).
  Format checks, source rules and market restrictions run alongside. Phrase feedback is checked to cover
  the whole message. An optional rewrite applies only the changes the seller selects and is then checked
  against the same content rules as generated content.
