  parent: me_rewrite
  name: Rewrite format check
  kind: guardrail
  summary: A badly formed rewrite is never shown.
  purpose: A badly formed rewrite is never shown.
  logic: 'Only the parts the format uses are read. These are faults: no rewrite at all; a required part
    missing; a number of body sections outside the allowed range; a one-pager section with no heading;
    a subject line over 80 characters; or a finished message (including greeting and sign-off) longer
