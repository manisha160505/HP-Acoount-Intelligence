- id: me_rewrite_gates
  parent: me_rewrite
  name: Content checks on the rewrite
  kind: guardrail
  summary: The version that gets sent must pass the same hard checks as generated content.
  purpose: The version that gets sent must pass the same hard checks as generated content.
  logic: Content Studio's full set of content checks is run on the rewrite for the chosen role. Only serious
    findings that reject the content become faults. These include an HP product line the role is never
    offered. The fact-support check never rejects here, because the account facts, the approved HP facts
    and the seller's own original are all accepted as support. A check for roles with no named contact
    runs when the role is unfilled. The competitor check never fires, because no competitor list is supplied
    here. Findings that only ask for a redo (word count, banned phrases, the ask) do not block the rewrite.
    All findings are recorded for review.
