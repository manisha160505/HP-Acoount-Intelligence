- id: me_reaction_guard
  parent: null
  name: Simulated role reaction (Deep mode only)
  kind: guardrail
  summary: How someone in this role would likely read the message, never a real person's words.
  purpose: How someone in this role would likely read the message, never a real person's words.
  logic: 'The reaction is withheld completely (it is not shown with a warning) if: it names the contact
    (full name, or any part of the name longer than 2 letters); it uses a verb about inner feelings (thinks,
    believes, wants, decided, is worried, prefers, said that, and so on) together with he, she, his or
    her; it contains a double quotation mark; or any sentence with a number, web link, superlative or
    competitor is Unsupported or Restricted. A reaction that is shown is labelled ''Simulated reaction
    - how someone in this role would likely read this message. Not a statement about the real contact.'''
  example:
    scenario: Three reactions for the contact 'Budi Santoso'.
    steps:
    - '''Budi thinks this is too long.'' names the contact'
    - '''Someone in this role would want the cost case first.'' is fine'
    - '''He believes "pricing" matters.'' attributes a belief and contains a quotation'
    result: Withheld, shown, withheld
    verified: true
    expect:
    - - false
      - - names the contact ('Budi'); a reaction is written in role terms
    - - true
      - []
    - - false
      - - attributes 'believes' to the individual; the reaction may describe how a role would read the
          message, not what this person thinks
        - contains a quotation; the contact has not said anything
