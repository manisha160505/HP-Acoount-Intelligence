undetermined:
- The seven dimension scores, their rationales, the chunk verdicts/comments, the summary and the reaction
  are model-judged; Python only validates, caps (severe failures) and combines them. There is no fixed
  formula for any single dimension.
- How the Rulebook positioning and proof points shown to the model affect Brand Recall and Impact is model-judged
  and not checked.
- Deployed model depends on LLM_PROVIDER (default gemini -> gemini-2.5-flash; openai -> gpt-4o).
- 'Observation: the email ''greeting'' structure check only matches a salutation at the very start of
  the text (\A anchor), so a draft that begins with a ''Subject:'' line always reports ''no salutation
  found'' even when ''Dear ...,'' follows (verified in me_structure_checks example).'
- 'Observation: account data passed to the evaluator corpus is only widget-derived text unless dataset_records
  are supplied; the evaluate endpoint does not pass dataset_records (widgets.py:983-990), so raw uploaded
  rows are not in the account corpus for API calls.'
- _personas_from_contacts and _personas_from_hiring remain in message_evaluator.py but are unscheduled;
  only the eight client roles are offered.
