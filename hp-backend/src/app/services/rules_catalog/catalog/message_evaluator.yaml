  confidence: high
- id: me_rewrite_greeting
  parent: me_rewrite
  name: Rewrite greeting and sign-off
  kind: selection
  summary: Added by the system, never written by the AI.
  purpose: Added by the system, never written by the AI.
  logic: 'If the seller''s draft already starts with a greeting, it is kept. Otherwise the greeting is
    ''<Dear or Hi> [<short role> Name],''. The short role is the first part of the title (cut at a slash,
    bracket, comma, semicolon, vertical bar or '' - ''). Rank prefixes such as head of, director of, senior
    and lead are removed, and known titles are shortened (Chief Financial Officer becomes CFO, information
    technology becomes IT). If the result is longer than 4 words, just ''[Name]'' is used. Email sign-off:
    the draft''s own sign-off if it has one, otherwise ''Best regards,'' then a blank line and ''[Your
    Name]''.'
  example:
    scenario: Titles 'Head of information technology project procurement', 'Chief Financial Officer' and
      'VP / Head of Information Technology'.
    steps:
    - Drop 'Head of' and shorten to IT
    - Use the short form
    - Use the first part, 'VP'
    result: IT Project Procurement | CFO | VP
    verified: true
    expect:
    - IT Project Procurement
    - CFO
    - VP
