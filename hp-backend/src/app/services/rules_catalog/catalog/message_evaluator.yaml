- id: me_rewrite
  parent: null
  name: Rewrite with selected recommendations
  kind: selection
  summary: Applies only the changes the seller ticked, in the structure of the chosen format.
  purpose: Applies only the changes the seller ticked, in the structure of the chosen format.
  logic: This runs only when the seller selects at least one recommendation. The AI may not add any number,
    percentage, web link or HP capability that is not in the approved sources. It must drop or soften
    unsupported claims from the original. The role description given to the AI leaves out the instruction
    not to use a name. The greeting and sign-off are added by the system, not written by the AI. If there
    is any fault, the AI gets one retry with the faults listed. If it still fails, the seller keeps the
    original and the faults are recorded. Then the change check runs (see the rewrite change check). A
    fault there also withholds the rewrite.
  table:
    columns:
    - Format
    - Required parts
    - Body sections
    - Limits
    - Greeting / sign-off
    rows:
    - - Email
      - Subject line, opening, body sections, call to action
      - 1-2, no headings
      - Subject at most 80 characters
      - Dear [<role> Name], / 'Best regards,' then a blank line and '[Your Name]'
    - - LinkedIn message
      - Opening, body sections, call to action
      - Exactly 1
      - Whole message at most 300 characters including the greeting
      - Hi [<role> Name], / none
    - - One-pager
      - Headline, opening, body sections, call to action
      - Exactly 4, each with a heading
      - The AI is asked for at most 400 words, but this is not checked
      - None / none
  sources:
  - hp-backend/src/app/services/evaluator/evaluate.py:rewrite_message
  - hp-backend/src/app/services/evaluator/formats.py
  doc_source: HP 220 - Content Studio & Message Evaluator - Build Specification v1.0 (30 Sep 2026), as
