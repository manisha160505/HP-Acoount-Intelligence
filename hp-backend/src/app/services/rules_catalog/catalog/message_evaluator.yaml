- id: me_scoring
  parent: null
  name: Objective-weighted score
  kind: score
  summary: Turns seven AI-scored qualities into one total score.
  purpose: Turns seven AI-scored qualities into one total score.
  logic: The AI scores all seven qualities from 0 to 100 and gives a one-sentence reason for each. It
    scores without seeing the weights or the total, so each score stands on its own. The formula is chosen
    by the objective alone, and the total is the weighted sum, rounded to 1 decimal. A quality with a weight
    of 0 is still shown. A total is shown when every quality in the formula has a valid score.
  formula: Total = the sum of (score for each quality × its weight for the chosen objective), rounded
    to 1 decimal
  table:
    columns:
    - Objective
    - Formula
    - Source of the weights
    rows:
    - - Awareness
      - 30% × Relevance + 20% × Impact + 20% × Brand Recall + 15% × Clarity + 15% × Creativity
      - HP scoring guidance
    - - Engagement
      - 50% × Relevance + 10% × Impact + 20% × Clarity + 10% × Creativity + 10% × Emotional Connection
      - HP scoring guidance
    - - Consideration
      - 40% × Relevance + 10% × Brand Recall + 10% × Clarity + 10% × Emotional Connection + 30% × Next-step
        Strength
      - HP scoring guidance
    - - Conversion
      - 15% × Relevance + 15% × Impact + 25% × Brand Recall + 10% × Clarity + 5% × Emotional Connection
        + 30% × Next-step Strength
      - HP scoring guidance
    - - Advocacy
      - 15% × Relevance + 30% × Brand Recall + 15% × Clarity + 10% × Creativity + 30% × Emotional Connection
      - Product default weighting
  example:
    scenario: 'Scores: Relevance 80, Impact 70, Brand Recall 60, Clarity 90, Creativity 50, Emotional
      Connection 40, Next-step Strength 75.'
    steps:
    - 'Awareness: 80×0.3 + 70×0.2 + 60×0.2 + 90×0.15 + 50×0.15 = 71.0'
    - 'Engagement: 80×0.5 + 70×0.1 + 90×0.2 + 50×0.1 + 40×0.1 = 74.0'
    - 'Consideration: 80×0.4 + 60×0.1 + 90×0.1 + 40×0.1 + 75×0.3 = 73.5'
    - 'Conversion: 80×0.15 + 70×0.15 + 60×0.25 + 90×0.1 + 40×0.05 + 75×0.3 = 71.0'
    - 'Advocacy: 80×0.15 + 60×0.3 + 90×0.15 + 50×0.1 + 40×0.3 = 60.5'
    result: 71.0 / 74.0 / 73.5 / 71.0 / 60.5
    verified: true
    expect:
    - - awareness
      - 71.0
    - - engagement
      - 74.0
    - - consideration
      - 73.5
    - - conversion
      - 71.0
    - - advocacy
      - 60.5
  output: The total score, its band, the formula used and the weights.
  sources:
  - hp-backend/src/app/services/evaluator/scoring.py:OBJECTIVE_FORMULAS
  - hp-backend/src/app/services/evaluator/scoring.py:composite
  doc_source: HP_ABX_v3_final Feature 9 Stage 5 Step 4 (four formulas); Advocacy from the reference application
  confidence: high
