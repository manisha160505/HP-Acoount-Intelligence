- id: summary_description_bullets
  parent: exec_summary_card
  name: Business description as bullets
  kind: model
  summary: Turns a long supplier paragraph into 3-5 easy-to-read bullets without adding anything.
  purpose: Turns a long supplier paragraph into 3-5 easy-to-read bullets without adding anything.
  inputs:
  - 'The company profile: business description'
  logic: If the description has fewer than 40 words it is shown as written. Otherwise AI reorganises it
    into 3-5 bullets, each one sentence of at most 25 words, copying every number exactly and adding no
    judgement or HP implication. The answer is kept only if it has at least 3 bullets (extra bullets beyond
    5 are cut) and every number in it can be found in the account's company profile. If either check fails,
    the original paragraph is shown instead. The bullets are saved and reused until the paragraph changes.
  conditions:
  - 'Below 40 words: AI is not used and the paragraph is shown'
  - 'Fewer than 3 bullets: the paragraph is shown'
  - 'More than 5 bullets: only the first 5 are kept'
  - 'Any number not found in the company profile: all bullets are withheld and the paragraph is shown'
  - The number check looks at everything in the company profile, not only the description paragraph
  constants:
  - label: Minimum words before bullets are made
    ref: py:app.services.extractors.executive_dashboard:DESCRIPTION_POINTS_MIN_WORDS
    stated: 40
  - label: Minimum bullets
    ref: py:app.services.extractors.executive_dashboard:DESCRIPTION_POINTS_MIN
    stated: 3
  - label: Maximum bullets
    ref: py:app.services.extractors.executive_dashboard:DESCRIPTION_POINTS_MAX
    stated: 5
  example:
    scenario: The description is 'Acme makes cement in Indonesia.' (5 words).
    steps:
    - 5 words is below the 40-word threshold, so AI is not used.
    result: No bullets; the paragraph is shown, because the description is 5 words - short enough to read
      as it is.
    verified: true
    expect:
    - []
    - the description is 5 words - short enough to read as it is
  output: Description bullets (or the paragraph)
  sources:
  - hp-backend/src/app/services/extractors/executive_dashboard.py:_description_points
  - hp-backend/src/app/services/extractors/executive_dashboard.py:POINTS_SYSTEM
  doc_source: Client feedback 27 Sep (quoted in code)
  confidence: high
