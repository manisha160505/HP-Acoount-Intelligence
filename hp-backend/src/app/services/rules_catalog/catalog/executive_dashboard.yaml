  name: Strategic Priorities & Catalysts
  kind: selection
  summary: Lists the account's evidenced strategic priorities, each with a short HP-focused explanation,
    its sources and an evidence score.
  purpose: Lists the account's evidenced strategic priorities, each with a short HP-focused explanation,
    its sources and an evidence score.
  inputs:
  - A searchable collection of the account's evidence, built from its filed documents (annual reports
    and filings) and other dashboard evidence (news, technology, research topics, hiring, contacts)
  - Approved HP facts from the technology recommendations and the opportunity map
  - HP customer case studies
  logic: AI only proposes priorities and points to the evidence behind them; every priority is then checked
    against the stored evidence. Priorities without real, on-topic evidence are dropped. The survivors
    (at most 6) are ordered by evidence counts, scored for evidence strength, given an AI-written explanation
    that is checked figure by figure, and optionally a case-study proof point. If no priority survives,
    nothing is shown. Cards are grouped by theme on screen.
  conditions:
  - The account's evidence collection must be built (current or slightly out of date)
  - 'No surviving priorities: nothing is shown'
  - At most 6 priorities are shown
  output: 'Catalyst cards grouped by theme: title, why now, bullets, evidence score, sources with points,
    HP proof point.'
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:generate_dashboard_intelligence
  - hp-frontend/src/app/dashboard/page.tsx
  doc_source: ABX Feature 1 (quoted in code; not in provided set); HP_Recommendation_Tuning_Logic_FINAL_v4
    'Executive Dashboard'
  confidence: high
- id: priority_candidates
  parent: strategic_priorities
  name: Candidate priorities (AI step)
  kind: model
  summary: Finds possible priorities in the retrieved evidence.
  purpose: Finds possible priorities in the retrieved evidence.
  inputs:
  - The 60 most relevant evidence passages (up to 60,000 characters)
  logic: AI is asked for 6 to 8 distinct priorities, each with a short title (at most 8 words), a theme
    from a fixed list, a one-sentence 'why now' without figures, and 2 to 5 references to evidence copied
    from the passages. It must use only the passages provided, never invent a reference, and state no
    numbers. These are only candidates; only the title, theme and 'why now' text of priorities that pass
    the evidence checks is ever shown.
  conditions:
  - 'Themes: AI, workforce productivity, hybrid work, expansion, security, fleet refresh, print/workflow,
    sustainability, cost efficiency, other'
  - The 'why now' sentence is AI text and is not checked for figures
  - A missing theme becomes 'other'
  constants:
  - label: Retrieved passages
    internal: true
    value: 60
  output: Candidate priorities
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_candidate_priorities
  - hp-backend/src/app/services/dashboard/priorities.py:CANDIDATE_SYSTEM
  - hp-backend/src/app/services/dashboard/priorities.py:PRIORITY_QUESTION
  confidence: high
- id: priority_evidence_resolution
  parent: strategic_priorities
  name: Evidence must exist
  kind: selection
  summary: Drops any priority whose cited evidence cannot be found.
  purpose: Drops any priority whose cited evidence cannot be found.
  inputs:
  - Evidence references cited by AI
  - The account's evidence
  logic: Each cited reference is looked up in the account's evidence. References that cannot be found
    are discarded and counted. A priority with fewer than 1 item found is dropped, with the reason 'no
    resolvable account evidence'. The sentence shown to the seller is always the original source sentence,
    never AI's paraphrase.
  constants:
  - label: Minimum evidence per priority
    ref: py:app.services.dashboard.priorities:MIN_EVIDENCE_PER_PRIORITY
    stated: 1
  example:
    scenario: AI cites references X1 and X2; neither exists in the account's evidence.
    steps:
    - Neither can be found.
    result: 'Priority dropped: ''no resolvable account evidence'' (this check needs the stored evidence,
      so it cannot be recomputed here)'
  output: Kept or dropped
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_resolve_priorities
  confidence: high
- id: priority_relevance_gate
  parent: strategic_priorities
  name: Evidence must be about the priority
  kind: guardrail
  summary: Drops evidence that is real but about something else.
  purpose: Drops evidence that is real but about something else.
  inputs:
  - Priority title and theme
  - Evidence source text
  logic: The priority's content words (3+ letters, common words removed) are shortened to their first
    6 letters; an evidence item supports the priority if its text contains any of those word starts. Items
    that don't are removed; if none remain the priority is dropped ('cited evidence does not mention this
    priority's subject').
  example:
    scenario: Priority 'Strengthen sustainability initiatives'; source A 'We are investing in sustainable
      manufacturing.'; source B 'Profit optimisation in Document Solutions.'
    steps:
    - The word start 'sustai' is found in A.
    - No word start is found in B.
    result: A supports the priority (true), B does not (false)
    verified: true
    expect:
    - true
    - false
  output: Relevant evidence
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_supports
  - hp-backend/src/app/services/dashboard/priorities.py:_content_words
  confidence: high
- id: priority_dedup
  parent: strategic_priorities
  name: Near-duplicate priorities merged
  kind: filter
  summary: Avoids showing the same priority twice.
  purpose: Avoids showing the same priority twice.
  inputs:
  - Priority titles
  logic: Titles are compared by shared content words (shared words divided by all distinct words). At
    0.6 or more, the later priority is dropped in favour of the earlier one. Priorities sharing only a
    theme are kept (a theme can hold several catalysts).
  formula: similarity = words in both titles / words in either title; merge if 0.6 or more
  example:
    scenario: '''Expand data centre capacity'', ''Expand data centre capacity in Indonesia'', ''Scale
      AI across operations''.'
    steps:
    - First two share 4 of 5 words = 0.8 -> merged
    - Third unrelated
    result: 'Kept: ''Expand data centre capacity'', ''Scale AI across operations'''
    verified: true
    expect:
    - Expand data centre capacity
    - Scale AI across operations
  output: Kept priorities and the merged list
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_distinct
  confidence: high
- id: priority_news_fallback
  parent: strategic_priorities
  name: News fallback when fewer than 3
  kind: source
  summary: Uses recent events only when filings support too few priorities.
  purpose: Uses recent events only when filings support too few priorities.
  inputs:
  - The 40 most relevant passages answering a question about recent events
  logic: If fewer than 3 priorities survive, AI is asked a second question about recent events, and its
    candidates go through the same evidence checks. New ones (title not already present) are added, marked
    as drawn from recent events, and the merge step runs again.
  constants:
  - label: Minimum priorities target
    ref: py:app.services.dashboard.priorities:MIN_PRIORITIES
    stated: 3
  output: Flag that a priority came from recent events, plus a note
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_news_priorities
  - hp-backend/src/app/services/dashboard/priorities.py:generate_dashboard_intelligence
  confidence: high
- id: priority_ordering
  parent: strategic_priorities
  name: Order and limit
  kind: filter
  summary: Shows the most-evidenced priorities first.
  purpose: Shows the most-evidenced priorities first.
  inputs:
  - 'Per priority: supporting sentences, distinct document sections, most recent date'
  logic: Priorities are sorted by the number of supporting source sentences (high first), then the number
    of distinct document sections (a document, or a page within it), then the most recent supporting date
    (newest first). Only the first 6 are kept. The evidence-strength score does not affect the order.
    On screen, cards are grouped by theme in the order their first priority appears.
  constants:
  - label: Maximum priorities
    ref: py:app.services.dashboard.priorities:MAX_PRIORITIES
    stated: 6
  output: Ordered priorities with their measures
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_resolve_priorities
  - hp-backend/src/app/services/dashboard/priorities.py:_section
  - hp-backend/src/app/services/dashboard/priorities.py:_recency
  - hp-frontend/src/app/dashboard/page.tsx
  confidence: high
- id: evidence_strength
  parent: strategic_priorities
  name: Evidence Strength score (per catalyst, 0-100)
  kind: score
  summary: How well evidenced each catalyst is.
  purpose: How well evidenced each catalyst is.
  inputs:
  - The catalyst's supporting sources (filing label, period, link, publisher, origin)
  - The account's website
  logic: 'Sum of three terms: Filing evidence (max 25), Recency (max 25) and Source diversity (max 50).
    Age is measured to the date the card was generated, so the score does not drift. If all three terms
    are 0, a reason is stored and the card shows ''No signal observed'' instead of 0/100.'
  formula: Evidence Strength = Filing evidence + Recency + Source diversity
  constants:
  - label: Maximum score
    ref: py:app.services.dashboard.evidence_strength:MAX_SCORE
    stated: 100
  example:
    scenario: 'Scored 5 Oct 2026, account domain acme.com: two sources from Annual Report 2025 (FY2025),
      one from Q2 2026 report (2026-Jun), a Reuters article (20 Aug 2026), a Google News link from Jakarta
      Post, and a page on acme.co.id.'
    steps:
    - 'Filings: 2 distinct documents x 5 = 10'
    - 'Recency: newest 20 Aug 2026 is 1 month old -> 25'
    - 'Diversity: Regulatory Filings, Official Company Sources (acme.co.id), Independent Media (Reuters,
      Jakarta Post) = 3 x 10 = 30'
    result: 65/100
    verified: true
    expect: 65
  output: Evidence Strength score with its three terms, and the reason if it is zero
  sources:
  - hp-backend/src/app/services/dashboard/evidence_strength.py:score
  - hp-backend/src/app/services/dashboard/priorities.py:generate_dashboard_intelligence
  - hp-frontend/src/app/dashboard/page.tsx
  doc_source: Formula supplied in writing by the client with two worked examples (65 and 55); source document
    not in provided set
  confidence: high
- id: es_filing
  parent: evidence_strength
  name: Filing evidence (25 points)
  kind: score
  summary: Credits support from filed documents.
  purpose: Credits support from filed documents.
  inputs:
  - Filing labels of the sources
  logic: 5 points per distinct filing document (many sentences from one report count once), capped at
    25.
  formula: 5 x distinct filings, up to a maximum of 25
  constants:
  - label: Points per filing
    ref: scoring:evidence_strength.points_per_filing
    stated: 5
  - label: Maximum
    ref: scoring:evidence_strength.max_filing_points
    stated: 25
  example:
    scenario: Two sentences from Annual Report 2025 and one from Q2 2026 report.
    steps:
    - 2 distinct filings x 5
    result: '10'
    verified: true
    expect: 10
  output: 0-25 points
  sources:
  - hp-backend/src/app/services/dashboard/evidence_strength.py:filing_evidence
  confidence: high
- id: es_recency
  parent: evidence_strength
  name: Recency (25 points)
  kind: score
  summary: Credits recent evidence.
  purpose: Credits recent evidence.
  inputs:
  - Period labels of the sources
  logic: 'The most recent dated source sets the age, in whole calendar months to the generation date (never
    negative). Period labels: an ISO date; ''YYYY-Mon'' taken at month end; ''FY2025'', ''2025'' or ''FY2025/26''
    taken at 31 December of the first year. Other shapes (for example ''Q3 2025'') count as undated. No
    dated source: 0.'
  table:
    columns:
    - Age of newest evidence
    - Points
    rows:
    - - 0-12 months
      - 25
    - - 13-24 months
      - 20
    - - 25-36 months
      - 15
    - - 37-60 months
      - 10
    - - over 60 months
      - 5
    - - no usable date
      - 0
  constants:
  - label: Bands (upper months, points)
    ref: scoring:evidence_strength.recency_bands
    stated:
    - - 12
      - 25
    - - 24
      - 20
    - - 36
      - 15
    - - 60
      - 10
  - label: Beyond bands
    ref: scoring:evidence_strength.recency_beyond_bands
    stated: 5
  - label: No date
    ref: scoring:evidence_strength.recency_no_date
    stated: 0
  - label: Fiscal year end
    ref: py:app.services.dashboard.evidence_strength:FISCAL_YEAR_END
  example:
    scenario: 'Scored 5 Oct 2026, single-source periods: 2026-09-01, 2025-Sep, FY2024, FY2022, FY2020,
      2019-01-01, ''Q3 2025''.'
    steps:
    - Ages 1, 12, 21, 45, 69, 93 months; 'Q3 2025' unparsed
    result: 25, 25, 20, 10, 5, 5, 0
    verified: true
    expect:
    - 25
    - 25
    - 20
    - 10
    - 5
    - 5
    - 0
  output: 0-25 points
  sources:
  - hp-backend/src/app/services/dashboard/evidence_strength.py:recency
  - hp-backend/src/app/services/dashboard/evidence_strength.py:parse_period
  - hp-backend/src/app/services/dashboard/evidence_strength.py:months_between
  confidence: high
- id: es_diversity
  parent: evidence_strength
  name: Source diversity (50 points)
  kind: score
  summary: Credits evidence from different kinds of source.
  purpose: Credits evidence from different kinds of source.
  inputs:
  - Each source's origin, filing label, link and publisher
  logic: 'Each source gets one category, decided in this order: a regulatory filing (or anything with
    a filing label) is Regulatory Filings; then by the website of its link (ignoring news.google.com,
    google.com, bing.com and finance.yahoo.com): a listed stock-exchange or regulator website is Regulatory
    Filings; a government website is Government Sources; the account''s own website (or the same company
    name of 4+ letters under another country''s website) is Investor Materials if the address contains
    ''investor'' or ''ir'', otherwise Official Company Sources; LinkedIn, Facebook, Twitter/X, Instagram
    or YouTube is uncategorised; if the account''s website is not known, uncategorised; any other website
    is Independent Media. Without a usable link, a named publisher is Independent Media (Official Company
    Sources if it equals the company name). Anything else is uncategorised. Each distinct category scores
    10 points, up to a maximum of 50.'
  formula: 10 x distinct categories, up to a maximum of 50
  conditions:
  - 'Regulator websites: idx.co.id, sec.gov, sgx.com, bursamalaysia.com, set.or.th, hkex.com.hk, bseindia.com,
    nseindia.com, asx.com.au, jpx.co.jp, edinet-fsa.go.jp, londonstockexchange.com, bundesanzeiger.de,
    twse.com.tw, krx.co.kr, psx.com.pk, pse.com.ph, hose.vn'
  - 'Government: the website ends .gov, .go.id, .go.jp, .go.kr, .govt.nz, or has ''gov'', ''govt'' or
    ''go'' in its last two parts'
  - Regulators that are not listed fall into Independent Media
  constants:
  - label: Points per category
    ref: scoring:evidence_strength.points_per_category
    stated: 10
  - label: Maximum
    ref: scoring:evidence_strength.max_diversity_points
    stated: 50
  example:
    scenario: Account astra.co.id; links idx.co.id, gov.uk, ir.astra.co.id, careers.astra.com, linkedin.com,
      a Google News link from Kompas, publisher 'Astra' with no link, and an empty source.
    steps:
    - Categorise each source.
    result: Regulatory Filings, Government Sources, Investor Materials, Official Company Sources, uncategorised,
      Independent Media, Official Company Sources, uncategorised
    verified: true
    expect:
    - Regulatory Filings
    - Government Sources
    - Investor Materials
    - Official Company Sources
    - uncategorised
    - Independent Media
    - Official Company Sources
    - uncategorised
  output: 0-50 points
  sources:
  - hp-backend/src/app/services/dashboard/evidence_strength.py:categorise
  - hp-backend/src/app/services/dashboard/evidence_strength.py:diversity
  confidence: high
- id: catalyst_description
  parent: strategic_priorities
  name: Catalyst explanation bullets (AI step, checked)
  kind: model
  summary: Explains what the account is doing and what it means for HP.
  purpose: Explains what the account is doing and what it means for HP.
  inputs:
  - The priority's supporting source text (up to 4,000 characters)
  - Approved HP capability statements (up to 40)
  - Company name, title and theme
  logic: 'AI writes 2-4 bullets (each one sentence, at most 30 words, 60-110 words in total): first what
    the account is doing, from the evidence only; last what it implies for HP, from the approved HP statements
    only. The answer is rejected if it is empty, longer than 110 words, opens with ''The account'', ''The
    company'', ''This account'' or ''This company'', contains any figure not found in the evidence or
    HP statements, names an ''HP <Product>'' that is not in the approved statements, or has fewer than
    2 or more than 4 bullets. A valid answer under 60 words is rewritten once and the longer valid answer
    is kept; if it is still short it is shown but marked ''below brief''. A rejected answer is replaced
    by a fixed sentence: ''<title> is evidenced by N source sentence(s) across M section(s) of the account''s
    filed documents.'''
  conditions:
  - Maximum 110 words (firm)
  - Minimum 60 words (one rewrite, then shown anyway)
  - 2-4 bullets
  - Every figure must appear in the evidence or HP facts
  - HP product names only from approved facts
  - 'Also asked for, but not checked: no competitors, no claim that the account uses HP, English only,
    plain hyphens'
  constants:
  - label: Min words
    ref: py:app.services.dashboard.priorities:DESCRIPTION_MIN_WORDS
    stated: 60
  - label: Max words
    ref: py:app.services.dashboard.priorities:DESCRIPTION_MAX_WORDS
    stated: 110
  - label: Min bullets
    ref: py:app.services.dashboard.priorities:DESCRIPTION_MIN_POINTS
    stated: 2
  - label: Max bullets
    ref: py:app.services.dashboard.priorities:DESCRIPTION_MAX_POINTS
    stated: 4
  example:
    scenario: 'Evidence: ''Acme plans a 30 MW data centre in Batam''; HP facts: ''HP Z Workstations: for
      AI''. Four candidate answers.'
    steps:
    - '''... 40 MW ...'' -> rejected: 40 is not in the evidence'
    - '''... HP Poly devices ...'' -> rejected: HP Poly is not approved'
    - '''The company is building ...'' -> rejected: stock opening'
    - '''Acme is building a 30 MW data centre in Batam. HP Z Workstations fit this.'' -> passes'
    result: Only the last passes the checks
    verified: true
    expect:
    - - false
      - states 40, which is not in the evidence
    - - false
      - names HP Poly, which is not in the approved facts
    - - false
      - opens with a stock phrase instead of the specific fact
    - - true
      - ok
  output: Explanation text and bullets, who wrote it (AI or a fixed sentence), and the reason for any
    rejection
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_describe
  - hp-backend/src/app/services/dashboard/priorities.py:_validate_description
  - hp-backend/src/app/services/dashboard/priorities.py:DESCRIPTION_SYSTEM
  doc_source: HP_Recommendation_Tuning_Logic_FINAL_v4, Executive Dashboard (length and content); client
    feedback 27 Sep (bullets)
  confidence: high
