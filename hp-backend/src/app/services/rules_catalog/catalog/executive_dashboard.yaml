- id: filings_on_record
  parent: exec_key_metrics
  name: Filings on record (last 12 months)
  kind: selection
  summary: Lists the account's filed documents from the agreed filings list.
  purpose: Lists the account's filed documents from the agreed filings list.
  inputs:
  - The company's list of filings (annual reports and regulatory filings), uploaded with the documents
  logic: 'Each filing is shown with a link: the document link if present, otherwise the link to the page
    it was found on (never a local file). Its date is the publication date, otherwise the period-end date.
    A filing is left out (and counted) if it has no link, no readable date, a date outside the last 365
    days up to tomorrow, or the same link as one already listed (ignoring http/https, www and a trailing
    slash). The rest are listed newest first.'
  conditions:
  - 'No link: left out (''no link'')'
  - 'No date: left out (''undated'')'
  - 'Filed more than 365 days ago or more than 1 day ahead: left out (''outside the window'')'
  - 'Same link as one already listed: left out (''duplicate'')'
  - The window is measured from the day the card is generated
  - '''Document on file'' is true when the document has been downloaded successfully or generated from
    text'
  - 'Accepted dates: ISO format, YYYY/MM/DD, DD/MM/YYYY (day first), Unix seconds, and forms like ''May
    12, 2026''; anything else is undated'
  constants:
  - label: Window (days)
    ref: py:app.services.dashboard.filings_register:WINDOW_DAYS
    stated: 365
  example:
    scenario: 'Six rows, generated on 5 Oct 2026: Annual Report 2025 (20 Mar 2026, document link), a copy
      of it (21 Mar 2026, same link via the source page with www), Annual Report 2023 (Mar 2024), a notice
      with no date, a half-year report with no link, and an 8-K filing dated 1 Sep 2025 (given as a Unix
      timestamp).'
    steps:
    - 'Copy: same link after tidying, so a duplicate.'
    - 'The 2023 report and the 8-K (1 Sep 2025) fall before 5 Oct 2025: outside the window.'
    - 'Notice: undated.'
    - 'Half-year report: no link.'
    result: '1 of 6 listed (Annual Report 2025); left out: no link 1, outside the window 2, undated 1,
      duplicate 1.'
    verified: true
    expect:
    - 1
    - 6
    - no_url: 1
      outside_window: 2
      undated: 1
      duplicate: 1
    - - Annual Report 2025
  output: The list of filings on record (stored with the card; not shown as a tile on the dashboard page,
    but used by other parts of the app)
  sources:
  - hp-backend/src/app/services/dashboard/filings_register.py:register
  - hp-backend/src/app/services/dashboard/filings_register.py:_entry
  - hp-backend/src/app/services/dashboard/filings_register.py:_date
  doc_source: 'Client answers opens_1 #10, opens_2 #11/#13, 18 Sep link rule (quoted in code)'
  confidence: high
- id: reported_financials
  parent: exec_key_metrics
  name: Filed financial figures (revenue, net income, employees)
  kind: source
  summary: Shows the latest whole-company figures the company reported, with growth, from figures read
    and checked against its filings.
  purpose: Shows the latest whole-company figures the company reported, with growth, from figures read
    and checked against its filings.
  inputs:
  - 'Figures read from each filing document: period, values, page and verification checks'
  logic: 'The figures are read from the filing documents in advance (AI reads them and each figure is
    checked against its page). The choice of what to show is rule-based: for each of Revenue, Net income
    and Employees, the newest usable full-year figure is picked. For Revenue and Net income, a newer interim
    figure (quarter, half-year, nine months) is also shown when it is newer than the last full year or
    when there is no full year. Cards appear in the order Revenue, Net income, Employees.'
  conditions:
  - Only figures that pass the usability check are used (see sub-rule)
  - 'Nothing usable: no filed-figure cards (if no checked figures exist for the account, the figures collected
    for strategic priorities are used instead; see source precedence)'
  constants:
  - label: Full-year period types
    ref: py:app.services.dashboard.filings_financials:ANNUAL
    stated:
    - FY
  - label: Interim period types
    ref: py:app.services.dashboard.filings_financials:INTERIM
    stated:
    - Q1
    - Q2
    - Q3
    - 1H
    - 9M
  - label: Metrics with interim cards
    ref: py:app.services.dashboard.filings_financials:INTERIM_METRICS
    stated:
    - revenue
    - net_income
  example:
    scenario: Acme has FY2025 (revenue 1,200 m USD verified with prior-year 1,000; net income 90 unverified;
      employees 5,200 verified), FY2024 (revenue 1,000; net income 80 verified) and 1H 2026 (revenue 700
      vs 600 a year earlier).
    steps:
    - Revenue FY2025 = USD 1,200 million, +20.0% from its own comparative.
    - 'Revenue 1H 2026 is newer than FY2025 so it gets its own card: USD 700 million, +16.7% vs the same
      half a year earlier.'
    - Net income in FY2025 is not verified, so FY2024 (USD 80 million) is shown with a note that the latest
      filing does not state it.
    - Employees FY2025 = 5,200.
    result: 'Cards: Revenue FY2025 USD 1,200 million +20.0%; Revenue (1H) 2026-1H USD 700 million +16.7%;
      Net income FY2024 USD 80 million (fallback); Employees FY2025 5,200 employees.'
    verified: true
    expect:
    - - Revenue
      - USD 1,200 million
      - FY2025
      - +20.0%
    - - Revenue (1H)
      - USD 700 million
      - 2026-1H
      - +16.7%
    - - Net income
      - USD 80 million
      - FY2024
      - null
    - - Employees
      - 5,200 employees
      - FY2025
      - null
  output: Filed-figure cards
  sources:
  - hp-backend/src/app/services/dashboard/filings_financials.py:reported_metrics
  doc_source: HP_ABX_v3_final Feature 1 (quoted in code; document not in provided set)
  confidence: high
- id: financials_usable
  parent: reported_financials
  name: When a filed figure may be used
  kind: guardrail
  summary: Prevents unverified, segment-only or undated figures from being shown as company totals.
  purpose: Prevents unverified, segment-only or undated figures from being shown as company totals.
  inputs:
  - 'For each figure: its verification check, value, scope, whether the filing is the account''s own company,
    and the period end date'
  logic: A figure is usable only if its check is 'verified', its value is a number, its scope is 'consolidated'
    or 'standalone only', the filing's company match is 'same', 'different' or 'unknown', and the period
    end is a valid date. Segment-only and parent-only figures are never used.
  conditions:
  - Scope must be consolidated or standalone only
  - The check must be 'verified'
  constants:
  - label: Accepted scopes
    ref: py:app.services.dashboard.filings_financials:GROUP_SCOPES
    stated:
    - consolidated
    - standalone_only
  example:
    scenario: FY2025 net income 90 with check 'unverified'.
    steps:
    - Check is not 'verified'.
    result: Not usable; the card falls back to an older verified year.
    verified: true
    expect: false
  output: Usable or not usable
  sources:
  - hp-backend/src/app/services/dashboard/filings_financials.py:_usable
  confidence: high
- id: financials_selection_fallback
  parent: reported_financials
  name: Which filing's figure is shown, and fallback
  kind: selection
  summary: Shows the latest verified figure and says when an older filing had to be used.
  purpose: Shows the latest verified figure and says when an older filing had to be used.
  inputs:
  - Figures from filings of one period type (full-year or interim)
  logic: Among filings of the right type, usable figures more than 2 years (2 x 366 days) older than the
    newest filing of that type are discarded. Figures from the account's own company ('same') win; if
    there are none, figures from a filing that does not name its company ('unknown'); if neither, another
    company's figures. The newest by period end (then publication date) is shown. If the newest filing
    of that type does not state the figure, the last filing that does is used and a note records that
    the latest filing does not state it (the note is kept but not shown to the client).
  conditions:
  - Fallback is limited to 2 years behind the newest filing of that type
  - The account's own company beats a newer filing of another company
  constants:
  - label: Maximum fallback age (years)
    ref: py:app.services.dashboard.filings_financials:MAX_FALLBACK_YEARS
    stated: 2
  output: Chosen figure per metric
  sources:
  - hp-backend/src/app/services/dashboard/filings_financials.py:_choose
  - hp-backend/src/app/services/dashboard/filings_financials.py:_card
  - hp-frontend/src/app/dashboard/page.tsx
  confidence: high
- id: financials_growth
  parent: reported_financials
  name: Period-on-period change
  kind: score
  summary: Shows growth only when two comparable figures exist.
  purpose: Shows growth only when two comparable figures exist.
  inputs:
  - The chosen figure, its own prior-period value, or another filing's figure
  logic: Growth is taken first from the same filing's own comparison figure, when that figure is non-zero
    and its period end is a year earlier (within 20 days). Otherwise another filing is used whose period
    end is a year earlier (within 20 days), from the same company (names compared allowing legal suffixes
    and spelling variants) and in the same currency. Values are converted to the same scale (thousand,
    million, billion, lakh, crore and so on) before comparing. A quarter is only compared with the same
    quarter. If no comparable figure exists, no change is shown.
  formula: change % = (current - previous) / previous (ignoring its sign) x 100, shown with one decimal
    and a sign
  conditions:
  - The two periods must be a year apart, with a tolerance of 20 days
  - Same currency and same company required when comparing across filings
  - Interim figures are compared only with the same period type
  constants:
  - label: Year-apart tolerance (days)
    ref: py:app.services.dashboard.filings_financials:YEAR_TOLERANCE_DAYS
    stated: 20
  example:
    scenario: FY2025 revenue USD 1,200 million; the same filing reports FY2024 revenue 1,000.
    steps:
    - (1,200 - 1,000) / 1,000 x 100 = 20.0
    result: +20.0% (up)
    verified: true
    expect: +20.0%
  output: Change text, direction and the basis of the comparison
  sources:
  - hp-backend/src/app/services/dashboard/filings_financials.py:_change
  - hp-backend/src/app/services/dashboard/filings_financials.py:_year_apart
  confidence: high
- id: financials_series_display
  parent: reported_financials
  name: History series and number formatting
  kind: display
  summary: Gives up to five years of history and readable amounts.
  purpose: Gives up to five years of history and readable amounts.
  inputs:
  - Figures from filings of the same company and currency
