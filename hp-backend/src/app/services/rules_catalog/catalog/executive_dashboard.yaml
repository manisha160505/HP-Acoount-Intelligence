  - hp-frontend/src/app/dashboard/page.tsx
  confidence: high
undetermined:
- Strategic priority content (titles, themes, 'why now', which evidence is retrieved) is model-judged;
  there is no fixed formula. Only the checks applied afterwards are deterministic.
- Evidence resolution, retrieval and index status need the database and search index, so priority_evidence_resolution,
  priority_candidates and priority_news_fallback have no recomputable example.
- 'Case-study allocation ranking (cs.allocate: industry, outcome, tier, use-case signals) is only summarised;
  its full ranking rules belong to the case-studies module and were not traced line by line.'
- How filings_financials.csv values are extracted and verified (scripts/filings_to_csv.py, model + Python
  page check) is upstream of this feature and was not traced.
- The Evidence Strength formula's client source document is not among the provided docs; only the code's
  account of it (and two worked examples pinned in tests/test_evidence_strength.py) was available, so
  no doc comparison was possible.
- HP Category Intent parsing (_parse_category_file in intent_demand_signals.py) decides category names/scores
  fed to Driver 4 and the Workstations score; it belongs to the Intent feature and was not re-verified
  here.
