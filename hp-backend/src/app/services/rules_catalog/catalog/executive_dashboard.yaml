  - The company's social-media workforce figures
  - The company's job postings
  - Recent news coverage and company events
  logic: Each of the four drivers is scored out of 100 (limited to 0-100). Each driver's contribution
    is its score times its weight, rounded to 2 decimals (halves round up); the exact score is the sum
    of the four contributions (2 decimals), and the headline score is that sum rounded to a whole number
    (halves round up). The score is shown only when at least 60% of the weighted inputs are present (see
    the 60% coverage gate). AI is not used anywhere in this score.
