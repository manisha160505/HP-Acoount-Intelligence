- id: growth_workforce
  parent: driver_growth_expansion
  name: Workforce growth proxy (25 points)
  kind: score
  summary: Growth in LinkedIn associated members as a headcount proxy.
  purpose: Growth in LinkedIn associated members as a headcount proxy.
  inputs:
  - Dated counts of associated members on the company's social-media profile
  logic: Needs at least two dated observations. Growth is measured between the earliest and the latest
    observation on file, whatever the time between them. Zero, negative or growth under 1% scores 0. Fewer
    than two observations scores 0 and is marked missing.
  formula: Growth % = (latest - earliest) / earliest x 100
  table:
    columns:
    - Growth
    - Points
    rows:
    - - 20% or more
      - 25
    - - 10% to under 20%
      - 20
    - - 5% to under 10%
      - 15
    - - 1% to under 5%
      - 7.5
    - - under 1%, zero or negative
      - 0
    - - fewer than 2 observations
      - 0
  constants:
  - label: Bands
    ref: scoring:urgency.growth_bands
    stated:
    - - 20.0
      - 25
    - - 10.0
      - 20
    - - 5.0
      - 15
    - - 1.0
      - 7.5
  - label: Maximum
    ref: py:app.services.dashboard.urgency:GROWTH_MAX
    stated: 25
  example:
    scenario: 'Astra: 14,217 on 31 Jul 2025 and 16,781 on 30 Jun 2026.'
    steps:
    - (16,781 - 14,217) / 14,217 = 18.0%
    result: 20/25
    verified: true
    expect: 20.0
  output: 0-25 points
  sources:
