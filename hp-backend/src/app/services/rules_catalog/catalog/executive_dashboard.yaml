- id: summary_parent_company
  parent: exec_summary_card
  name: Parent company
  kind: selection
  summary: Shows the parent company named in the corporate structure information, unless it is the account
    itself.
  purpose: Shows the parent company named in the corporate structure information, unless it is the account
    itself.
  inputs:
  - 'The corporate structure information: ultimate parent name (column E) and id, parent company name
    (column C), the company''s own id'
  - The account's name
  logic: 'The parent is the ultimate parent name (column E), exactly as supplied with spaces trimmed. It
    is skipped when it is the account itself: its id is the company''s own id, or it is the account''s
    own name (''canon'' for Canon Inc.; ''mitsubishi'' for Mitsubishi Motors). When column E gives no
    other company, the parent company name (column C) is used under the same test. A parent held for
    client review because the source names the wrong company is not shown. With neither, nothing is
    shown. The parent is never looked for in the business description.'
  conditions:
  - 'Column E first; column C only when column E names no other company'
  - 'Blank, the account itself, or held for review: not shown'
  - 9 accounts' parents are held (e.g. MUFG -> US Bancorp, Shiseido -> Henkel); a corrected value in a
    later file is shown
  example:
    scenario: 'Four accounts: BDO with column E ''sm investments''; San Miguel whose column E is San Miguel
      itself and column C ''top frontier investment holdings''; Canon whose column E is ''canon''; MUFG
      whose column E is ''us bancorp''.'
    steps:
    - 'BDO: column E names another company, shown.'
    - 'San Miguel: column E is the account itself, so column C is used.'
    - 'Canon: column E is its own name, nothing shown.'
    - 'MUFG: held for client review, nothing shown.'
    result: '''sm investments'', ''top frontier investment holdings'', nothing, nothing.'
    verified: true
    expect:
    - sm investments
    - top frontier investment holdings
    - ''
    - ''
  output: Parent company (hidden on screen when blank)
