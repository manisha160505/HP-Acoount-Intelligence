- id: hp_proof_point
  parent: strategic_priorities
  name: HP case-study proof point
  kind: selection
  summary: Adds a published customer story only for an HP offering the explanation already names.
  purpose: Adds a published customer story only for an HP offering the explanation already names.
  inputs:
  - The finished explanation text
  - HP case studies
  - Industry
  - Proof points already used elsewhere
  logic: HP product lines named in the explanation are matched to case-study product lines. If none is
    named, there is no proof point. Otherwise the best case study is chosen by industry and use-case signals
    from the priority's title and theme; a study already used on another Executive Dashboard card is never
    repeated (no proof point instead), and studies used in the sections ranked above this one (Objections,
    Opportunities, Messaging, Content) are avoided where possible.
  conditions:
  - A proof point can only follow an HP offering named in the text; it never creates the need
  - 'Firm rule: no repeats within the dashboard'
  - 'Soft rule: avoid studies cited in higher-ranked sections'
  output: HP proof point and its details
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:_proof_for
  - hp-backend/src/app/services/hp/case_studies.py:SURFACE_ORDER
  confidence: medium
- id: claim_points
  parent: strategic_priorities
  name: Supporting claims shown as short points
  kind: selection
  summary: Shows each source as short points in the source's own words.
  purpose: Shows each source as short points in the source's own words.
  inputs:
  - Source text
  - Priority title and theme words
  logic: 'Short sources become one point: the sentence mentioning the most words from the priority (the
    earliest wins ties), trimmed at a natural break to about 18 words, ending in a full stop. Sources
    of 60+ words with at least 3 sentences become 3-6 points: sentences mentioning the priority first
    (up to 6), topped up with the next sentences to reach 3, kept in source order; points under 4 words
    or repeated are dropped. Nothing is paraphrased; the full source text stays beside the points.'
  constants:
  - label: Point length (words)
    ref: py:app.services.dashboard.priorities:CLAIM_POINT_MAX_WORDS
    stated: 18
  - label: Long source threshold (words)
    ref: py:app.services.dashboard.priorities:LONG_SOURCE_WORDS
    stated: 60
  - label: Points for a long source
    value: 3-6
  example:
    scenario: Priority 'Expand data centre capacity'; source of three sentences, the second about expanding
      data centre capacity in Batam.
    steps:
    - The second sentence mentions the most priority words (data, centre, capacity, expand) and is chosen.
    - It is 24 words, over the 18-word target. The only break inside the limit (before ', which') would
      leave the opening 'In 2025, the ...' reading as an unfinished aside, so that cut is refused; no
      other break fits.
    - With no safe break, the sentence is kept whole rather than cut mid-phrase.
    result: '''In 2025, the Company expanded its data centre capacity in Batam to support cloud customers,
      which required new cooling systems and additional power.'''
    verified: true
    expect: In 2025, the Company expanded its data centre capacity in Batam to support cloud customers,
      which required new cooling systems and additional power.
  output: Short points per source
  sources:
  - hp-backend/src/app/services/dashboard/priorities.py:claim_point
  - hp-backend/src/app/services/dashboard/priorities.py:claim_points
  doc_source: Client feedback 1 Oct (quoted in code)
  confidence: medium
