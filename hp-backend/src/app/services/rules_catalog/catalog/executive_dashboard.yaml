      Salesforce; Workstations intent 26; news: ''Acme opens AI centre of excellence in Jakarta'' twice
      (10-11 Jun 2026) and ''Acme upgrades ERP system''. Scored 5 Oct 2026.'
    steps:
    - 'Breadth: AI and ML families = 2 -> 21'
    - 'Depth: 3 AI topics (HTML5 does not match ''ml'' as a whole word) + TensorFlow = 4 items -> 7'
    - 'Workstation: 26/100 x 15 = 3.9'
    - 'AI events: identical headline counted once, ERP not AI -> 1 x 5 = 5'
    result: 21 + 7 + 3.9 + 5 = 36.9/100
    verified: true
    expect: 36.9
  output: Driver value 0-100
