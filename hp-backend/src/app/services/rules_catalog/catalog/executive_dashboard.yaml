  name: OS environment (40 points)
  kind: score
  summary: Mixed Linux and Windows estates score highest.
  purpose: Mixed Linux and Windows estates score highest.
  inputs:
  - Technology names (installed technology and website technology)
  logic: All technology names are joined into one text, ignoring capital letters, and searched for operating-system
    family words. This is a plain text search, so a word can match inside a longer word. The highest applicable
    combination below wins.
  conditions:
  - 'Windows: windows, microsoft windows'
  - 'Apple: macos, mac os, osx, os x, ios, ipados, apple ios (iOS counts as Apple)'
  - 'Linux: linux, centos, ubuntu, red hat, redhat, debian, suse, fedora'
  - 'Other: chromeos, chrome os, unix, android, solaris, aix'
  - 'Plain text search: for example ''Adobe Creative Studios'' contains ''ios'' and is detected as Apple'
  table:
    columns:
    - Detected OS families
    - Points
    rows:
    - - Linux + Windows
      - 40
    - - Linux + Apple
      - 35
    - - Linux + Other
      - 35
    - - Windows + Apple
      - 30
    - - Windows + Other
      - 30
    - - Apple + Other
      - 20
    - - Linux only
      - 30
    - - Windows only
      - 25
    - - Apple only
      - 15
    - - Other only
      - 10
    - - None
      - 0
  constants:
  - label: Maximum
    ref: scoring:urgency.os_environment_max
    stated: 40
  - label: Points by combination
    ref: py:app.services.dashboard.urgency:OS_COMBINATION_POINTS
  - label: Words that identify each OS family
    ref: py:app.services.dashboard.urgency:OS_FAMILIES
  example:
    scenario: 'Astra: Linux, Microsoft Windows OS, Apple iOS.'
    steps:
    - 'Families: linux, windows, apple'
    - Linux+Windows 40 beats Linux+Apple 35 and Windows+Apple 30
    result: 40/40
    verified: true
    expect: 40.0
  output: 0-40 points
  sources:
  - hp-backend/src/app/services/dashboard/urgency.py:workplace_os
  doc_source: HP_Urgency_Score_Updated_Final (client) 1B
  confidence: high
- id: wos_footprint
  parent: driver_workplace_os
  name: Workplace technology footprint (30 points)
  kind: score
  uses:
  - workplace_technologies
  summary: Breadth of HP-relevant workplace tools, capped.
  purpose: Breadth of HP-relevant workplace tools, capped.
  inputs:
  - Technology names
  logic: 'Each technology name is checked against a fixed list of qualifying names (the name must contain
    the list entry). The count is the number of distinct list entries matched, not the number of products:
    one product can match several entries (for example ''VMware vSphere'' matches ''vmware'', ''vsphere''
    and ''vmware vsphere''; ''Microsoft Intune'' matches ''intune'' and ''microsoft intune''). Anything
    not on the list does not count.'
  conditions:
  - 'Qualifying list: microsoft intune, intune, microsoft entra, entra id, azure ad, azure active directory,
    servicenow, power bi, tableau, power automate, microsoft teams, vmware vsphere, vmware esxi, vmware
    horizon, vsphere, esxi, vmware, microsoft 365, office 365, google workspace, g suite, sharepoint,
    zoom, webex, splunk'
  - No further check of HP relevance beyond the list
  table:
    columns:
    - Distinct qualifying entries
    - Points
    rows:
    - - 5 or more
      - 30
    - - 3-4
      - 20
    - - 1-2
      - 10
    - - '0'
      - 0
  constants:
  - label: Bands
    ref: scoring:urgency.workplace_footprint_bands
    stated:
    - - 5
      - 30
    - - 3
      - 20
    - - 1
      - 10
  - label: Maximum
    ref: scoring:urgency.workplace_footprint_max
    stated: 30
  - label: Qualifying list
    ref: py:app.services.dashboard.urgency:WORKPLACE_TECHNOLOGIES
  example:
    scenario: 'Stack has two products: ''VMware vSphere'' and ''Microsoft Intune''.'
    steps:
    - VMware vSphere matches vmware, vsphere, vmware vsphere (3)
    - Microsoft Intune matches intune, microsoft intune (2)
    - 5 distinct entries -> top band
    result: 30/30
    verified: true
    expect: 30.0
  output: 0-30 points
