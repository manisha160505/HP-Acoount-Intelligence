# Rules page catalog for `executive_dashboard`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: executive_dashboard
purpose: 'Gives a seller a one-page view of the account: who the company is, its size and filed financials,
  its hiring, how urgent it is for HP, and its evidenced strategic priorities.'
final_output: Company profile (with description bullets and parent company), size bands, filed figures
  with growth and CEO, a 12-month job-postings tile, a 0-100 Urgency Score with four driver breakdowns
  (or 'No signal observed' when less than 60% of the inputs are available), and up to 6 strategic priority
  cards grouped by theme, each with an evidence score, HP-focused bullets, source points and an optional
  case-study proof.
how_it_combines: 'Five independent cards, each with its own rules.

  1. Executive Summary: identity, location, industry and parent company come straight from the company''s
  records; the description bullets are written by AI and checked for invented numbers.

  2. Key Metrics: size bands from the company profile, plus financial figures and the CEO taken from the
  filings on record.

  3. Hiring Velocity: job postings in the account''s own country over the 12 months before the job data
  was collected.

  4. Urgency Score: four drivers, each out of 100, weighted {{scoring:urgency.weights.workplace_os|pct}}
  / {{scoring:urgency.weights.ai_workstation|pct}} / {{scoring:urgency.weights.growth_expansion|pct}}
  / {{scoring:urgency.weights.hp_solution_intent|pct}} and rounded; withheld when too few inputs are present.

  5. Strategic Priorities: AI proposes priorities; only those whose cited evidence exists and is on topic
  are kept, near-duplicates are merged, and each one''s Evidence Strength is scored (filings + recency
  + source diversity).'
rules:
- id: feature_build
  parent: null
  name: When the Executive Dashboard is built
  kind: selection
  internal: true
  summary: Explains which information the dashboard needs and which parts are rebuilt together.
  purpose: Explains which information the dashboard needs and which parts are rebuilt together.
  inputs:
  - The company profile, corporate structure and job postings (required)
  - The company's installed technology, website technology, online research topics, HP's own category
    scores, social-media figures, news coverage, company events, filings and filing figures (optional)
  logic: 'The core of the dashboard (Executive Summary, Key Metrics, Hiring Velocity and the Urgency Score)
    is built in one step that needs the account''s company profile, corporate structure and job postings
    to be present. The Urgency Score is calculated at the end of that step; if it fails for an unexpected
    reason the account loses only its urgency card, not the rest of the dashboard. Strategic Priorities
    are built in a separate later step, only after the account''s searchable collection of filed documents
    and other evidence has been built. Nothing is rebuilt on its own: a change to the data or the rules
    marks the cards as out of date, and an administrator''s request rebuilds them.'
  conditions:
  - 'Required information: company profile, corporate structure, job postings'
  - An urgency failure does not stop the other cards from being shown
  - Strategic Priorities need the account's evidence collection to be built (current or slightly out of
    date); otherwise nothing is shown for that card
  - Changing the urgency scoring settings or the hiring rules marks the core cards as out of date; changing
    the evidence strength settings marks Strategic Priorities as out of date
  constants:
  - label: Hiring rules version
    ref: py:app.services.hp.hiring_jobs:HIRING_RULES_VERSION
    stated: 2
  - label: 'Business-description bullets: version of the wording instructions'
    ref: py:app.services.extractors.executive_dashboard:SUMMARY_PROMPT_VERSION
    stated: 1
  - label: 'Strategic priorities: version of the wording instructions'
    ref: py:app.services.dashboard.priorities:PROMPT_VERSION
    stated: 1
  output: 'Five cards: Executive Summary, Key Metrics, Hiring Velocity, Urgency Score and Strategic Priorities.'
  sources:
  - hp-backend/src/app/services/extractors/executive_dashboard.py:extract_executive_dashboard
  - hp-backend/src/app/services/regen/graph.py
  - hp-backend/src/app/services/dashboard/priorities.py:generate_dashboard_intelligence
  confidence: high
