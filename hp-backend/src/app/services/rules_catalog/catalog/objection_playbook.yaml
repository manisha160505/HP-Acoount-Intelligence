# Rules page catalog for `objection_playbook`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: objection_playbook
purpose: Prepares the seller for push-back in five fixed HP contest areas, using the technology the account
  is known to run, claims approved in HP's sales rulebook and, where one exists, an HP customer case study.
final_output: A header showing the number of reframes and an 'Incumbents Detected' count, then up to five
  expandable cards, one per area. Each card shows a hypothetical buyer objection and 'Could be raised
  by' (a real contact's job title only when the title is a strong match, otherwise the function that owns
  the area). When expanded, the card shows the reframe, the evidence line word for word, a counter question,
  an HP proof point when one exists, and a topic-owner line stating that the person has not raised it.
how_it_combines: The playbook always works through the same five HP contest areas. For each area it finds
  the vendors the account runs (from the installed technology list, or from website technology when that
  list is empty), names a topic owner only on a strong job-title match, and selects the claims from HP's
  approved sales rulebook that the account's evidence has earned. It can also attach a case study. The
  AI writes the objection and reframe from that material only. The app then rejects cards that use the
  sector as justification, make unsupported HP claims or invent numbers, gives rejected areas one more
  try, and merges near-duplicates.
rules:
- id: technology_evidence_source
  parent: null
  name: Which technology evidence the playbook is built from
  kind: source
  summary: Picks one source of technology information per account, in a fixed order, and records which
    one was used.
  purpose: Picks one source of technology information per account, in a fixed order, and records which
    one was used.
  inputs:
  - The account's installed technology list
  - The account's website technology
  logic: '1) If the installed technology list has at least one non-blank entry, it is used. 2) Otherwise
    the website technology is used: every technology named under its categories is combined into one ''Website
    stack'' list. Technical page details (search-engine headers, titles and descriptions, copyright, document
    information, robots, language, feeds, links, web master) and ID fields are skipped. 3) Otherwise there
    is no technology evidence and no objection is written. Technology seen in job ads and in other vendors''
    technology detections is never used. The source used is recorded on the card. When website technology
    is used, a note says that the installed technology list has no data for this account and that the
    evidence is website technology; the admin data-gaps view reads that note.'
  conditions:
  - Installed technology list has any non-blank entry -> use it
  - Otherwise website technology has any real technology (not page details) -> use it
  - Otherwise -> no technology evidence; the Objection Playbook shows an empty message and no cards
  constants:
  - label: Names shown for each source
    ref: py:app.services.extractors.objection_playbook:EVIDENCE_SOURCE_LABELS
    stated:
      technographics: 4_Technographics
      tech_breakdown: tech_breakdown (website technology)
      none: No technology evidence available
  example:
    scenario: The installed technology list exists but its only entry is blank.
    steps:
    - The entry has no non-blank value, so it cannot be used
    - Fall back to website technology
    result: The installed technology list is not usable, so website technology is tried
    verified: true
    expect: false
  output: 'One of three sources: installed technology list, website technology, or none. The page header
    says which one was used.'
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:_technology_evidence
  - hp-backend/src/app/services/extractors/objection_playbook.py:_usable
  - hp-backend/src/app/services/extractors/tech_landscape.py:_parse_tech_breakdown
  - hp-backend/src/app/services/extractors/objection_playbook.py:EVIDENCE_SOURCE_LABELS
  - hp-backend/src/app/services/extractors/objection_playbook.py:TECH_BREAKDOWN_FALLBACK_NOTE
  doc_source: 'Client round-2 load guidance quoted at objection_playbook.py:197: ''website tech when no
    technographics'''
  confidence: high
- id: incumbent_context
  parent: null
  name: Incumbent Technology Context panel
  kind: selection
  summary: Lists the technologies the account is known to run, plus business context.
  purpose: Lists the technologies the account is known to run, plus business context.
  inputs:
  - The account's installed technology list
  - The company profile
  - The contact list
  logic: 'Only when the source is the installed technology list: the incumbent technologies are every
    item in the account''s full technology list (all technologies, not only competitors), and the relevant
    categories are the technology categories (20 in total) that have at least one entry. Business context
    comes from the company profile: business description, company name, web domain, headquarters location
    (city, region and country joined; otherwise the stated headquarters), industry (the LinkedIn, NAICS
    and SIC industry labels, with repeats removed, joined with '' / ''), employee range and revenue range.
    The panel also carries the evidence and topic owner for each area. Status is ''available'' if there
    are incumbents or business context, otherwise ''empty''. When website technology is the source, the
    incumbent list stays empty (count 0).'
  output: The 'N Incumbents Detected' badge in the page header. The other details sit in the panel.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:extract_objection_playbook
  - hp-backend/src/app/services/extractors/objection_playbook.py:TECHNOGRAPHICS_CATEGORY_COLUMNS
  confidence: high
- id: contest_areas
  parent: null
  name: Five fixed HP contest areas
  kind: selection
  summary: Every account is examined in the same five areas; each area gets at most one objection card.
  purpose: Every account is examined in the same five areas; each area gets at most one objection card.
  logic: 'For each area, the playbook finds competing vendors in the technology evidence and writes a
    plain evidence line. Areas are always handled in this order: Client Devices, Collaboration, Print
    / MPS, Endpoint Security, Device Management. An area with no vendor is still kept (marked as not shown
    in the installed technology) and still gets a card.'
  table:
    columns:
    - Area
    - Technology categories checked
    - Main vendors (these carry the objection)
    rows:
    - - Client Devices
      - Platform and storage, IT management
      - dell, lenovo, asus, acer, msi, apple ios, macos, chromeos, microsoft windows, thinkpad, latitude,
        macbook, matebook, surface laptop
    - - Collaboration
      - Collaboration, communications
      - zoom, microsoft teams, webex, poly, logitech, g suite, google workspace, slack, ringcentral, microsoft
        office 365, google meet
    - - Print / MPS
      - Productivity and operations, operations management
      - canon, epson, xerox, ricoh, brother, kyocera, lexmark, sharp, konica, papercut, printer
    - - Endpoint Security
      - IT security, computer networks
      - symantec, kaspersky, defender, crowdstrike, sentinelone, mcafee, sophos, trend micro, bitdefender,
        eset, carbon black, cylance
    - - Device Management
      - IT management, computer networks
      - intune, workspace one, airwatch, jamf, manageengine, sccm, ivanti, tanium, ninjaone
  constants:
  - label: Technology categories checked for each area
    ref: py:app.services.extractors.objection_playbook:AREA_CATEGORY_COLUMNS
  - label: Main vendors for each area
    ref: py:app.services.extractors.objection_playbook:AREA_PRIMARY_TOKENS
  output: One evidence entry per area.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:AREA_CATEGORY_COLUMNS
  - hp-backend/src/app/services/extractors/objection_playbook.py:_build_area_evidence
  confidence: high
- id: vendor_token_matching
  parent: contest_areas
  name: How a vendor is detected in an area
  kind: selection
  summary: Finds competitor technologies without false hits inside other words.
  purpose: Finds competitor technologies without false hits inside other words.
  logic: 'A vendor name counts as a match only when it stands alone as a word: no letter or digit directly
    before or after it, ignoring capital letters. So ''it'' does not match ''quality'' and ''poly'' does
    not match ''Polycom''. The area''s own technology categories are checked first (noting which category),
    then the full technology list (or the ''Website stack'' list when website technology is the source)
    for anything not already found. Each technology is listed once.'
  example:
    scenario: Vendor name 'poly' against the entry 'Polycom'.
    steps:
    - '''poly'' is followed by the letter ''c'', so it does not stand alone as a word'
    result: No match
    verified: true
    expect: false
  output: Vendors detected for each area.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:_token_present
  - hp-backend/src/app/services/extractors/objection_playbook.py:_build_area_evidence
  confidence: high
- id: context_vendors
  parent: contest_areas
  name: Supporting-context technologies (Endpoint Security only)
  kind: selection
  summary: Shows adjacent security products without letting them carry the argument.
  purpose: Shows adjacent security products without letting them carry the argument.
  logic: For Endpoint Security only, products matching Cisco ASA, Cisco IronPort, Fortinet, FortiGate,
    FortiManager, Aruba ClearPass, Palo Alto, Check Point, Azure AD or Okta (found in the technology list
    or the area's categories, and not already a main vendor) are listed as 'supporting context'. They
    never make an area count as 'detected', and the AI is told not to treat them as doing the area's job.
  constants:
  - label: Endpoint Security supporting-context vendors
    ref: py:app.services.extractors.objection_playbook:AREA_CONTEXT_TOKENS.Endpoint Security
    stated:
    - cisco asa
    - cisco ironport
    - fortinet
    - fortigate
    - fortimanager
    - aruba clearpass
    - palo alto
    - check point
    - azure ad
    - okta
  output: Supporting-context vendors for each area.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:AREA_CONTEXT_TOKENS
  - hp-backend/src/app/services/extractors/objection_playbook.py:_build_area_evidence
  confidence: high
- id: area_evidence_string
  parent: contest_areas
  name: The evidence line shown on each card
  kind: display
  summary: An evidence line written by fixed rules and shown word for word; the AI may read it but not
    rewrite it.
  purpose: An evidence line written by fixed rules and shown word for word; the AI may read it but not
    rewrite it.
  logic: 'If vendors were found: ''<source> -> <Area> | <category>: <vendors> | ...'', plus '' | supporting
    context: ...'' when there is any. If none were found: ''<source> -> <Area>: no vendor for this area
    appears in this account''s <installed technology | website technology> evidence''. The no-vendor wording
    means only that the data does not name one, never that the account has none.'
  example:
    scenario: 'Technology list: Dell Latitude, Microsoft Teams, Zoom, Canon imageRUNNER, Kaspersky Endpoint
      Security, Fortinet FortiGate, Okta, Microsoft Intune, SAP ERP. The collaboration category lists
      ''Microsoft Teams, Zoom''; the IT security category lists ''Kaspersky Endpoint Security, Fortinet
      FortiGate''; the IT management category lists ''Microsoft Intune''.'
    steps:
    - 'Client Devices: ''latitude'' and ''dell'' are found only in the full technology list'
    - 'Collaboration: Teams and Zoom are found in the collaboration category'
    - 'Print / MPS: ''canon'' is found in the full technology list'
    - 'Endpoint Security: Kaspersky is found in the IT security category; FortiGate and Okta are supporting
      context'
    - 'Device Management: Intune is found in the IT management category'
    result: 'Client Devices: Dell Latitude (full technology list). Collaboration: Microsoft Teams, Zoom
      (collaboration category). Print / MPS: Canon imageRUNNER (full technology list). Endpoint Security:
      Kaspersky Endpoint Security (IT security category), with Fortinet FortiGate and Okta as supporting
      context. Device Management: Microsoft Intune (IT management category).'
    verified: true
    expect:
    - 'technographics -> Client Devices | Full Tech Stack: Dell Latitude'
    - 'technographics -> Collaboration | Collaboration: Microsoft Teams, Zoom'
    - 'technographics -> Print / MPS | Full Tech Stack: Canon imageRUNNER'
    - 'technographics -> Endpoint Security | It Security: Kaspersky Endpoint Security | supporting context:
      Fortinet FortiGate, Okta'
    - 'technographics -> Device Management | It Management: Microsoft Intune'
  output: The 'Evidence' panel on the card.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:_build_area_evidence
  confidence: high
- id: topic_owner
  parent: null
  name: Topic owner ('Could be raised by')
  kind: selection
  summary: Names who at the account would own each area's subject - never someone who raised the objection.
  purpose: Names who at the account would own each area's subject - never someone who raised the objection.
  inputs:
  - 'The contact list: each contact''s job title and department'
  logic: For each area, every contact's job title is checked for the area's STRONG title words (whole
    words only). A contact whose title has no strong word is ignored entirely, even if a weaker word or
    the department matches, because a weak match is only the nearest technically adjacent person, not
    the owner. Rank = the number of strong words matched, plus 1 if the contact's department is one of
    the area's owner departments. The highest rank wins; on a tie the contact listed first stays. The
    winner's own job title is shown and marked as coming from the contact list. If nobody matches a strong
    word, the area name itself is shown and marked as an HP contest area. Weaker title words play no part
    in the choice.
  formula: rank of a contact = number of strong title words in the job title + (1 if the department is
    one of the area's owner departments, otherwise 0); only contacts with at least 1 strong word are eligible
  table:
    columns:
    - Area
    - Strong title words (required)
    - Owner departments (+1)
    rows:
    - - Client Devices
      - procurement, end user, information technology, it operations, infrastructure
      - Information Technology, Operations
    - - Collaboration
      - collaboration, communications, end user, workplace
      - Information Technology, Operations
    - - Print / MPS
      - procurement, facilities, general affairs, administration
      - Operations, Information Technology, Finance
    - - Endpoint Security
      - security, ciso, infosec, cyber, information security
      - Information Technology, Engineering & Technical
    - - Device Management
      - information technology, it operations, infrastructure, procurement, end user
      - Information Technology, Engineering & Technical
  constants:
  - label: Strong owner title words
    ref: py:app.services.extractors.objection_playbook:AREA_OWNER_STRONG_TOKENS
  - label: Owner departments
    ref: py:app.services.extractors.objection_playbook:AREA_OWNER_DEPARTMENTS
  example:
    scenario: 'Contacts: Head of IT Procurement (IT department), Head of Cloud Operations (IT department),
      IT Security Manager (IT department), General Affairs Manager (Operations department).'
    steps:
    - 'Client Devices: ''procurement'' matches Head of IT Procurement (1) + IT department (1) = 2; General
      Affairs Manager has no Client Devices strong word'
    - 'Collaboration: nobody''s title has collaboration, communications, end user or workplace (''operations''
      is only a weak word) -> the area name is shown'
    - 'Print / MPS: Head of IT Procurement = 1 + 1 = 2 and General Affairs Manager = 1 + 1 = 2; on a tie
      the contact listed first stays'
    - 'Endpoint Security: ''security'' matches IT Security Manager'
    - 'Device Management: ''procurement'' matches Head of IT Procurement'
    result: 'Client Devices: Head of IT Procurement; Collaboration: ''Collaboration'' (the owning function);
      Print / MPS: Head of IT Procurement; Endpoint Security: IT Security Manager; Device Management:
      Head of IT Procurement'
    verified: true
    expect:
    - - Client Devices
      - - Head of IT Procurement
        - prospect_contacts
    - - Collaboration
      - - Collaboration
        - hp_contest_area
    - - Print / MPS
      - - Head of IT Procurement
        - prospect_contacts
    - - Endpoint Security
      - - IT Security Manager
        - prospect_contacts
    - - Device Management
      - - Head of IT Procurement
        - prospect_contacts
  output: The 'Could be raised by' line on each card, and whether it came from a real contact or from
    the area name.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:_resolve_likely_raiser
  - hp-backend/src/app/services/extractors/objection_playbook.py:AREA_OWNER_STRONG_TOKENS
  - hp-backend/src/app/services/extractors/objection_playbook.py:AREA_OWNER_DEPARTMENTS
  - hp-backend/src/app/services/extractors/objection_playbook.py:AREA_OWNER_WEAK_TOKENS
  confidence: high
- id: topic_owner_wording
  parent: topic_owner
  name: Deliberately cautious wording for the topic owner
  kind: guardrail
  summary: The card never says the person 'likely raised' the objection, because a title is named only
    on a strong word match and otherwise the area name is shown.
  purpose: The card never says the person 'likely raised' the objection, because a title is named only
    on a strong word match and otherwise the area name is shown.
  logic: 'Collapsed card: ''Could be raised by: <name>'', with '' (owning function)'' added when the area
    name is shown instead of a contact. Expanded card: if a contact''s title was used, ''Topic owner:
    <title> - a title in this account''s contacts who would own this subject. They have not raised this
    objection.''; otherwise ''Owning function: <area>''. The AI is told that the topic owner is the audience,
    not the speaker, and that the objection must never be attributed to a person.'
  example:
    scenario: Collaboration resolved to the area name.
    steps:
    - No contact's title matched, so the area name was used
    result: '''Could be raised by: Collaboration (owning function)'' and ''Owning function: Collaboration'''
    verified: true
    expect:
    - Collaboration
    - hp_contest_area
  output: The 'Could be raised by' line on the card.
  sources:
  - hp-frontend/src/app/dashboard/page.tsx
  - hp-backend/src/app/services/extractors/objection_playbook.py
  doc_source: 'Project decision: ''Could be raised by'' / ''Topic owner'', never ''Likely raised by''
    (feature_mapping.py:605 ''This names a topic owner, never someone who has raised the objection'')'
  confidence: high
- id: rulebook_claims
  parent: null
  name: HP claims the reframe may make (HP's approved sales rulebook)
  kind: selection
  uses:
  - hp_rulebook
  summary: Limits what the reframe may say about HP to approved rulebook facts that the account's own
    evidence earns.
  purpose: Limits what the reframe may say about HP to approved rulebook facts that the account's own
    evidence earns.
  logic: 'The account''s evidence is matched against HP''s approved sales rulebook. For each area, the
    rules from the relevant rule groups that the evidence has earned are kept, each rule''s facts are
    passed through the guardrails, and at most 3 rules x 4 facts per area are given to the AI as ''may
    say'' lines (with the rule''s prohibitions as ''must not say''). An area with no approved claim is
    told: ''APPROVED HP CLAIMS for this area: NONE ... may name an HP line but MUST NOT state any capability,
    benefit, saving or figure''. If the rulebook cannot be read, every area is treated as having no approved
    claims.'
  output: The list of approved HP claims given to the AI for each area. The claim source, the rules used
    and any note are saved with the card but not shown.
  sources:
  - hp-backend/src/app/services/extractors/objection_playbook.py:_rulebook_claims
  - hp-backend/src/app/services/extractors/objection_playbook.py:_claims_block
  - hp-backend/src/app/services/extractors/objection_playbook.py:generate_objection_cards
  doc_source: Rulebook C 01, C 02, C 06, C 07 as quoted in rulebook.py:10-46
  confidence: high
- id: rulebook_evidence_corpus
  parent: rulebook_claims
  name: Account evidence the rulebook is matched against
  kind: selection
  summary: Defines which pieces of account information can fire a rule.
  purpose: Defines which pieces of account information can fire a rule.
  logic: Every field of the company profile, installed technology list, job openings, intent topics, news
    events, Google News results, website technology and technology detections. The contact list is deliberately
    left out, because a person's skill is not the company's need. A piece of text is skipped if it is
    shorter than 4 characters, starts with '{' or '[', sits in a field that looks like an ID, link, web
    address, domain, date, timestamp, score, count, currency, salary, map coordinate or postal code, or
    is itself an ID, timestamp, web address or plain number.
  constants:
  - label: Evidence sources
    ref: py:app.services.hp.rulebook:EVIDENCE_DATASETS
    stated:
    - firmographics
    - technographics
    - job_openings
    - intent_topics
    - news_events
    - google_news
    - webstack
    - technology_detections
  example:
    scenario: A 'company domain' field with the value 'astra.co.id'.
    steps:
    - The field name looks like a domain field, so it is ignored
    result: Skipped
    verified: true
    expect: false
  output: The list of usable pieces of evidence.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:EVIDENCE_DATASETS
  - hp-backend/src/app/services/hp/rulebook.py:account_evidence
  - hp-backend/src/app/services/hp/rulebook.py:_is_meaningful
  confidence: high
- id: rule_fired_by
  parent: rulebook_claims
  name: When a rule is 'fired by' the account's evidence
  kind: selection
  uses:
  - hp_rulebook
  summary: Defines when a rulebook rule counts as matched.
  purpose: Defines when a rulebook rule counts as matched.
  logic: Each rule has trigger words, plus extra words that the account's data would contain if the signal
    were true. A word fires on a piece of evidence when it appears there as a whole word, ignoring capital
    letters. Evidence containing a known look-alike phrase (for example tokenization, vehicle, vehicles,
    fleet maintenance, ai chips, social collaboration, employee experience management, executive education)
    is ignored. The rule is fired when at least one word hits at least one piece of evidence. The matching
    evidence and the distinct matched words are recorded.
  example:
    scenario: 'An HP Wolf security rule with the words ''kaspersky'' and ''symantec endpoint protection'';
      evidence: ''Kaspersky Endpoint Security'', ''SAP ERP'', ''Microsoft Teams Rooms''.'
    steps:
    - '''kaspersky'' is found as a whole word in the first piece of evidence'
    - '''symantec endpoint protection'' is not found'
    result: The rule fires on the first piece of evidence; the matched word is 'kaspersky'
    verified: true
    expect:
    - - 0
    - - kaspersky
  output: Which evidence matched, and which words matched.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:_fired_by
  - hp-backend/src/app/services/hp/rulebook.py:_match_terms
  - hp-backend/src/app/services/hp/rulebook.py:_Corpus
  - hp-backend/src/app/services/hp/product_rules.py:GLOBAL_EXCLUDE_PHRASES
  confidence: high
- id: qualifying_vs_indicative
  parent: rule_fired_by
  name: A rule must be earned by a qualifying term
  kind: selection
  summary: Stops rules firing on words that every large company would match.
  purpose: Stops rules firing on words that every large company would match.
  logic: A matched word is only 'indicative' (not enough on its own) when every word in it is either a
    ubiquitous vendor or platform (microsoft, google, apple, adobe, oracle, sap, amazon, aws, azure, cisco,
    ibm, windows, linux, android, ios, macos, chrome, office, teams, zoom, slack, outlook, excel, word,
    sharepoint, onedrive, gmail, workspace, salesforce, jira, confluence) or a generic qualifier (erp,
    crm, cloud, suite, platform, enterprise, software, system(s), solution(s), service(s), tool(s), application(s),
    app(s), financials, server(s), online, premium, pro, plus, standard, edition), and at least one word
    is a ubiquitous vendor. For a rule marked as routing-only (with extra words), only the extra words
    can qualify. A rule with no qualifying word is dropped and the reason is recorded.
  example:
    scenario: The word 'sap erp'.
    steps:
    - '''sap'' is a ubiquitous vendor and ''erp'' is a generic qualifier'
    result: Indicative (yes) - it cannot earn a rule
    verified: true
    expect: true
  output: Qualifying words, indicative words and dropped rules.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:indicative_term
  - hp-backend/src/app/services/hp/rulebook.py:split_terms
  - hp-backend/src/app/services/hp/rulebook.py:candidates
  confidence: high
- id: family_gates
  parent: rule_fired_by
  name: Rule-group gates (HP IQ market, Wolf device support)
  kind: guardrail
  summary: Removes whole rule groups or offerings the account cannot take.
  purpose: Removes whole rule groups or offerings the account cannot take.
  logic: 'HP IQ: if the account''s country is known and is not the United States (''united states'', ''us'',
    ''usa''), every IQ rule is blocked, because IQ 1.0 is for the US and English only. An unknown country
    does not block. Wolf: if the account''s evidence names no HP client hardware (hp elitebook, hp probook,
    hp elitedesk, hp prodesk, hp zbook, hp elitestudio, hp prostudio, hp elite pc, hp pro pc, hp workstation,
    hp z workstation, hp dragonfly, hp omnibook), a Wolf rule is dropped when its offering is listed as
    ''HP PCs only'' or ''HP commercial PCs only'' for device support (the longest matching offering name
    is used first). Offerings that are not listed are allowed.'
  example:
    scenario: Account in Indonesia.
    steps:
    - The country is known and is not the United States
    result: HP IQ is not available, so all IQ rules are blocked
    verified: true
    expect: false
  output: Rules kept or dropped.
  sources:
  - hp-backend/src/app/services/hp/rulebook.py:iq_availability
  - hp-backend/src/app/services/hp/rulebook.py:has_hp_client_hardware
  - hp-backend/src/app/services/hp/rulebook.py:wolf_offering_allowed
  - hp-backend/src/app/services/hp/rulebook.py:candidates
  confidence: high
- id: rule_conditions
  parent: rule_fired_by
  name: 'Rule conditions: drop, or label as unverified'
  kind: guardrail
  summary: Applies the conditions written into a rule.
  purpose: Applies the conditions written into a rule.
  logic: Only country, management environment and operating system conditions can be tested. A country
    condition naming the United States drops the rule if the account's country is known and does not contain
    it ('English' is ignored as a language). A management environment or operating system condition is
    met when a term it names (intune, entra, autopilot, sccm, vpro, azure, active directory, on-premises,
    cloud portal, tenancy / windows, macos, linux, android, ios, chromeos) also appears in the account's
    evidence; otherwise it is kept as 'unverified'. Every other kind of condition is kept as 'unverified'
    and the rule stays.
  example:
    scenario: Condition 'Requires E5 licence' (a licence condition), account in Indonesia.
