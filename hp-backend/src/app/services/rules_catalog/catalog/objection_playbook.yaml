    one sentence), the reframe (maximum two sentences; it must name an HP line and an account-specific
    angle tied to that area''s evidence), a counter question, why the objection is expected, and a recommended
    next step. The evidence, vendors, area, topic owner, proof point and the source of each HP claim are
    fixed by rules and are never sent back for rewriting. The AI is instructed (these instructions are
    not checked automatically) to: treat objections as hypothetical, never as reported speech; use no
    vendor, product, number, customer or event outside the area''s evidence; for areas with no vendor,
    frame a visibility gap, never ''greenfield'' or ''no incumbent'', and make the objection a de-prioritisation;
    build only on main technologies; avoid complimenting openers, the ''<praise> ... However'' pattern
    and filler phrases; and give each reframe a different shape.'
