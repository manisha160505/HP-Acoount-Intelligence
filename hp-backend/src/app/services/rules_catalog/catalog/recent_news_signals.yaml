# Rules page catalog for `recent_news_signals`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: recent_news_signals
purpose: Lists current news and events about the account and scores each one out of 10 for how recent
  it is, how relevant it is to HP and how reliable its source is.
final_output: 'A feed of event cards, highest score first. Each card shows a category tag, an urgency
  badge, the event status, the date, the score out of 10, the headline and the supporting evidence. Below
  that is an ''Implication for HP'' paragraph with the HP product line it points to and, where one fits,
  a customer case study. An expandable breakdown shows the three scores behind the total and the source
  line (for example ''T1 - Established news: Nikkei'').'
how_it_combines: 'News items about the account are tidied up and dropped if they are older than 12 months
  or have no date. Repeat reports of the same event are merged into one. Each remaining signal gets a
  score from 0 to 10: Recency ({{scoring:live_signal.weights.recency|pct}}, from date bands) + Relevance
  & Impact ({{scoring:live_signal.weights.relevance_impact|pct}}, judged by AI) + Source Reliability ({{scoring:live_signal.weights.source_reliability|pct}},
  from the type of source). There are no tiers, no minimum score and no limit on the number of signals.
  Every scored signal in the window is published, highest first. Each one carries an AI-written ''Implication
  for HP'', which is checked for banned phrases, repetition, length and invented numbers before it is
  shown.'
rules:
- id: ls_sources
  parent: null
  name: Which news sources become Live Signals
  kind: source
  summary: Decides which news items can appear on the Live Signals page and which date each one is aged
    from.
  purpose: Decides which news items can appear on the Live Signals page and which date each one is aged
    from.
  inputs:
  - 'Recent news coverage about the company: headline, announcement text, event date, event type, link,
    publisher and the feed''s own confidence rating'
  - 'News events recorded about the company: summary, sentence from the article, effective date, date
    first found, category, confidence, location, product and amount'
  logic: 'Two sets of news information about the account are read: recent news coverage from news searches,
    and news events from a third-party business data provider. Every item becomes one signal with a headline,
    an optional evidence sentence, a date, a category and its source. The source text is used word for
    word. For news coverage the date used is the event date. For news events it is the effective date
    and, only when that is blank, the date the item was first found. An item with no headline text is
    skipped.'
  conditions:
  - News events come with no web link, so their signals never get a link (none is made up)
  - Hiring-event data and job-opening data are NOT used by this feature
  example:
    scenario: A news event with a blank effective date and a first-found date of 2026-09-02.
    steps:
    - The effective date is blank, so the first-found date is used as the event date.
    result: The signal is dated 2026-09-02.
    verified: true
    expect: '2026-09-02'
  output: One standardised signal per news item.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_normalize_signals
  - hp-backend/src/app/services/extractors/recent_news_signals.py:extract_recent_news_signals
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 3A (Signal Age source table) and section 7 step
    1
  confidence: high
- id: ls_headline_publisher
  parent: ls_sources
  name: Publisher recovered from the headline
  kind: selection
  summary: News headlines often end with ' - Publisher'. That name is used to judge the source.
  purpose: News headlines often end with ' - Publisher'. That name is used to judge the source.
  logic: If the headline contains ' - ', the text after the last ' - ' is treated as the publisher and
    removed from the headline. This happens only when that text is 40 characters or fewer, 6 words or
    fewer, and does not end in . ! ? or a comma. Otherwise the headline is left whole and no publisher
    is claimed. A publisher recovered this way takes priority over any publisher name supplied separately
    with the item.
  constants:
  - label: Max publisher length (characters)
    value: 40
  - label: Max publisher words
    value: 6
  example:
    scenario: Headline 'ASII sets IDR 36 trillion capex for 2026, up 10% year on year - IDNFinancials'.
    steps:
    - The ending 'IDNFinancials' is short and does not end in punctuation.
    result: The headline becomes 'ASII sets IDR 36 trillion capex for 2026, up 10% year on year' and the
      publisher is IDNFinancials.
    verified: true
    expect:
    - ASII sets IDR 36 trillion capex for 2026, up 10% year on year
    - IDNFinancials
  output: A clean headline and a publisher name.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_split_headline_publisher
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_normalize_signals
  confidence: high
- id: ls_duplicate_body
  parent: ls_sources
  name: Repeated body text is not shown twice
  kind: display
  summary: Stops the card printing the same line twice.
  purpose: Stops the card printing the same line twice.
  logic: If the evidence text is identical to the headline, ignoring capital letters and spacing, the
    evidence text is left blank.
  example:
    scenario: A news coverage item whose headline and announcement text are both 'Astra opens plant -
      Reuters'.
    steps:
    - The publisher 'Reuters' is split off the headline.
    - The evidence text equals the original headline, so it is blanked.
    result: No evidence sentence; the publisher is Reuters.
    verified: true
    expect:
    - ''
    - Reuters
  output: An evidence sentence, or nothing.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_same_text
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_normalize_signals
  confidence: high
- id: ls_category_map
  parent: ls_sources
  name: Signal category (Financial, Technology, Security, Hiring, Strategic, Competitive)
  kind: selection
  summary: Gives every card one of six display categories, used for the coloured tag and the category
    filter.
  purpose: Gives every card one of six display categories, used for the coloured tag and the category
    filter.
  logic: The original event type is looked up in a fixed table for each kind of source. Anything not in
    the table becomes Strategic.
  table:
    columns:
    - Source
    - Original event type
    - Category
    rows:
    - - News coverage
      - funding, earnings
      - Financial
    - - News coverage
      - M&A, acquisition, leadership, partnership, other
      - Strategic
    - - News coverage
      - launch, product
      - Technology
    - - News coverage
      - hiring
      - Hiring
    - - News coverage
      - security
      - Security
    - - News events
      - reports earnings, invests, invests in assets, receives financing
      - Financial
    - - News events
      - launches a product, is developing a product
      - Technology
    - - News events
      - partners with, acquires, sells assets to, expands to
      - Strategic
    - - News events
      - is named as a competitor
      - Competitive
    - - News events
      - hires, increases headcount
      - Hiring
    - - News events
      - is vulnerable to a security issue
      - Security
    - - Either source
      - anything else
      - Strategic
  example:
    scenario: A news event of type 'expands to' and one of an unknown type 'opens office'.
    steps:
    - '''Expands to'' is in the table, so it is Strategic.'
    - '''Opens office'' is not in the table, so it gets the default, Strategic.'
    result: Both are Strategic.
    verified: true
    expect:
    - Strategic
    - Strategic
  output: Display category.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:GOOGLE_NEWS_TYPE_MAP
  - hp-backend/src/app/services/extractors/recent_news_signals.py:NEWS_EVENTS_CATEGORY_MAP
  - hp-backend/src/app/services/extractors/recent_news_signals.py:DEFAULT_CATEGORY
  confidence: high
- id: ls_gate
  parent: null
  name: 12-month gate
  kind: guardrail
  summary: Removes items that cannot be current account news before any AI sees them.
  purpose: Removes items that cannot be current account news before any AI sees them.
  inputs:
  - Standardised signals and today's date
  logic: A signal is rejected, with the reason recorded, if it has no headline and no evidence sentence,
    if its date cannot be read, if its date is in the future, or if it is more than 365 days before today
    (the day the feed is built). Everything else passes. Rejections are counted by reason and shown in
    the feed summary ('from N raw').
  conditions:
  - The window is measured back from the day the feed is built, not from the day the data was collected
  - An undated signal is dropped here, so the 'No usable date = 0/10' band is never shown on a card
  - A future-dated signal is dropped here, although the recency scoring itself would treat it as same-day
  constants:
  - label: Maximum age in days
    ref: py:app.services.extractors.recent_news_signals:GATE_MAX_AGE_DAYS
    stated: 365
  example:
    scenario: 'Build date 17 Sep 2026; five signals: A dated 1 Sep 2026, B undated, C dated 1 Oct 2026,
      D dated 1 Sep 2025, E with no text.'
    steps:
    - A is 16 days old, so it passes.
    - 'B: the date cannot be read.'
    - 'C: the date is in the future.'
    - 'D: 381 days old, which is older than 365 days.'
    - 'E: no headline or evidence.'
    result: Only A passes.
    verified: true
    expect:
    - - A
    - - unparseable date
      - date is in the future
      - older than 365 days
      - no headline or evidence sentence
  output: The signals that passed, plus a list of rejections with reasons.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_apply_gate
  - hp-backend/src/app/services/extractors/recent_news_signals.py:GATE_MAX_AGE_DAYS
  doc_source: 'Not in HP_Live_Signal_Scoring_Logic.docx; scoring.yaml comment cites client 23 Sep: ''we
    should not keep the cap, pls use 12 month window'''
  confidence: high
- id: ls_dedup
  parent: null
  name: Same event reported twice becomes one card
  kind: filter
  summary: Combines repeat coverage of one event into one card, keeping every source as supporting evidence.
  purpose: Combines repeat coverage of one event into one card, keeping every source as supporting evidence.
  logic: Signals are processed newest first. A signal joins an existing card when (a) its cleaned headline
    is identical, (b) the headline similarity is 0.85 or more, or (c) it has the same non-empty evidence
    sentence AND the same event date. The first (newest) signal of a group becomes the card. The link,
    publisher, source type and dates of every merged item are kept as supporting sources. If the card
    had no link and a merged item has one, the card takes that item's link and publisher.
  formula: Similarity = how closely two headlines match as text, ignoring capital letters and punctuation
    (0 means nothing in common, 1 means identical). Merge when similarity is 0.85 or more
  conditions:
  - The card's source is that of the newest item (or the first item with a link), not the most reliable
    of the merged sources
  constants:
  - label: Headline similarity threshold
    ref: scoring:live_signal.dedup_similarity
    stated: 0.85
  example:
    scenario: A news event 'Astra sets IDR 36 trillion capex for 2026' (23 Apr, no link) and a news coverage
      item 'Astra sets IDR 36 trillion capex for 2026 year' (24 Apr, IDNFinancials link).
    steps:
    - The similarity of the two headlines is 0.94, above 0.85, so they are the same event.
    - The 24 Apr item is newer, so it becomes the card; the 23 Apr item is kept as a supporting source.
    result: One card, with the headline from the 24 Apr item, the IDNFinancials link and 2 supporting
      sources.
    verified: true
    expect:
    - 1
    - Astra sets IDR 36 trillion capex for 2026 year
    - https://www.idnfinancials.com/x
    - 2
  output: Merged cards, each with a unique ID and its supporting sources.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_dedupe
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_canonical
  - hp-backend/src/app/services/extractors/signal_scoring.py:DEDUP_SIMILARITY
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 1 and section 7 steps 2-3; HP_Recommendation_Tuning_Logic_FINAL_v4.docx
    section B (Deduplication)
  confidence: high
- id: ls_score
  parent: null
  name: Live Signal Score (0-10)
  kind: score
  summary: One score per unique signal that ranks the feed.
  purpose: One score per unique signal that ranks the feed.
  logic: 'Three driver scores, each from 0 to 10, are weighted and added: Recency 30%, Signal Relevance
    & Impact 50%, Source Reliability 20%. The total is calculated by fixed rules and rounded once to 2
    decimals. AI is never asked for the total. Each signal is scored on its own; scores are never added
    across signals.'
  formula: Live Signal Score = 30% × Recency + 50% × Relevance & Impact + 20% × Source Reliability (rounded
    to 2 decimals)
  constants:
  - label: Recency weight
    ref: scoring:live_signal.weights.recency
    stated: 0.3
  - label: Relevance & Impact weight
    ref: scoring:live_signal.weights.relevance_impact
    stated: 0.5
  - label: Source Reliability weight
    ref: scoring:live_signal.weights.source_reliability
    stated: 0.2
  - label: Driver maximum
    ref: scoring:live_signal.driver_max
    stated: 10
  example:
    scenario: 'A worked example for an Astra capex signal: recency 4, relevance 6, source 8.'
    steps:
    - 4 × 0.30 = 1.20
    - 6 × 0.50 = 3.00
    - 8 × 0.20 = 1.60
    - 1.20 + 3.00 + 1.60 = 5.80
    result: 5.8 / 10
    verified: true
    expect: 5.8
  output: A score from 0 to 10 on each scored signal.
  sources:
  - hp-backend/src/app/services/extractors/signal_scoring.py:composite
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_composite
  - hp-backend/config/scoring.yaml:live_signal
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 2 and section 6 (Final Worked Astra Example)
  confidence: high
- id: ls_recency
  parent: ls_score
  name: 'Driver 1: Recency (30%)'
  kind: score
  summary: Rewards newer events.
  purpose: Rewards newer events.
  logic: Age in whole days = the date the feed is built minus the event date (never below 0). The first
    band whose upper limit the age does not exceed gives the points. Over 365 days scores 0, and so does
    no usable date. The explanation on the card names the event date ('event dated 23 Apr 2026') rather
    than an age, because an age would be out of date as soon as the feed was built.
  conditions:
  - A date with no time zone is treated as UTC
  - A future date would score as same day (10), but future dates are removed before scoring
  table:
    columns:
    - Age of signal
    - Recency points (0-10)
    rows:
    - - 0-7 days
      - 10
    - - 8-30 days
      - 8
    - - 31-90 days
      - 6
    - - 91-180 days
      - 4
    - - 181-365 days
      - 2
    - - over 365 days
      - 0
    - - no usable date
      - 0
  constants:
  - label: Recency bands (maximum age in days, points)
    ref: scoring:live_signal.recency_bands
    stated:
    - - 7
      - 10
    - - 30
      - 8
    - - 90
      - 6
    - - 180
      - 4
    - - 365
      - 2
  - label: Over 365 days
    ref: scoring:live_signal.recency_over_max
    stated: 0
  - label: No usable date
    ref: scoring:live_signal.recency_no_date
    stated: 0
  example:
    scenario: Published 23 Apr 2026, scored 17 Sep 2026.
    steps:
    - Age = 147 days.
    - 147 is above 90 and not above 180, so the score is 4 points.
    - 'Weighted: 4 × 0.30 = 1.20.'
    result: Recency = 4/10.
    verified: true
    expect:
    - 4
    - event dated 23 Apr 2026
  output: Recency points and the 'event dated' line.
  sources:
  - hp-backend/src/app/services/extractors/signal_scoring.py:recency_points
  - hp-backend/config/scoring.yaml
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 3
  confidence: high
- id: ls_relevance_impact
  parent: ls_score
  name: 'Driver 2: Signal Relevance & Impact (50%) - judged by AI'
  kind: model
  summary: How directly the event points to something HP can sell or service.
  purpose: How directly the event points to something HP can sell or service.
  logic: 'AI reads each signal''s date, category, publisher, headline (first 180 characters) and evidence
    (first 300 characters), plus a short summary of what is already known about the account. It must pick
    one level: 10, 8, 6, 3 or 0. It is told to take the highest level that any single piece of evidence
    supports (never to add levels) and not to raise the score for a need that merely might follow from
    the event. Whatever number comes back is limited to the range 0 to 10; it is not forced onto the 10/8/6/3/0
    ladder. Any recency or source reliability scores suggested by the AI are ignored and replaced by the
    values worked out by fixed rules. A short explanation is stored with the level, unless it contains
    a number or link that is not in the account''s news information. In that case only the explanation
    is withheld and the score stays.'
  conditions:
  - 'Levels are not added together: new factory (6) + hiring growth (6) = 6; new factory (6) + enterprise
    AI (8) = 8'
  - 'No-inference rule: a capex announcement stays 6 even though new facilities will later need equipment'
  - The AI also says whether the signal is really about this account. If it says no, the signal is removed
    from the feed (see 'What is published and in what order')
  - The AI is also asked which categories matched, but that list is not stored
  table:
    columns:
    - Level
    - Classification
    - Examples the AI is given
    rows:
    - - 10
      - Direct HP-addressable need
      - PC/AI-PC procurement or refresh, workstation requirement, print-fleet refresh, Poly collaboration-device
        requirement, device support/deployment/imaging, digital employee experience (DEX) or endpoint-security
        requirement, secure print
    - - 8
      - HP-relevant technology or workplace initiative
      - Enterprise/employee/on-device AI, workstation/HPC initiative, digital workplace, Windows migration,
        VDI, Zero Trust, print workflow modernisation, fleet sustainability
    - - 6
      - Major business change that could create HP demand
      - New office/HQ/factory/site, expansion, significant hiring, major capex, acquisition/merger/JV,
        new business unit
    - - 3
      - General account signal with weak HP connection
      - General partnership, customer-facing AI or product launch, cloud partnership, executive appointment,
        award
    - - 0
      - No meaningful HP connection
      - Share price, dividend, routine earnings, sponsorship, consumer promotion, unrelated legal news
  constants:
  - label: Signals judged together in one AI request
    ref: py:app.services.extractors.recent_news_signals:SCORING_BATCH_SIZE
    stated: 8
  - label: Revision number of the AI scoring guidance
    ref: py:app.services.extractors.recent_news_signals:SIGNAL_SCORING_PROMPT_VERSION
    stated: 18
  example:
    scenario: '''ASII sets IDR 36 trillion capex for 2026, up 10% year on year''.'
    steps:
    - The event states a major capital investment.
    - It does not state a PC, workstation, support, security or print requirement.
    - 'Highest supported level: 6 (major business change).'
    - 'Weighted: 6 × 0.50 = 3.00.'
    result: Relevance & Impact = 6/10 (an AI judgement; it cannot be reproduced by a fixed formula).
  output: A relevance score, a short explanation, whether the signal is about this account, the HP product
    line, the event status and the sales angle.
  sources:
  - hp-backend/src/app/services/extractors/recent_news_signals.py:_score_one_batch
  - hp-backend/src/app/services/extractors/recent_news_signals.py:score_news_signals
  - hp-backend/src/app/services/extractors/recent_news_signals.py:MODEL_SCORED_DIMS
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 4 (levels table and No-inference rule)
  confidence: high
- id: ls_source_reliability
  parent: ls_score
  name: 'Driver 3: Source Reliability (20%)'
  kind: score
  summary: Scores how verifiable the underlying source is, not the route by which it was found.
  purpose: Scores how verifiable the underlying source is, not the route by which it was found.
  logic: 'Checks run in this order and the first one that applies wins. 1) No link: a recognised publisher
    name decides (the account''s own name = 10, news aggregator = 3, established outlet = 8). Otherwise
    a news event record = 6 (structured data-provider record). Otherwise 0 (Unverifiable), or unclassified
    if only an unknown publisher name is given. 2) A news-search or redirect link is unwrapped to find
    the original web address, without going online. 3) If the link is still an aggregator link, the publisher
    name decides when it is recognised; a named publisher that is not recognised is left unclassified.
    4) Otherwise the website decides: regulator, stock exchange or government website = 10; aggregator
    or wire service = 3; established publication = 8; a company newsroom, investor relations, careers,
    filings or tender page (judged from the web address path or from a prefix such as ''newsroom.'' or
    ''ir.'') = 10; anything else is unclassified.'
  table:
    columns:
    - Points
    - Document classification
    - Client tier
    - Card label
    - What triggers it
    rows:
    - - 10
      - First-party or authoritative
      - T0
      - First-party
      - Regulator, stock exchange or government website; company newsroom, investor relations, careers,
        filing or tender page; or a publisher name matching the account
    - - 8
      - Established independent reporting
      - T1
      - Established news
      - Website or publisher name on the established-publisher list (for example Reuters, Bloomberg, Nikkei,
        IDNFinancials, Straits Times)
    - - 6
      - Structured third-party evidence
      - T2
      - Licensed data tool
      - A news event record with no link; also every unclassified source (see the sub-rule below)
    - - 3
      - Weak secondary evidence
      - T3
      - Long tail
      - News-aggregator or wire-service website (for example Yahoo, MSN, PR Newswire, Business Wire, LinkedIn,
        Medium)
    - - 0
      - Unverifiable
      - (none)
      - Unverifiable
      - No link and no publisher, or a link with no website name
  constants:
  - label: First-party points
    ref: scoring:live_signal.source_first_party
    stated: 10
  - label: Established points
    ref: scoring:live_signal.source_established
    stated: 8
  - label: Structured points
    ref: scoring:live_signal.source_structured
    stated: 6
  - label: Weak secondary points
    ref: scoring:live_signal.source_weak
    stated: 3
  - label: Unverifiable points
    ref: scoring:live_signal.source_unverifiable
    stated: 0
  example:
    scenario: A news item with an opaque link (nothing can be decoded) and publisher 'IDNFinancials'.
    steps:
    - The link cannot be unwrapped and is an aggregator link.
    - The publisher name 'IDNFinancials' matches an established outlet (idnfinancials.com).
    - 'Weighted: 8 × 0.20 = 1.60.'
    result: Source Reliability = 8/10 (T1 - Established news).
    verified: true
    expect: 8
  output: Source points and a short explanation of the basis.
  sources:
  - hp-backend/src/app/services/extractors/signal_scoring.py:source_reliability_points
  - hp-backend/src/app/services/extractors/signal_scoring.py:resolve_source_url
  - hp-backend/src/app/services/extractors/signal_scoring.py:_publisher_band
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 5
  confidence: high
- id: ls_source_first_party
  parent: ls_source_reliability
  name: First-party sources score 10
  kind: score
  summary: A company or regulator speaking directly is the strongest evidence.
  purpose: A company or regulator speaking directly is the strongest evidence.
  logic: '10 points when: the website is a listed regulator or stock exchange (such as sec.gov, idx.co.id,
    asx.com.au, sgx.com, bursamalaysia.com, set.or.th, pse.com.ph, hkex.com.hk, jpx.co.jp, krx.co.kr,
    nzx.com, londonstockexchange.com, nasdaq.com, nyse.com, edinet, dart) or ends in a government suffix
    (.gov, .go.id, .gov.sg, .go.jp and similar); or the web address path contains a marker such as newsroom,
    investor, press release, careers, annual report, disclosure, filings or tender; or the address has
    at least three parts and starts with newsroom., news., press., media., investor., investors., ir.,
    careers. or jobs.; or (with no usable link) the publisher name contains the account name or the other
    way round, provided the account name is at least 6 characters long with spaces removed. The path and
    prefix checks run after the established-publisher check, so a newspaper''s own press section stays
    at 8.'
  constants:
  - label: Minimum account-name length for publisher match
    value: 6
  example:
    scenario: Link https://newsroom.accenture.com/news/2026/x.
    steps:
    - It is not a regulator, aggregator or established outlet.
    - The address has 3 parts and starts with 'newsroom.'.
    result: 10 points, shown as 'first-party company page (newsroom subdomain)'.
    verified: true
    expect:
    - 10
    - first-party company page (newsroom subdomain)
  output: 10 points.
  sources:
  - hp-backend/src/app/services/extractors/signal_scoring.py:FIRST_PARTY_PATH_MARKERS
  - hp-backend/src/app/services/extractors/signal_scoring.py:FIRST_PARTY_HOST_PREFIXES
  - hp-backend/src/app/services/extractors/signal_scoring.py:AUTHORITATIVE_DOMAINS
  - hp-backend/src/app/services/extractors/signal_scoring.py:_publisher_band
  doc_source: HP_Live_Signal_Scoring_Logic.docx section 5, 10/10 row
  confidence: high
- id: ls_source_aggregator
  parent: ls_source_reliability
  name: Aggregators and wire services score 3
  kind: score
  summary: A repost where the original cannot be established is weak evidence.
  purpose: A repost where the original cannot be established is weak evidence.
