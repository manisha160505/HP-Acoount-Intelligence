  logic: 'A paragraph outside 70-100 words is still published, but it is sent back for one rewrite. The
    rewrite is requested for each signal separately, with a three-part structure: two sentences on what
    the event is, two connecting it to known account facts, and one on the next step. The rewrite replaces
    the original only if it passes the banned-phrase, repetition and invented-number checks and is no
