  code: The returned value is clamped to 0-10 but not snapped to those levels (hp-backend/src/app/services/extractors/recent_news_signals.py:863);
    prompt rule 1 also says 'A generic business update ... scores 3-4, not 6-7' (hp-backend/src/app/services/extractors/recent_news_signals.py:670).
  note: A model answer of 4 or 7 would be stored as-is.
