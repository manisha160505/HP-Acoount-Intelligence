- id: client_buying_committee_coverage
  parent: null
  name: HP buying-committee coverage (target roles)
  kind: selection
  summary: Reports which of HP's target roles for the account have a named person.
  purpose: Reports which of HP's target roles for the account have a named person.
  logic: 'Read from HP''s list of target roles for the account: every entry with a target role is a role,
    and it is ''filled'' when a contact name is given. Coverage % = filled roles / total roles × 100,
    rounded to 1 decimal (none when there are no roles). Reachable = filled roles with a work email or
    phone. Unfilled roles are listed with their reason (the contact status given, else ''no contact found'').
    A name is given only to a filled role. Coverage is recorded even when the account has target roles
    but no contacts on the roster.'
  formula: Coverage % = 100 × filled roles ÷ target roles, rounded to 1 decimal
  example:
    scenario: '3 roles: Head of Procurement (no name), IT Asset Manager (name + email), CFO (name, no
      email or phone).'
    steps:
    - Filled = 2, unfilled = 1
    - Reachable = 1 (only the IT Asset Manager has an email or phone)
    - 100 × 2 ÷ 3 = 66.7
    result: '2 of 3 roles filled (66.7%), 1 reachable, Head of Procurement listed as not covered: ''No
      suitable distinct candidate found'''
    verified: true
    expect:
      target_roles: 3
      filled_roles: 2
      roles_with_a_contact_detail: 1
      coverage_percent: 66.7
  output: A coverage summary stored with the account's Stakeholder Map data.
