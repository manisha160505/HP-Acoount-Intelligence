  name: Per-contact HP lines that may not be proposed
  kind: guardrail
  summary: Blocks HP product lines that do not follow from a contact's remit, by automatic check rather
    than by instruction alone.
  purpose: Blocks HP product lines that do not follow from a contact's remit, by automatic check rather
    than by instruction alone.
  logic: If the title contains a no-hardware remit term (employment relations, people experience, human
    resources, recruitment, payroll, tax, legal, audit, corporate communications, industrial relations,
    branch manager, product owner, business owner), EVERY HP product line is blocked. Otherwise a line
    is blocked when the title contains one of its listed terms (see the table). The list is given to the
    AI as 'do not propose' and enforced again after the text is written.
