# Rules page catalog for `stakeholder_map`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: stakeholder_map
purpose: Lists the people at the account, grouped by department and ordered by seniority, with an AI-written,
  automatically checked opening angle for each person.
final_output: A roster of contact cards (Senior contacts, meaning C-Suite and VP, first, then all other
  contacts) showing name, title, department, seniority badge, email, email status, phone, location and
  LinkedIn. Each card also shows a 'How to open' paragraph, HP play focus, decision power and potential
  pain points when they pass the quality checks. The tab also has a collapsible list of all departments,
  a strip of department counts as listed in the contact data, and a CSV export.
how_it_combines: Contacts whose provider match is not pending or under review are cleaned and given a
  department and a seniority band. A 0-100 stakeholder score combines seniority, HP relevance, influence, data completeness and priority,
  and selects the Priority Contacts that other features use. The page groups people by department and
  orders them by seniority. Each person gets an AI-written opening angle. Before it appears, it is checked
  for unsourced numbers or links, HP product lines that do not fit the person's role, and repeated labels.
rules:
- id: contact_intake
  parent: null
  name: Which contacts the map uses
  kind: selection
  summary: Decides which entries in the account's contact list appear on the Stakeholder Map.
  purpose: Decides which entries in the account's contact list appear on the Stakeholder Map.
  inputs:
  - The contact list supplied for the account (one entry per person)
  logic: Every entry in the account's contact list is read. Entries whose provider match is still pending
    or under review are set aside (see the sub-rule below). Every other entry becomes one contact, and
    only this list is used.
  output: The contact list used on the page. The number of entries set aside is recorded in the system
    log.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:extract_stakeholder_map
  doc_source: 'HP_Recommendation_Tuning_Logic_FINAL_v4.txt Input contract, Contacts row: ''Blank contact
    fields or Pending/Review status means do not infer the missing role, authority or contact detail'''
  confidence: high
- id: withhold_pending_review
  parent: contact_intake
  name: Match status check
  kind: guardrail
  summary: Builds stakeholder cards only from contacts whose provider match is not pending or under review.
  purpose: Builds stakeholder cards only from contacts whose provider match is not pending or under review.
  inputs:
  - The match status recorded for each contact
  logic: The match status is taken from the first place that records one, ignoring capital letters.
    If it contains any of the words pending, review, unmatched, not matched, no match or in progress,
    the contact is set aside and counted. Every other contact is kept.
  conditions:
  - 'Status contains ''pending'', ''review'', ''unmatched'', ''not matched'', ''no match'' or ''in progress'':
    set aside'
  - 'Any other status (for example ''Matched''): kept'
  constants:
  - label: Match statuses held for review
    ref: py:app.services.extractors.stakeholder_map:UNMATCHED_STATUS_WORDS
    stated:
    - pending
    - review
    - unmatched
    - not matched
    - no match
    - in progress
  - label: Places where the match status can be recorded (checked in order)
    ref: py:app.services.extractors.stakeholder_map:MATCH_STATUS_COLUMNS
    stated:
    - apollo_match_status
    - match_status
    - Match Status
    - Match status
    - match status
  example:
    scenario: Four contacts. Two have the statuses 'Pending review' and 'Needs Review'. The other two,
      such as 'Matched', contain none of the listed words.
    steps:
    - '''Pending review'' contains ''pending'', so it is set aside'
    - '''Needs review'' contains ''review'', so it is set aside'
    - The other two contain none of the words, so they are kept
    result: 2 contacts kept, 2 set aside.
    verified: true
    expect:
    - - apollo_match_status: Matched
      - Match Status: ''
    - 2
  output: The kept contacts and the number set aside.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:_drop_unmatched_contacts
  - hp-backend/src/app/services/extractors/stakeholder_map.py:UNMATCHED_STATUS_WORDS
  - hp-backend/src/app/services/extractors/stakeholder_map.py:MATCH_STATUS_COLUMNS
  doc_source: 'HP_Recommendation_Tuning_Logic_FINAL_v4.txt Contacts row: ''Pending/Review status means
    do not infer the missing role, authority or contact detail'''
  confidence: high
- id: contact_field_precedence
  parent: contact_intake
  name: Where each contact detail is taken from
  kind: source
  summary: The contact list can arrive in two different layouts that name their fields differently. This
    fixes which source wins for each detail.
  purpose: The contact list can arrive in two different layouts that name their fields differently. This
    fixes which source wins for each detail.
  logic: 'For each detail, the possible sources are tried in order and the first non-blank value is used.
    The values ''none'', ''null'', ''nan'' and ''[]'' (in any capitalisation) count as blank. Name: the
    contact''s full name, else first plus last name, else the contact''s title (a contact with neither a
    name nor a title has nothing to show and is left off the map). Title: the job title, then the title from the second provider''s layout.
    Department: the main job department, then the department from the second provider''s layout. Seniority:
    the main job level, then the seniority from the second provider''s layout. Email: the professional
    email, then the plain email, then the verified work email. Email status: the professional email status,
    then the plain email status, then the email verification status. Phone: the mobile phone, then the
    plain mobile phone, then the direct mobile phone. LinkedIn: the LinkedIn address, then the list of
    LinkedIn addresses, then the LinkedIn address from the second provider''s layout. Contact ID: the
    contact''s own identifier, otherwise one built from the company, name, email and LinkedIn address (the
    title stands in for the name only when there is no name, email or LinkedIn address). Location: city and country
    joined with a comma.'
  table:
    columns:
    - Detail
    - Sources tried in order
    rows:
    - - Full name
      - Full name -> first name + last name -> title (no name and no title -> contact left off)
    - - Title
      - Job title -> title from the second provider's layout
    - - Department (as delivered)
      - Main job department -> department from the second provider's layout
    - - Seniority (as delivered)
      - Main job level -> seniority from the second provider's layout
    - - Email
      - Professional email -> plain email -> verified work email
    - - Email status
      - Professional email status -> plain email status -> email verification status
    - - Phone
      - Mobile phone -> plain mobile phone -> direct mobile phone (then tidied)
    - - LinkedIn
      - LinkedIn address -> list of LinkedIn addresses -> LinkedIn address from the second provider's
        layout
    - - Skills / profile
      - Skills; work experience
    - - Location
      - City + country
  example:
    scenario: A contact whose job title cell says 'nan' and whose title from the second provider's layout
      says 'CTO'.
    steps:
    - '''nan'' counts as blank'
    - The next source gives 'CTO'
    result: 'Title shown: CTO'
    verified: true
    expect: CTO
  output: The value displayed for each detail (or 'Not disclosed' on the page when blank).
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:resolve_field
  - hp-backend/src/app/services/extractors/stakeholder_map.py:extract_stakeholder_map
  confidence: high
  internal: true
- id: phone_normalisation
  parent: contact_intake
  name: Phone number format
  kind: display
  summary: Shows phone numbers in international format, without the '.0' a spreadsheet number format
    can add.
  purpose: Shows phone numbers in international format, without the '.0' a spreadsheet number format
    can add.
  logic: A trailing '.0' is removed, then everything that is not a digit is stripped. A '+' is put in
    front when the original started with '+' or the number has 10 to 15 digits. Shorter numbers stay
    as plain digits. The digits themselves are never changed and no spacing is added.
  example:
    scenario: Phone entry '6281293986658.0'.
    steps:
    - Remove '.0' to get 6281293986658
    - 13 digits is between 10 and 15, so a '+' is added at the front
    result: '''+6281293986658'''
    verified: true
    expect: '+6281293986658'
  output: The phone number shown on the card.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:normalize_phone
  confidence: high
- id: source_label
  parent: contact_intake
  name: One source label for every contact
  kind: source
  summary: Gives every contact record the same source label for the contact data.
  purpose: Gives every contact record the same source label for the contact data.
  logic: 'Every contact record carries the same fixed source label (shown in the value below). Each contact
    is also marked as coming from one of two contact layouts: the second provider''s layout when the contact
    was requested or matched through that provider, otherwise the main layout. Content Studio uses this
    marker to decide who may be named in its copy.'
  constants:
  - label: Displayed source label
    ref: py:app.services.extractors.stakeholder_map:CONTACT_SOURCE_LABEL
    stated: Explorium + Contacts Waterfall Tools
  output: The source label stored with each contact record.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:CONTACT_SOURCE_LABEL
  - hp-backend/src/app/services/extractors/stakeholder_map.py:extract_stakeholder_map
  doc_source: 'Client, 27 Sep (quoted at stakeholder_map.py:300-302): ''let''s replace it to Explorium
    + Contacts Waterfall Tools'''
  confidence: high
- id: buying_persona_provenance
  parent: contact_intake
  name: When a contact carries its buying-committee persona
  kind: selection
  summary: Attaches a persona to the contact record only when its origin is known.
  purpose: Attaches a persona to the contact record only when its origin is known.
  logic: The buying-committee persona delivered with a contact is carried on the contact record when the
    contact is in the main layout, or when HP's persona coverage sheet assigned the person a target role
    at load time. Contacts from the second provider's layout carry a persona only with such an assignment,
    because the 'Requested Role' on those records is the role that was searched for, not the person's
    own role. The persona as delivered is used when working out the influence type, whatever its origin
    (see the influence type rule).
  output: The persona stored on the contact, used when writing opening angles and by Content Studio.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:extract_stakeholder_map
  - scripts/split_account_data.py:attach_personas
  confidence: high
- id: persona_attachment_at_load
  parent: contact_intake
  name: HP target-role persona added when the data is loaded
  kind: source
  summary: Puts HP's own target-role assignment onto the matching contact.
  purpose: Puts HP's own target-role assignment onto the matching contact.
  logic: When the contact data is loaded, each contact is matched to HP's persona coverage sheet by its
    row number in the second provider's export, or else by the main provider's person identifier. On
    a match, the contact is given HP's target role, with a note of where the match came from and how it
    was made. Only this match sets the persona; it is never inferred from a similar title.
  example:
    scenario: A contact with source row '185'; the coverage sheet maps row 185 to 'CTO'. A second contact
      has no source row or identifier.
    steps:
    - Row 185 is found in the coverage sheet, so the persona is 'CTO'
    - The contact with no row number or identifier is left without a persona
    result: The first contact's persona is CTO; the second contact has no persona.
  output: The buying-committee persona on the stored contact list.
  sources:
  - scripts/split_account_data.py:attach_personas
  confidence: high
- id: department_normalisation
  parent: null
  name: Department names unified
  kind: selection
  summary: Department codes and short labels from the two contact layouts are mapped to one department
    list so that contacts group together.
  purpose: Department codes and short labels from the two contact layouts are mapped to one department
    list so that contacts group together.
  logic: The department as delivered is split on ';' or ','. The first part (other than 'c_suite') that
    is in the mapping table wins. If only 'c_suite' is present, the department is 'Executive'. If nothing
    maps, the delivered text is shown in title case as it is.
  table:
    columns:
    - Department as delivered
    - Unified department
    rows:
    - - information technology (also 'it' or 'data')
      - Information Technology
    - - engineering and technical (also 'engineering')
      - Engineering & Technical
    - - operations
      - Operations
    - - finance
      - Finance
    - - legal
      - Legal
    - - marketing
      - Marketing
    - - sales
      - Sales
    - - human resources
      - Human Resources
    - - product management
      - Product Management
    - - consulting
      - Consulting
    - - c_suite (on its own)
      - Executive
    - - anything else
      - The delivered text in title case
  constants:
  - label: Department mapping
    ref: py:app.services.extractors.stakeholder_map:DEPT_LABELS
  example:
    scenario: Department delivered as 'c_suite; master_operations'.
    steps:
    - Skip c_suite
    - '''master_operations'' is the operations department, so it maps to Operations'
    result: Operations
    verified: true
    expect: Operations
  output: 'The unified department: shown under each name and used for the department groups and the Department
    filter.'
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:normalize_department
  - hp-backend/src/app/services/extractors/stakeholder_map.py:DEPT_LABELS
  confidence: high
- id: seniority_banding
  parent: null
  name: Seniority band from the job level
  kind: selection
  summary: Puts every contact into one of five seniority bands.
  purpose: Puts every contact into one of five seniority bands.
  logic: 'The job level as delivered (ignoring brackets, quotes and capital letters) is looked up: c_suite,
    c-suite or cxo = C-Suite; vp or vice_president = VP; director or head = Director; manager or owner
    = Manager; anything else = Individual Contributor. A ''Head of ...'' title therefore bands
    as Director, not VP. A C-Suite tag is confirmed against the title (see the sub-rule below).'
  table:
    columns:
    - Job level as delivered
    - Band
    rows:
    - - c_suite, c-suite, cxo
      - C-Suite
    - - vp, vice_president
      - VP
    - - director, head
      - Director
    - - manager, owner
      - Manager
    - - anything else
      - Individual Contributor
  example:
    scenario: Job level 'head', title 'Head of IT Infrastructure'.
    steps:
    - '''head'' maps to Director'
    result: Director, no conflict flag
    verified: true
    expect:
    - Director
    - false
  output: 'The seniority band: the only badge on each card. It sets the roster order and the Senior contacts
    section.'
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:seniority_band
  - hp-backend/src/app/services/extractors/stakeholder_map.py:SENIORITY_BAND_MAP
  confidence: high
- id: c_suite_corroboration
  parent: seniority_banding
  name: A C-Suite tag needs an executive title
  kind: selection
  summary: Shows a contact as C-Suite only when the job title confirms an executive role.
  purpose: Shows a contact as C-Suite only when the job title confirms an executive role.
  logic: When the band would be C-Suite, the title must be an executive title (Chief ... Officer, CEO,
    CIO, COO, CTO, CFO, CISO, President, Managing Director) and must not contain the word 'office'. Otherwise
    the band is Manager and the contact is flagged with a seniority conflict. The original title is kept
    as listed.
  constants:
  - label: Band used when the C-Suite tag is not backed up by the title
    ref: py:app.services.extractors.stakeholder_map:SENIORITY_UNCORROBORATED_BAND
    stated: Manager
  example:
    scenario: Job level 'c_suite', title 'CIO Office'.
    steps:
    - '''CIO'' matches the executive titles'
    - but the title contains the word 'office'
    - so the title does not confirm the C-Suite tag
    result: Manager, marked as a seniority conflict
    verified: true
    expect:
    - Manager
    - true
  output: The seniority band, plus a seniority-conflict flag stored with the contact.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:seniority_band
  - hp-backend/src/app/services/extractors/stakeholder_map.py:EXECUTIVE_TITLE_RE
  - hp-backend/src/app/services/extractors/stakeholder_map.py:OFFICE_NAME_RE
  - hp-backend/src/app/services/extractors/stakeholder_map.py:SENIORITY_UNCORROBORATED_BAND
  doc_source: 'HP_ABX_v3_final Feature 3 rule 4 (quoted at stakeholder_map.py:117-119): ''If the mapped
    seniority does not fit the original title, keep the original title and send only the mapped field
    for review.'''
  confidence: high
- id: stakeholder_score
  parent: null
  name: Stakeholder score (used to rank and select contacts)
  kind: score
  summary: A 0-100 score per contact that selects Priority Contacts and ranks contacts for other features.
  purpose: A 0-100 score per contact that selects Priority Contacts and ranks contacts for other features.
  logic: Five components, each from 0 to 100, are combined using fixed weights and rounded to a whole
    number. Every component is calculated by fixed rules. Scores, bands, influence types, priorities
    and relevance are always set by these rules, never by AI.
  formula: Stakeholder score = round(25% × Seniority + 25% × HP relevance + 20% × Influence + 15% × Data
    completeness + 15% × Priority)
  constants:
  - label: Weights
    ref: py:app.services.extractors.stakeholder_map:COMPOSITE_WEIGHTS
    stated:
      seniority: 0.25
      hp_relevance: 0.25
      influence: 0.2
      data_completeness: 0.15
      priority: 0.15
  example:
    scenario: Head of IT Procurement; job level 'head'; department 'it'; persona 'IT Decision Maker';
      valid email, phone, LinkedIn, skills 'SAP'.
    steps:
    - 'Seniority: ''head'' gives Director, which is 50'
    - 'HP relevance: the title contains ''procurement'' (top tier), so 100; the skill bonus is capped
      at 100, so 100'
    - 'Influence: the title contains ''procurement'', so Budget Holder, which is 85'
    - 'Data completeness: 20 base + 15 LinkedIn + 20 email + 10 valid + 20 phone + 15 profile = 100'
    - 'Priority: IT department, Director (not C-Suite or VP), so Medium, which is 50'
    - 0.25 × 50 + 0.25 × 100 + 0.20 × 85 + 0.15 × 100 + 0.15 × 50 = 12.5 + 25 + 17 + 15 + 7.5 = 77
    result: Stakeholder score 77; HP relevance band high; Priority Contact = yes (77 is at least 60 and
      the band is not low)
    verified: true
    expect:
      band: Director
      influence: Budget Holder
      components:
        seniority: 50
        hp_relevance: 100
        influence: 85
        data_completeness: 100
        priority: 50
      composite: 77
      relevance_band: high
      priority_contact: true
  output: A stakeholder score, the five component scores and a Priority Contact flag on each contact,
    used by other features.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:COMPOSITE_WEIGHTS
  - hp-backend/src/app/services/extractors/stakeholder_map.py:composite_score
  - hp-backend/src/app/services/extractors/stakeholder_map.py:extract_stakeholder_map
  doc_source: HP_ABX_v3_final formula as quoted in code (stakeholder_map.py:90-92) and widget registry
    text for stakeholder_influence_map
  confidence: high
- id: score_seniority
  parent: stakeholder_score
  name: Seniority component
  kind: score
  summary: Converts the seniority band into points.
  purpose: Converts the seniority band into points.
  logic: C-Suite 100, VP 75, Director 50, Manager 25, Individual Contributor 10. Unknown bands score as
    Individual Contributor.
  table:
    columns:
    - Band
    - Points
    rows:
    - - C-Suite
      - 100
    - - VP
      - 75
    - - Director
      - 50
    - - Manager
      - 25
    - - Individual Contributor
      - 10
  constants:
  - label: Seniority points
    ref: py:app.services.extractors.stakeholder_map:SENIORITY_SCORES
    stated:
      C-Suite: 100
      VP: 75
      Director: 50
      Manager: 25
      Individual Contributor: 10
  example:
    scenario: A VP.
    steps:
    - VP gives 75
    result: '75'
    verified: true
    expect: 75
  output: The seniority component (0-100).
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:SENIORITY_SCORES
  - hp-backend/src/app/services/extractors/stakeholder_map.py:score_seniority
  confidence: high
- id: score_hp_relevance
  parent: stakeholder_score
  name: HP relevance component
  kind: score
  summary: How close a contact's role sits to HP's product lines.
  purpose: How close a contact's role sits to HP's product lines.
  logic: 'The text searched is the title plus the unified department name (ignoring capital letters; a
    keyword counts if it appears anywhere in the text, even inside a longer word). Start from the department''s
    own tier (Information Technology 70, Engineering & Technical 70, Operations 40, Product Management
    40, Executive 40, otherwise 0). Then check the keyword tiers from the top: the first tier that is
    higher than the current value and has a keyword in the text sets the value. If the value is still
    0, a floor of 20 applies. Then: a clearly non-IT title caps the result at 40 (with no skill bonus).
    Otherwise, if the contact''s skills mention SAP, Azure, AWS, AutoCAD, CATIA, VMware, Cisco or Windows,
    add 10 (maximum 100).'
  table:
    columns:
    - Tier
    - Keywords (title or department text)
    rows:
    - - 100
      - procurement, infrastructure, end user, end-user, workplace, device, fleet, cio, chief information,
        information technology
    - - 70
      - engineer, architect, network, data cent, data centre, data center, cloud, devops, security, developer,
        technology
    - - 40
      - operations, product, executive, business
    - - Cap of 40
      - 'Non-IT title: employment relations, people experience, human resources, recruitment, payroll,
        tax, legal, audit, corporate communications, industrial relations'
    - - '+10'
      - 'Skills mention: sap, azure, aws, autocad, catia, vmware, cisco, windows'
    - - Floor of 20
      - Nothing matched
  constants:
  - label: Non-IT cap
    ref: py:app.services.extractors.stakeholder_map:NON_IT_TITLE_CAP
    stated: 40
  - label: Floor
    ref: py:app.services.extractors.stakeholder_map:HP_RELEVANCE_FLOOR
    stated: 20
  - label: Skill bonus
    ref: py:app.services.extractors.stakeholder_map:HP_SKILL_BONUS
    stated: 10
  - label: Department starting tiers
    ref: py:app.services.extractors.stakeholder_map:HP_RELEVANCE_DEPT_TIERS
    stated:
      Information Technology: 70
      Engineering & Technical: 70
      Operations: 40
      Product Management: 40
      Executive: 40
  example:
    scenario: Cloud Architect in Engineering & Technical with skills 'Azure, AWS'.
    steps:
    - The department tier is 70
    - '100-tier keywords: none present'
    - The 70 tier is not higher than 70, so stop
    - Skills mention Azure, so add 10
    result: '80'
    verified: true
    expect: 80
  output: The HP relevance component (0-100).
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:score_hp_relevance
  - hp-backend/src/app/services/extractors/stakeholder_map.py:HP_RELEVANCE_TIERS
  - hp-backend/src/app/services/extractors/stakeholder_map.py:HP_RELEVANCE_DEPT_TIERS
  - hp-backend/src/app/services/extractors/stakeholder_map.py:NON_IT_TITLE_TERMS
  confidence: high
- id: hp_relevance_department_text
  parent: score_hp_relevance
  internal: true
  name: Information Technology department reaches the top relevance tier
  kind: score
  summary: Contacts in the Information Technology department score in the top relevance tier.
  purpose: Contacts in the Information Technology department score in the top relevance tier.
  logic: The department name is part of the searched text, and 'information technology' is a top-tier
    keyword. So every contact whose unified department is Information Technology (including 'it' and
    'data' as delivered) scores 100, unless the title is non-IT (then 40). A Sales Manager listed under
    IT therefore scores 100.
  example:
    scenario: Title 'Sales Manager', department Information Technology.
    steps:
    - The searched text is 'sales manager information technology'
    - '''information technology'' is a 100-tier keyword'
    result: '100'
    verified: true
    expect: 100
  output: The HP relevance component.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:score_hp_relevance
  - hp-backend/src/app/services/extractors/stakeholder_map.py:HP_RELEVANCE_TIERS
  confidence: high
- id: non_it_title_cap
  parent: score_hp_relevance
  name: Relevance cap for non-IT titles
  kind: filter
  summary: Keeps HR, tax, legal and similar roles at medium relevance or below, whatever their department.
  purpose: Keeps HR, tax, legal and similar roles at medium relevance or below, whatever their department.
  logic: If the title contains employment relations, people experience, human resources, recruitment,
    payroll, tax, legal, audit, corporate communications or industrial relations, the relevance is the
    lower of its tier and 40, and no skill bonus is added.
  example:
    scenario: An Employment Relations Lead filed under Information Technology.
    steps:
    - The department text alone would give 100
    - The title contains 'employment relations', so the cap of 40 applies
    result: '40'
    verified: true
    expect: 40
  output: The HP relevance component.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py:score_hp_relevance
  confidence: high
- id: hp_relevance_band
  parent: score_hp_relevance
  name: HP relevance band
  kind: guardrail
  summary: Turns the relevance score into high, medium or low.
  purpose: Turns the relevance score into high, medium or low.
  logic: 70 or more = high; 40 to 69 = medium; below 40 = low.
  table:
    columns:
    - Score
    - Band
    rows:
    - - 70 or more
      - high
    - - 40-69
      - medium
    - - Below 40
