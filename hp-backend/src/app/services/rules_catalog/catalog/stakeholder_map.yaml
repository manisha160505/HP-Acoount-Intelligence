      10.'
    steps:
    - 0.25 × 25 + 0.25 × 40 + 0.20 × 50 + 0.15 × 55 + 0.15 × 10 = 6.25 + 10 + 10 + 8.25 + 1.5 = 36
    - 36 is below 60
    result: 'Score 36: not a Priority Contact'
    verified: true
