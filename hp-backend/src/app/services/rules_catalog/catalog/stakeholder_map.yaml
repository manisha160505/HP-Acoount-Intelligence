- id: prompt_instructions
  parent: talking_points
  name: What the AI is instructed to do (judged by AI, not enforced by checks)
  kind: model
  summary: Records the instructions whose compliance depends on the AI.
  purpose: Records the instructions whose compliance depends on the AI.
  logic: These instructions depend on the AI following them; there is no automatic check. HP plays must
    be 'earned' through the chain role + persona + account trigger or technology -> product. Otherwise
    the play focus is 'Account engagement / discovery' and no product is named. How to open is written
    in the first person, in 40 to 90 words. Every contact gets a different angle, and no trigger is used
    for more than two contacts. The HP play focus is a short label. Decision power is limited by the supplied
    influence type (Budget Holder may discuss budget and procurement authority; Decision Maker participates
    in or owns decisions, not sole authority; Technical Evaluator evaluation and standards only; Influencer
    advisory only) and is left out for roles whose remit does not reach hardware. Pain points must be
    hedged ('may', 'could' and similar), name an evidence item and the pressure on the function, otherwise
    they are left out. No reporting lines are stated. Competitor products are never called 'our'. The
    40-90 word range is NOT checked automatically.
  constants:
  - label: Opener minimum words (requested, not checked automatically)
    ref: py:app.services.extractors.stakeholder_map:OPENER_MIN_WORDS
    stated: 40
  - label: Opener maximum words (requested, not checked automatically)
    ref: py:app.services.extractors.stakeholder_map:OPENER_MAX_WORDS
    stated: 90
  output: The AI's output before the automatic checks.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py
  doc_source: 'HP_Recommendation_Tuning_Logic_FINAL_v4.txt formatting table: ''Stakeholder Map | How to
    Open + HP Play Focus | Minimum 40 words; maximum 100 words.'''
  confidence: high
