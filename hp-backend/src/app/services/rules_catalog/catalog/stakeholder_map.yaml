- id: prompt_instructions
  parent: talking_points
  name: Writing instructions given to the AI
  kind: model
  summary: The instructions the AI follows when writing each opening angle.
  purpose: The instructions the AI follows when writing each opening angle.
  logic: The AI is instructed as follows. An HP play must be 'earned' through the chain role + persona
    + account trigger or technology -> product; otherwise the play focus is 'Account engagement / discovery'
    and no product is named. How to open is written in the first person, in 40 to 90 words. Every contact
    gets a different angle, and no trigger is used for more than two contacts. The HP play focus is a
    short label. Decision power stays within the supplied influence type (Budget Holder may discuss budget
    and procurement authority; Decision Maker participates in or owns decisions, not sole authority; Technical
    Evaluator evaluation and standards only; Influencer advisory only), and is omitted for roles whose
    remit does not reach hardware. Each pain point is worded tentatively ('may', 'could' and similar)
    and names an evidence item and the pressure on the function; otherwise it is omitted. Reporting lines
    are never stated. Competitor products are never called 'our'.
  constants:
  - label: Opener length, minimum words
    ref: py:app.services.extractors.stakeholder_map:OPENER_MIN_WORDS
    stated: 40
  - label: Opener length, maximum words
    ref: py:app.services.extractors.stakeholder_map:OPENER_MAX_WORDS
    stated: 90
  output: The AI's output before the automatic checks.
  sources:
  - hp-backend/src/app/services/extractors/stakeholder_map.py
  doc_source: 'HP_Recommendation_Tuning_Logic_FINAL_v4.txt formatting table: ''Stakeholder Map | How to
    Open + HP Play Focus | Minimum 40 words; maximum 100 words.'''
