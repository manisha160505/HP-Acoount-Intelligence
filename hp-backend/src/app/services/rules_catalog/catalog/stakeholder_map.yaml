- id: influence_type
  parent: stakeholder_score
  name: Influence type (buying role) rules
  kind: selection
  summary: Labels each contact Budget Holder, Decision Maker, Technical Evaluator or Influencer from title,
    seniority and department.
  purpose: Labels each contact Budget Holder, Decision Maker, Technical Evaluator or Influencer from title,
    seniority and department.
  logic: 'The rules are checked in this order and the first one that applies wins (a title term counts
    if it appears anywhere in the lower-case title). 1) The title contains procurement, infrastructure
    strategy, purchasing or sourcing: Budget Holder. 2) The band is C-Suite: Decision Maker. 3) The title
    contains a hands-on technical term: Technical Evaluator. 4) The band is VP or Director AND the department
    is Information Technology or Engineering & Technical AND the title is not non-IT: Decision Maker.
    5) The persona assigned to the contact contains ''business decision maker'': Influencer. 6) The persona
    contains ''decision maker'': Decision Maker only if the department is Information Technology, Engineering
    & Technical or Executive and the title is not non-IT; otherwise Influencer. 7) Otherwise: Influencer.
    These rules assign one of the four types above. The rule that decided the outcome is recorded.'
  table:
    columns:
    - Order
    - Condition
    - Result
    - Reason recorded
    rows:
    - - 1
      - Title has procurement / infrastructure strategy / purchasing / sourcing
      - Budget Holder
      - Budget term in title
    - - 2
      - Seniority band is C-Suite
      - Decision Maker
      - C-Suite band
    - - 3
      - Title has infrastructure, engineer, engineering, collaboration, 'it' followed by a space, network,
        cloud, system, technology, developer, software, application, architect, end user, end-user, data
        governance, technical, devops, operations excellence
      - Technical Evaluator
      - Technical term in title
    - - 4
      - VP or Director in Information Technology / Engineering & Technical, title not non-IT
      - Decision Maker
      - Senior in IT or engineering
    - - 5
      - Persona contains 'business decision maker'
      - Influencer
      - Business persona, not IT
    - - 6
      - Persona contains 'decision maker', department IT / Engineering / Executive, title not non-IT
      - Decision Maker
      - Decision-maker persona in IT, engineering or executive
    - - 6b
      - Persona contains 'decision maker' otherwise
      - Influencer
      - Decision-maker persona outside IT
    - - 7
      - None of the above
      - Influencer
      - Default
  constants:
  - label: Budget holder title terms
    ref: py:app.services.extractors.stakeholder_map:BUDGET_HOLDER_TITLE_TERMS
    stated:
    - procurement
    - infrastructure strategy
    - purchasing
    - sourcing
  - label: Technical title terms
    ref: py:app.services.extractors.stakeholder_map:TECHNICAL_TITLE_TERMS
    stated:
    - infrastructure
    - engineer
    - engineering
    - collaboration
    - 'it '
    - network
    - cloud
    - system
    - technology
    - developer
    - software
    - application
    - architect
    - end user
    - end-user
    - data governance
    - technical
    - devops
    - operations excellence
  example:
    scenario: Tax Division Head, Director, department Information Technology, persona 'IT Decision Maker'.
    steps:
    - No budget term
    - Not C-Suite
    - No technical term
    - Director in IT, but the title contains 'tax' (non-IT), so rule 4 is skipped
    - The persona is not 'business decision maker'
    - The persona has 'decision maker' but the title is non-IT, so Influencer
    result: Influencer (decision-maker persona outside IT)
    verified: true
    expect:
    - Influencer
    - persona_outside_it
  output: The influence type, which feeds the influence component and sets the limits on the decision
    power an opening angle may describe.
