  summary: Marks the contacts that other features (Content Studio) may name first.
  purpose: Marks the contacts that other features (Content Studio) may name first.
  logic: 'A contact is a Priority Contact when the stakeholder score is 60 or more AND the HP relevance
    band is not low. There is no fixed number of Priority Contacts. Coverage check: if no Priority Contact
    is a Budget Holder but the roster has at least one Budget Holder, the highest-scoring Budget Holder
    is also made a Priority Contact (the first one in list order if there is a tie).'
