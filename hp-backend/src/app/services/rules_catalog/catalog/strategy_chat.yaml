# Rules page catalog for `strategy_chat`. Read by app/services/rules_catalog.
# `ref:` values are read live; `stated` is what the prose was written against.
# Examples marked `verified` are recomputed by tests/test_rules_examples.py.
feature_key: strategy_chat
purpose: Lets a seller ask questions about one account (advisor mode) or rehearse a conversation with
  the role of one of its real stakeholders (roleplay mode). Answers come only from what the account's
  dashboard shows.
final_output: 'One of three things: a structured answer (a short answer, optional supporting facts, optional
  recommended next steps) with footnote citations to dashboard sections; an in-character rehearsal reply;
  or a short message that explains why no answer is shown.'
how_it_combines: 'Every answer is built only from the account''s dashboard sections.

  - Advisor mode: the AI writes its reply as a series of short parts, each labelled as a fact, a conclusion,
  a recommendation or general advice. Each part is checked. For example, a fact must quote the section
  it cites word for word. If a part does not pass, the AI revises the answer. Only parts that pass are
  shown.

  - Roleplay mode: the AI plays the role of a real stakeholder, never the person by name. Every sentence
  that states something cites a dashboard section.'
rules:
- id: sc_snapshot_widget
  parent: null
  name: Account snapshot at the top of the chat
  kind: selection
  summary: Shows what the chat is based on and offers starter questions.
  purpose: Shows what the chat is based on and offers starter questions.
  inputs:
  - Executive summary
  - Opportunity plays
  - Technology map
  - Intent topics
  - Recent news signals
  - Strategic priorities
  logic: 'Built only from what the account''s other dashboard sections show, so every number matches
    the page it comes from. A count shows a dash until its section has content.

    Counts: solutions = the number of plays on the Opportunity Map; installed vendors = the total number
    of technologies detected on the technology map; live signals = the total number of news signals; intent
    topics = the total number of intent topics; priorities = the number of strategic priorities.

    Lists: the first 5 intent topics, the first 15 different vendors from the technology map, and the
    first 5 news headlines in the order the feed shows them.

    The company name comes from the executive summary, otherwise from the account record. The snapshot
    appears once the account has a company name.

    Six standard starter questions are written using the company name.'
  constants:
  - label: Topics shown
    ref: py:app.services.extractors.strategy_chat:MAX_SNAPSHOT_TOPICS
    stated: 5
  - label: Vendors shown
    ref: py:app.services.extractors.strategy_chat:MAX_SNAPSHOT_VENDORS
    stated: 15
  - label: Signals shown
    ref: py:app.services.extractors.strategy_chat:MAX_SNAPSHOT_SIGNALS
    stated: 5
  example:
    scenario: Account 'Astra'.
    steps:
    - Write the six starter questions
    result: 'Six starter questions: entry point, what to sell, who to act on, AI PCs, objections, revenue.'
    verified: true
    expect:
    - - entry_point
      - Who is the strongest entry point at Astra, and why?
    - - what_to_sell
      - Based on Astra's own evidence, which HP line has the strongest case right now?
    - - who_to_act_on
      - There are a lot of signals for Astra. Which ones should I act on first?
    - - ai_pcs
      - Who should I message at Astra about AI PCs, and what should I open with?
    - - objections
      - What objections should I expect from Astra, and how do I handle each one?
    - - revenue
      - Tell me about Astra's revenue and what it means for our approach.
  output: Counts, the short lists above, and six starter questions.
  sources:
  - hp-backend/src/app/services/extractors/strategy_chat.py:extract_strategy_chat
  - hp-backend/src/app/services/extractors/strategy_chat.py:_suggested_prompts
  doc_source: 'Client feedback 27 Sep: ''Strategy Chat - please drop mention of 22 stakeholders'''
  confidence: high
- id: sc_interface_widget
  parent: null
  name: Which sections the chat can use
  kind: selection
  summary: Says which dashboard sections the chat can draw on.
  purpose: Says which dashboard sections the chat can draw on.
  logic: 'Lists which of these sections have content for the account: Executive Dashboard, Stakeholder
    Map, Recent Signals, Tech Landscape, Intent & Demand and Opportunity Map. The list appears once at
    least one of them has content.'
  sources:
  - hp-backend/src/app/services/extractors/strategy_chat.py:extract_strategy_chat
  confidence: high
- id: sc_context_payload
  parent: null
  name: 'What the chat reads: the whole account'
  kind: selection
  summary: Gives the AI every dashboard section of the account at once.
  purpose: Gives the AI every dashboard section of the account at once.
  logic: 'Every dashboard section of the account that has content is included, except those of Content
    Studio, Message Evaluator and Strategy Chat itself. Each one is labelled with its name and the feature
    it belongs to, followed by its content.

    Order: a set priority list comes first (the executive summary first, the technology detections list
    last). Any other section follows in alphabetical order.

    The AI reads every included section in full, with nothing shortened. An account above 900,000 characters
    is logged for review and still read in full. Only this one account''s information is used.'
  constants:
  - label: Size warning level (characters)
    ref: py:app.services.strategy.context:MAX_PAYLOAD_CHARS
    stated: 900000
  - label: Features left out
    ref: py:app.services.strategy.context:EXCLUDED_FEATURES
    stated:
    - content_studio
    - message_evaluator
    - strategy_chat
  - label: Order of dashboard sections
    ref: py:app.services.strategy.context:PRIORITY_ORDER
    stated:
    - exec_summary_card
    - exec_key_metrics
    - exec_strategic_priorities
    - exec_urgency_score
    - hiring_postings_summary
    - stakeholder_contacts_grid
    - stakeholder_influence_map
    - stakeholder_talking_points
    - news_signals_feed
    - news_relevance_summary
    - opportunity_narrative_plays
    - opportunity_trigger_signals
    - opportunity_context_card
    - objection_reframe_cards
    - objection_incumbent_context
    - technographic_map
    - technographic_hp_recommendations
    - tech_stack_matrix
    - webstack_breakdown
    - intent_topics_table
    - intent_category_summary
    - hiring_family_breakdown
    - hiring_theme_cards
    - hiring_tech_tags
    - tech_detections_reference
  example:
    scenario: Where do the executive summary and a new, unlisted section sort?
    steps:
    - The executive summary is first in the priority list
    - Sections not on the list go after all listed ones
    result: The executive summary sorts first (position 0). A new unlisted section sorts after every listed
      one, in alphabetical order.
    verified: true
    expect:
    - - 0
      - 0
    - - 1
      - zzz_new_widget
  sources:
  - hp-backend/src/app/services/strategy/context.py:account_widgets
  - hp-backend/src/app/services/strategy/context.py:build
  confidence: high
- id: sc_small_talk
  parent: null
  name: Greetings get an instant reply
  kind: selection
  summary: Simple greetings such as 'hi' get an instant standard reply without calling the AI.
  purpose: Simple greetings such as 'hi' get an instant standard reply without calling the AI.
  logic: If the question is shorter than 3 characters, or matches a short list of everyday phrases (hi,
    hello, thanks, ok, help, what can you do, and so on), a standard greeting is returned. In roleplay
    the greeting stays in character, for example 'You have my attention. I am the <title> here...'.
  example:
    scenario: Three inputs.
    steps:
    - '''hi'' is a greeting'
    - '''Who is the CEO?'' is a question'
    - '''ok'' is a greeting'
    result: Greeting, question, greeting.
    verified: true
    expect:
    - true
    - false
    - true
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_is_small_talk
  - hp-backend/src/app/services/strategy/chat.py:_greeting
  confidence: high
- id: sc_question_resolution
  parent: null
  name: Follow-up questions keep their context
  kind: guardrail
  summary: Lets a follow-up such as 'what about them?' work, while facts still come only from the dashboard.
  purpose: Lets a follow-up such as 'what about them?' work, while facts still come only from the dashboard.
  logic: 'The first question is used as written. For a follow-up, the AI reads the last 12 turns of the
    conversation and replaces words like ''them'' or ''that'' with what they refer to. It also tags the
    question with one topic: stakeholder, priority, technology, objection, opportunity, evidence or general.
    The tag is a label only; the AI still reads the whole account. When it answers, the AI also sees up
    to 12 earlier turns, and every fact comes from the account''s dashboard, not from earlier answers.'
  constants:
  - label: Earlier turns considered
    ref: py:app.services.strategy.chat:MAX_HISTORY_TURNS
    stated: 12
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_resolve_question
  - hp-backend/src/app/services/strategy/chat.py:_answer_turns
  confidence: high
- id: sc_advisor_answer
  parent: null
  name: 'Advisor answer: labelled parts'
  kind: model
  summary: How an advisor answer is built from short, labelled parts that are each checked.
  purpose: How an advisor answer is built from short, labelled parts that are each checked.
  logic: 'The AI writes the answer as a list of short parts. Each part is labelled as a fact, a conclusion,
    a recommendation or general advice, and has a display style (paragraph, bullet, heading or label).
    A fact is either read directly from a section or worked out from it, such as a count or a comparison.

    Layout: an ''ANSWER:'' section every time; a ''FACTS:'' list (up to 5 points, or up to 8 for a multi-part
    question) when it helps; and ''RECOMMENDED NEXT STEPS:'' (2-3 actions) when the question asks what
    to do.

    The AI sizes the answer to the question and keeps it concise. The answer does not quote the platform''s
    own scores (relevance, priority, urgency or confidence).

    Up to 60 parts are read per answer.

    Each conclusion and recommendation is linked to the parts it rests on. When the AI does not name them,
    it is linked to the facts above it, or to the facts that name the same things.'
  table:
    columns:
    - Label
    - Must include
    - Must not add
    rows:
    - - Fact (read or worked out)
      - One or more of the account's dashboard sections, and a quote found word for word in a cited section
      - No further limits
    - - Conclusion
      - The parts it rests on
      - Any name or figure not found in those parts, their sections or the account's information
    - - Recommendation
      - The parts it rests on (optional)
      - Names or figures not found in the account's information, apart from plan figures (week 1, 30 days,
        30/60/90) and plan or channel words
    - - General
      - No further requirements
      - The company name, or any figure other than a plan figure
  constants:
  - label: Maximum parts read per answer
    ref: py:app.services.strategy.claims:MAX_SEGMENTS
    stated: 60
  - label: Answer-rules version
    ref: py:app.services.strategy.chat:PROMPT_VERSION
    stated: 8
  sources:
  - hp-backend/src/app/services/strategy/chat.py:ANSWER_SYSTEM
  - hp-backend/src/app/services/strategy/claims.py:parse
  - hp-backend/src/app/services/strategy/claims.py:_infer_dependencies
  confidence: high
- id: sc_fact_check
  parent: sc_advisor_answer
  name: Fact check
  kind: guardrail
  summary: Every fact quotes the section it cites.
  purpose: Every fact quotes the section it cites.
  logic: 'A fact passes only when: it cites at least one section; every cited section belongs to this
    account (this keeps accounts separate); it has a quote; and the quote appears word for word in the
    account''s information and in a cited section.'
  example:
    scenario: A fact citing the technology table with the quote 'SolidWorks', which the account's information
      does not contain. A conclusion naming Siemens. A general-advice part containing '4,000 seats'.
    steps:
    - 'Part c1: its quote is not in the account''s information'
    - Part c2 names 'siemens' (and also rests on c1)
    - Part c3 is general advice but carries a figure
    result: None of the three parts passes.
    verified: true
    expect:
    - false
    - - id: c1
        reason: its quote 'SolidWorks' does not appear in this account's data
      - id: c2
        reason: it names siemens, which does not appear in this account's evidence
      - id: c3
        reason: it carries a figure, so it is a claim about the account
    - []
  sources:
  - hp-backend/src/app/services/strategy/claims.py:_segment_failure
  confidence: high
- id: sc_synthesis_check
  parent: sc_advisor_answer
  name: Conclusion and recommendation checks
  kind: guardrail
  summary: Conclusions and recommendations use only what the account's data contains.
  purpose: Conclusions and recommendations use only what the account's data contains.
  logic: A conclusion names the parts it rests on. A conclusion or recommendation passes only when every
    part it rests on is in the answer, and every figure, capitalised name (at least 3 letters, not at
    the start of a sentence, not all capitals) and HP product line it mentions appears in those parts,
    their sections or the account's information. Words from the company name and from the question are
    always allowed. A recommendation may also use plan figures and plan or channel words (linkedin, email,
    webinar, workshop, phase, week, pilot, brief, demo, and so on).
  constants:
  - label: Channel words
    ref: py:app.services.strategy.claims:GENERIC_CHANNELS
    stated:
    - email
    - inmail
    - linkedin
    - newsletter
    - roadshow
    - webinar
    - workshop
  example:
    scenario: 'A valid answer: two quoted facts, a conclusion built on them, and the recommendation ''Open
      on the CAD estate in week 1, then send three touches over 30 days.'''
    steps:
    - The quotes 'AutoCAD' and 'Critical' are found in their sections
    - The conclusion introduces nothing new
    - '''Week 1'' and ''30 days'' are plan figures'
    result: Valid. The cited sections are the technology matrix and the opportunity plays.
    verified: true
    expect:
    - true
    - []
    - - tech_stack_matrix
      - opportunity_narrative_plays
  sources:
  - hp-backend/src/app/services/strategy/claims.py:_synthesis_introduces
  - hp-backend/src/app/services/strategy/claims.py:_recommendation_introduces
  confidence: high
- id: sc_plan_figures
  parent: sc_synthesis_check
  name: Plan figures
  kind: selection
  summary: Numbers that belong to the seller's plan, not to the customer.
  purpose: Numbers that belong to the seller's plan, not to the customer.
  logic: A figure counts as a plan figure when it appears as '<unit> N' (week 2, phase 1, weeks 1-4),
    'N <unit>' (30 days, 90-day, 3 touches) or 'N/N' (30/60/90). The units are day, week, month, quarter,
    year, hour, minute, touch, email, call, meeting, session, follow-up, step, phase, sprint, wave and
    message. Numbers written in words ('three') are not counted as figures.
  example:
    scenario: '''three touches over 30 days, week 2 and a 90-day plan, 30/60/90'''
    steps:
    - 30 days
    - week 2
    - 90-day
    - 30/60/90
    result: 'Plan figures: 2, 30, 60, 90.'
    verified: true
    expect:
    - '2'
    - '30'
    - '60'
    - '90'
  sources:
  - hp-backend/src/app/services/strategy/claims.py:_PLAN_FIGURE_RE
  - hp-backend/src/app/services/strategy/claims.py:_plan_figures
  confidence: high
- id: sc_whole_answer_checks
  parent: sc_advisor_answer
  name: Whole-answer checks
  kind: guardrail
  summary: A final check over the full answer before it is shown.
  purpose: A final check over the full answer before it is shown.
  logic: 'A part passes only when every part it rests on also passes. Then, across the remaining text,
    every figure (outside recommendations) and every HP product line named (phrases starting with HP,
    Poly, or Z by HP), including in recommendations, must appear in the account''s information.'
  example:
    scenario: The answer says 'Lead with HP Wolf Security.' but the account's information never mentions
      it.
    steps:
    - Read the product name as 'HP Wolf Security'
    - It is not in the account's information
    result: 'Flagged: the answer names HP Wolf Security.'
    verified: true
    expect: HP Wolf Security
  sources:
  - hp-backend/src/app/services/strategy/claims.py:validate
  - hp-backend/src/app/services/strategy/claims.py:_unsupported_hp_line
  confidence: high
- id: sc_retry_partial
  parent: sc_advisor_answer
  name: Revising an answer
  kind: selection
  summary: How the AI revises an answer so that only checked parts are shown.
  purpose: How the AI revises an answer so that only checked parts are shown.
  logic: The AI has up to 3 attempts. After each attempt, it gets a note on each part that did not pass
    (up to 8 notes) so it can correct them. If a reply runs too long, the AI is asked for a much shorter
    answer. If the AI service does not return a usable reply, the 'AI service' message is shown straight
    away. After the last attempt, the parts that passed (and rest only on parts that passed) are checked
    again and shown, and any heading with nothing under it is removed. If no substantive part remains,
    the 'Not evidenced' message is shown.
  constants:
  - label: Attempts
    internal: true
    ref: py:app.services.strategy.chat:MAX_VALIDATION_ATTEMPTS
    stated: 3
  example:
    scenario: The three-part answer from the fact check, after the last attempt.
    steps:
    - None of the three parts passed
    - No part remains to show
    result: The seller sees the 'Not evidenced' message instead.
    verified: true
    expect: []
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_answer_advisor
  - hp-backend/src/app/services/strategy/claims.py:surviving
  - hp-backend/src/app/services/strategy/claims.py:repair_notes
  confidence: high
- id: sc_render
  parent: sc_advisor_answer
  name: Citations shown to the seller
  kind: display
  summary: Each checked part shows the dashboard sections it comes from.
  purpose: Each checked part shows the dashboard sections it comes from.
  logic: Facts show their own sections. Conclusions and recommendations show all the sections of the
    parts they rest on. General advice needs none. Citations appear as tags at the end of each line and
    as footnotes labelled with the section name and its feature. A copy without the tags is also provided.
  example:
    scenario: The valid answer from the conclusion and recommendation checks.
    steps:
    - Show the answer with its citations
    result: Each line ends with its section tags.
    verified: true
    expect: 'ANSWER:


      Their estate runs AutoCAD and CATIA. [tech_stack_matrix]


      Workstations are rated Critical. [opportunity_narrative_plays]


      So the workstation line has the strongest case. [tech_stack_matrix, opportunity_narrative_plays]

      - Open on the CAD estate in week 1, then send three touches over 30 days. [tech_stack_matrix]'
  sources:
  - hp-backend/src/app/services/strategy/claims.py:render
  - hp-backend/src/app/services/strategy/chat.py:_citation
  - hp-backend/src/app/services/strategy/chat.py:SECTION_LABELS
  confidence: high
- id: sc_roleplay_personas
  parent: null
  name: Roleplay personas
  kind: selection
  summary: Who the seller can rehearse against.
  purpose: Who the seller can rehearse against.
  logic: The seller rehearses against the account's real stakeholder contacts that have a specific job
    title. Titles that are blank, '-', n/a, none, employee, staff, member or unknown are not offered.
    Contacts are sorted by stakeholder score, highest first. The person's name appears in the menu, and
    the AI is given the role, not the name - the title, department, seniority, influence, decision power,
    the HP focus for that person, up to 4 recorded pain points and up to 5 objection cards that the same
    title is expected to raise. Only the account's own personas can be chosen. Roleplay mode always has a persona, and a
    persona is used only in roleplay mode.
  example:
    scenario: A COO contact with 5 pain points and one objection.
    steps:
    - Write the role lines
    - Use the first 4 pain points
    - Add the 1 objection
    result: A role brief for the title, without the person's name.
    verified: true
    expect: 'You are playing THE CHIEF OPERATING OFFICER.

      - Department: Executive

      - Seniority: C-Suite

      - Influence in the buying group: Decision Maker

      - A concern recorded against this role [stakeholder_talking_points]: a

      - A concern recorded against this role [stakeholder_talking_points]: b

      - A concern recorded against this role [stakeholder_talking_points]: c

      - A concern recorded against this role [stakeholder_talking_points]: d

      - An objection this role is expected to raise [objection_reframe_cards]: We already standardise
      on Dell'
  sources:
  - hp-backend/src/app/services/strategy/personas.py:options
  - hp-backend/src/app/services/strategy/personas.py:resolve
  - hp-backend/src/app/services/strategy/personas.py:prompt_block
  - hp-backend/src/app/api/v1/widgets.py:_check_chat_mode
  confidence: high
- id: sc_roleplay_validator
  parent: sc_roleplay_personas
  name: Roleplay reply checks, sentence by sentence
  kind: guardrail
  summary: The role sounds real, and everything it states comes from the account's data.
  purpose: The role sounds real, and everything it states comes from the account's data.
  logic: 'A reply passes only when: every cited section belongs to this account; no stakeholder''s name
    appears (full names, and each part of a name longer than 4 characters); every sentence that states
    something cites a valid section and shares a meaningful word with it; and every figure has a source.
    Short filler (''ok'', ''go on'', ''hmm'', and so on), questions and sentences with no meaningful words
    need no citation. Bold markers and a speaker label at the start are ignored. There are 3 attempts.
    If none passes, a message outside the role says ''The rehearsal stopped here'' and suggests rephrasing
    or switching to Strategy Advisor.'
  constants:
  - label: Reply must share wording with its cited section
    ref: py:app.services.strategy.chat:ROLEPLAY_REQUIRE_SECTION_OVERLAP
    stated: true
  example:
    scenario: Three replies.
    steps:
    - '''Hmm. Go on. We run AutoCAD and CATIA [technology section]. What would switching gain us?'' passes'
    - '''Talk to Santoso about it.'' names a real person'
    - '''We are locked into a three-year agreement.'' cites no source'
    result: The first reply passes; the other two do not.
    verified: true
    expect:
    - - true
      - ok
    - - false
      - it named a real person (Santoso) - the role speaks, never the individual
    - - false
      - 'it said 1 thing(s) in character with no source: We are locked into a three-year agreement.'
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_validate_roleplay
  - hp-backend/src/app/services/strategy/personas.py:banned_names
  confidence: high
- id: sc_roleplay_starters
  parent: sc_roleplay_personas
  name: Rehearsal starter suggestions
  kind: model
  summary: Openers built from the persona's own evidence.
  purpose: Openers built from the persona's own evidence.
  logic: 'There is always ''Make your opening''. Then one ''Handle: <area>'' for each of the first 2 matching
    objections. Then ''Probe the concern'' if the persona has recorded pain points. Finally, ''Test the
    fit'' is always offered.'
  example:
    scenario: A persona with 3 objections and pain points.
    steps:
    - Opening
    - 2 objections
    - Pain point
    - Fit test
    result: 5 starter suggestions.
    verified: true
    expect:
    - open
    - objection_0
    - objection_1
    - pain
    - why_you
  sources:
  - hp-backend/src/app/services/strategy/personas.py:suggested_prompts
  confidence: high
- id: sc_prose_validator
  parent: null
  name: Sentence citation check
  kind: guardrail
  summary: Every sentence that states something must carry a citation.
  purpose: Every sentence that states something must carry a citation.
  logic: Every cited section must be in the account's information. Every sentence that states something
    carries a valid citation, up to any 'Next steps:' or 'Recommendations:' heading. Filler, bare headings
    and sentences that say the data does not cover a point (such as 'does not hold') need no citation.
    All figures must be
    in the account's information. Bold and heading marks are removed before the check.
  example:
    scenario: Three answers.
    steps:
    - One states the figure 500, which the account's information does not contain
    - One cites the key metrics, which are not in the account's information
    - '''They run AutoCAD.'' has no citation'
    result: None of the three passes.
    verified: true
    expect:
    - - false
      - 'it states figure(s) that are not in the evidence: 500'
    - - false
      - 'it cited 1 section(s) that are not in this account''s data: exec_key_metrics'
    - - false
      - 'it states 1 thing(s) about the account without citing any evidence: They run AutoCAD.'
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_validate
  - hp-backend/src/app/services/strategy/chat.py:_asserts_facts
  - hp-backend/src/app/services/strategy/chat.py:_claim_sentences
  confidence: high
- id: sc_streaming
  parent: null
  name: Streaming safety
  kind: guardrail
  summary: Nothing unchecked is shown while the reply appears.
  purpose: Nothing unchecked is shown while the reply appears.
  logic: Advisor answers do not appear bit by bit. The whole answer is checked first and then shown at
    once. Roleplay shows only the first attempt as it arrives, and only up to the last complete citation,
    and only if that part passes the same checks. Later attempts are prepared silently and replace what
    was shown.
  sources:
  - hp-backend/src/app/services/strategy/chat.py:_stream_advisor
  - hp-backend/src/app/services/strategy/chat.py:answer_stream
  - hp-backend/src/app/services/strategy/chat.py:_validated_prefix
  confidence: high
  internal: true
- id: sc_scope_check
  parent: null
  name: Off-topic check
  kind: guardrail
  summary: A question unrelated to the account gets a short reply that steers back to the account.
  purpose: Keeps the chat focused on the account and on selling to it.
  logic: Before the account is read, the AI looks at the question alone - could it relate to the account,
    its market, HP or selling to it? Only a question with no plausible link (a poem, a recipe, a sports
    result, coding help, personal advice, a request to reveal the instructions) gets the off-topic reply.
    Anything ambiguous is answered as normal, as is any question the check does not classify. This check
    looks only at the question; what the account's data covers is decided by the evidence checks. Greetings
    are answered before this check.
  example:
