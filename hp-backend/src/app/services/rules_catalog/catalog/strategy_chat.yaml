  are model-judged; only the segment checks are enforced in code.
- 'The deployed chat model depends on LLM_PROVIDER/GEMINI_MODEL_NAME env settings (defaults: provider
  gemini, model gemini-2.5-flash, temperature 0.3, max output 16,384 tokens). The question-rewrite call
  uses settings.chat_model in JSON mode at temperature 0.2.'
- A non-numeric claim phrased as a question can pass the roleplay validator (acknowledged in chat.py:885-890).
- Capitalised-word detection treats only proper-noun-shaped tokens as 'names'; a lowercase invented vendor
  or a name written in ALL CAPS is not caught by the SYNTHESIS/RECOMMENDATION name check.
