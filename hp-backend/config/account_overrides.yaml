# Per-account display overrides. Loaded by src/app/config/account_overrides.py.
#
# Edit this file - not the code - to hide a feature or the parent company for
# one account. Keys are the account's name exactly as the platform holds it
# (`name_for_upload` in the account's _account.json, e.g. "MINISTRY OF
# DEFENCE - MY"); matching ignores case and repeated spaces. A name that matches
# no account does nothing, so check the spelling against the admin page.
#
# Fields:
#   hidden_features      feature keys removed from this account's sidebar, its
#                        widget API and Strategy Chat. Keys as in
#                        api/v1/feature_mapping.py (FEATURE_MAPPINGS).
#                        Sections are still generated - other features read them.
#   hide_parent_company  true = no "Parent Company" line on the Executive
#                        Dashboard (and none in Strategy Chat). Regenerate the
#                        Executive Dashboard after changing it.
#
# An unknown field or feature key stops the backend at startup, on purpose: a
# typo here would otherwise silently show what the client asked us to hide.

authority: "Client decisions on the open data gaps, 8 Oct 2026 (HP_Open_Types_Company_Domain.xlsx, Open Types by Account)"

accounts:
  # Intent hidden: no Bombora topics and every PredictLeads HP category score is 0.
  # Tech Landscape hidden: government accounts with no technology data.
  # Parent hidden: Explorium holds a parent the client has not confirmed.
  "BANK FOR AGRICULTURE AND AGRICULTURAL COOPERATIVE - TH":
